  # Contacts are saved mostly by first name or nickname plus context, e.g.
  # "Joy Officemate", "Jun Tricycle", "Aling Nena Tindahan", "Kuya Grab".
  # Family/elders get kinship honorifics instead of names: "Mama", "Nanay",
  # "Mommy", "Tatay", "Papa", "Kuya Jun" (older brother/older male), "Ate Joy"
  # (older sister/older female), "Tita Baby", "Tito Boy", "Lola", "Lolo",
  # "Ninang Cora", "Ninong Bert" (godparents), "Mare"/"Pare" (co-parents),
  # "Bes", "Beh", "Mahal"/"Hon"/"Babe" (partner). Older relatives' house nicknames
  # (Baby, Boy, Bong, Inday, Neneng, Toto, Bebot, Dodong, Dading) are used as the
  # saved name. The schema has one `display` string only (see report).
  display: "{first} {last}"
cultures:
  # Muslim Filipinos (Moro: Maguindanao, Maranao, Tausug, ...): 6.4% of
  # household population (PSA 2020 census, religion). Arabic/Malay given names,
  # titles Datu/Bai/Hadji/Sitti. Distinct naming culture; no pack yet.
  - {culture: ph-moro, share: 0.064}
  # Chinese-Filipinos (Tsinoy): ~1.35 M (~1.2%) per community estimates;
  # census self-reported Chinese ethnicity only 102,577 (0.1%). Common Tsinoy
  # surnames are already in the main pool; this share covers Chinese given
  # names / Hokkien naming. No zh pack yet.
  - {culture: zh, share: 0.012}
  # Foreign citizens: 78,396 (0.07%) in 2020; Indians 24.2%, US 8.0% of them
  # (PSA). Indian-Filipino community (incl. informal "5-6" lenders) is larger
  # than the citizen count; US share excludes dual citizens.
  - {culture: in, share: 0.001}
  - {culture: us, share: 0.001}
email:
  # Estimates (authored): Gmail dominates; Yahoo persists among 1990s/2000s
  # account holders. Playful handles are common ("angel_cute23", "jp.reyes08").
  domains:
    - {domain: gmail.com, share: 0.76}
    - {domain: yahoo.com, share: 0.11}
    - {domain: ymail.com, share: 0.02}
    - {domain: hotmail.com, share: 0.04}
    - {domain: outlook.com, share: 0.03}
    - {domain: icloud.com, share: 0.03}
    - {domain: yahoo.com.ph, share: 0.01}
  patterns: ["{first}{last}", "{first}.{last}", "{first}_{last}{yy}", "{f}{last}", "{first}{last}{yy}", "{last}.{first}"]
services:
  # Alphanumeric sender IDs as registered with the telcos (max 11 chars). The
  # exact casing per brand is authored from common screenshots and may differ.
  # E-wallets / mobile money (GLoan, GGives, GCredit come from "GCash"; Maya
  # Credit/Easy Credit from "Maya")
