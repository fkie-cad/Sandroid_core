names:
  culture: ph
  # Naming: given name(s) + middle name + surname, where the "middle name" is the
  # MOTHER'S MAIDEN SURNAME (Juan Reyes dela Cruz), often written as an initial
  # ("Juan R. dela Cruz"). Sons named after fathers carry "Jr." and are then
  # called "Jun"/"Junjun"/"Jon-Jon". Compound given names are common (Mary
  # Grace, John Paul, Ma. Theresa = "Ma." abbreviates Maria). Creative spellings
  # and blends (Jhoanna, Jhon, Honeylyn, Jonalyn, Jay-ar) are normal.
  # Surnames are mostly Spanish-derived (Clavería catalogue 1849); Chinese-
  # Filipino surnames (Tan, Lim, Sy, Go, Uy, Chua, Ong, Yap, Co, Yu) are common
  # and included; native surnames (Dimaculangan, Macaraeg, Panganiban,
  # Cabahug, Agbayani) included at lower weights. Lowercase particles
  # ("dela Cruz", "delos Santos") are kept as written in PSA documents; both
  # "Dela Cruz" and "dela Cruz" occur.
  female:   # 128 entries
    - {name: "Maria", w: 1.0}
    - {name: "Mary Grace", w: 1.0}
    - {name: "Mary Joy", w: 1.0}
    - {name: "Kristine", w: 1.0}
