      - {prefix: "993", length: 10, operator: DITO}
      - {prefix: "994", length: 10, operator: DITO}
    # NTC does not publish a machine-readable number-block allocation table
    # (none found on ntc.gov.ph; an FOI request on the topic exists but was not
    # retrievable). The blocks below are absent from libphonenumber's PH mobile
    # pattern (is_valid_number = False) AND from every third-party prefix list
    # checked (S4, S5, S6). Confidence: LOW-MEDIUM. Because libphonenumber
    # rejects them, apps that validate numbers may refuse these contacts.
    unallocated:
      - {prefix: "901", length: 10, note: "not in libphonenumber PH mobile pattern 9(0[5-9]..); in no prefix list", source: S3}
      - {prefix: "902", length: 10, note: "not in libphonenumber PH mobile pattern; in no prefix list", source: S3}
      - {prefix: "903", length: 10, note: "not in libphonenumber PH mobile pattern; in no prefix list", source: S3}
      - {prefix: "980", length: 10, note: "not in libphonenumber pattern 98[135-9]; in no prefix list", source: S3}
      - {prefix: "982", length: 10, note: "not in libphonenumber pattern 98[135-9]; in no prefix list", source: S3}
      - {prefix: "984", length: 10, note: "not in libphonenumber pattern 98[135-9]; in no prefix list", source: S3}
      - {prefix: "990", length: 10, note: "not in libphonenumber pattern 99[1-9]; in no prefix list", source: S3}
    # No official fiction/drama range exists in the Philippine numbering plan
    # (searched NTC, Wikipedia, press). Local TV shows blur numbers instead.
    fiction: null
  landline:
    # Since 2019-10-06 Metro Manila (+ Rizal, parts of Cavite/Bulacan) uses
    # 8-digit subscriber numbers (first digit = operator: 8 PLDT, 7 Globe,
    # 3 Bayan, 5 Eastern, 6 Converge...). Provinces keep 7 digits.
    cities:
      - {city: Metro Manila, area_code: "2", subscriber_length: 8}
      - {city: Cebu City, area_code: "32", subscriber_length: 7}
      - {city: Davao City, area_code: "82", subscriber_length: 7}
      - {city: Iloilo City, area_code: "33", subscriber_length: 7}
      - {city: Bacolod, area_code: "34", subscriber_length: 7}
      - {city: Baguio, area_code: "74", subscriber_length: 7}
      - {city: Cagayan de Oro, area_code: "88", subscriber_length: 7}
      - {city: General Santos, area_code: "83", subscriber_length: 7}
      - {city: Zamboanga City, area_code: "62", subscriber_length: 7}
      - {city: Dasmariñas, area_code: "46", subscriber_length: 7}
      - {city: Tacloban, area_code: "53", subscriber_length: 7}
    fiction: null
  validation_note: >-
    libphonenumber 9.0.43 (S3): every `realistic` prefix is valid and typed
    MOBILE; all `unallocated` prefixes (901-903, 980, 982, 984, 990) are
    INVALID (also 900, 904, 913, 940, 941). The disputed 0904/0913/0940/0941
    are listed as live by community lists but invalid in libphonenumber, so
    they were kept out of both levels. Landlines (02 8xxx xxxx, 0XX xxx xxxx)
    validate as FIXED_LINE. No fiction ranges exist to test.
carriers:
  # Brands on shared networks: TNT and Sun run on Smart (515-03); TM and GOMO on
  # Globe (515-02). Shares are rough brand estimates of active SIMs from
  # operator 2024-25 reports (Smart group ~48%, Globe group ~43%, DITO ~9%).
  # sim_operator = SPN shown in the status bar.
  - {name: Globe, sim_operator: "Globe", mccmnc: "51502", share: 0.22}
  - {name: TM, sim_operator: "TM", mccmnc: "51502", share: 0.21}
  - {name: Smart, sim_operator: "SMART", mccmnc: "51503", share: 0.18}
  - {name: TNT, sim_operator: "TNT", mccmnc: "51503", share: 0.30}
  - {name: DITO, sim_operator: "DITO", mccmnc: "51566", share: 0.09}
