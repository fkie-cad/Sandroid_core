# Philippines country pack (schema v1). Sources: ph.SOURCES.md (S1..Sn).
pack: country
schema: 1
country: ph
name: Philippines
# Shares of locally written text (SMS/chat). "fil" here means everyday Taglish:
# Tagalog/Filipino matrix with heavy English code-switching ("san ka na? omw na
# ako"). English-only texts are common for banks/work/formal use. Cebuano
# (Bisaya) is the main SMS language in Cebu, Bohol, most of Mindanao (Davao,
# CDO, GenSan). Hiligaynon, Ilocano, Waray, Kapampangan, Bikol exist regionally
# but are not modelled (no language packs).
languages: {fil: 0.55, en: 0.30, ceb: 0.15}
timezones: [Asia/Manila]          # single zone, UTC+8, no DST
date_format: "MM/dd/yyyy"         # US-style is the norm (11/20/2026); "Nov 20" in chat
time_format: "h:mm a"             # 12-hour; SMS often "3pm", "3:30PM", "alas-tres"
currency: {code: PHP, symbol: "₱", format: "₱1,499.00"}
# SMS writes amounts as "P1,499.00", "PHP 1,499.00" or "Php1,499" (banks/GCash
# use "PHP"); people write "1.5k", "500 pesos", "P500".
phone:
  country_code: "63"
  trunk_prefix: "0"
  national_format_examples: ["0917 123 4567", "0998 765 4321", "(02) 8123 4567", "(032) 234 5678"]
  # People save mobiles as "09171234567" or "+639171234567" (no spaces) far more
  # often than in the libphonenumber display format.
  mobile:
    # Mobile NSN = 10 digits (9XX + 7). Prefix->operator per libphonenumber
    # carrier metadata (S3) cross-checked with community prefix lists (S4, S5).
    # Mobile Number Portability (RA 11202, live since 2021-09) means a prefix no
    # longer proves the current network. Prefixes where sources disagree
    # (0904, 0913, 0924, 0934, 0940, 0941, 0944) are left out on purpose.
    realistic:
      - {prefix: "905", length: 10, operator: Globe/TM}
      - {prefix: "906", length: 10, operator: Globe/TM}
      - {prefix: "915", length: 10, operator: Globe/TM}
      - {prefix: "916", length: 10, operator: Globe/TM}
      - {prefix: "917", length: 10, operator: Globe}
      - {prefix: "926", length: 10, operator: Globe/TM}
      - {prefix: "927", length: 10, operator: Globe/TM}
      - {prefix: "935", length: 10, operator: Globe/TM}
      - {prefix: "936", length: 10, operator: Globe/TM}
      - {prefix: "945", length: 10, operator: Globe/TM}
      - {prefix: "953", length: 10, operator: Globe/TM}
      - {prefix: "954", length: 10, operator: Globe/TM}
      - {prefix: "955", length: 10, operator: Globe/TM}
      - {prefix: "956", length: 10, operator: Globe/TM}
      - {prefix: "965", length: 10, operator: Globe/TM}
      - {prefix: "966", length: 10, operator: Globe/TM}
      - {prefix: "967", length: 10, operator: Globe/TM}
      - {prefix: "975", length: 10, operator: Globe/TM}
      - {prefix: "976", length: 10, operator: Globe/GOMO}
      - {prefix: "977", length: 10, operator: Globe/TM}
      - {prefix: "995", length: 10, operator: Globe/TM}
      - {prefix: "997", length: 10, operator: Globe/TM}
      - {prefix: "907", length: 10, operator: Smart/TNT}
      - {prefix: "908", length: 10, operator: Smart/TNT}
      - {prefix: "909", length: 10, operator: Smart/TNT}
      - {prefix: "910", length: 10, operator: Smart/TNT}
      - {prefix: "912", length: 10, operator: Smart/TNT}
      - {prefix: "918", length: 10, operator: Smart}
      - {prefix: "919", length: 10, operator: Smart/TNT}
      - {prefix: "920", length: 10, operator: Smart/TNT}
      - {prefix: "921", length: 10, operator: Smart/TNT}
      - {prefix: "928", length: 10, operator: Smart/TNT}
