  # Sheng-style short forms (-o / -yo endings) are how friends are commonly saved.
  nicknames: {Kevin: Kevo, Brian: Brayo, Collins: Collo, Dennis: Denno, Stephen: Stevo,
    Fredrick: Fredo, Michael: Mike, Samuel: Sam, Daniel: Dan, Patrick: Pato, Nicholas: Nick,
    Benson: Ben, Kennedy: Ken, Anthony: Tony, Joseph: Joe, Francis: Franco, Emmanuel: Emmah,
    Edwin: Eddie, Victor: Vic, Elizabeth: Liz, Margaret: Maggie, Catherine: Cate,
    Josephine: Josie, Christine: Chris, Jacqueline: Jackie, Jackline: Jackie, Maureen: Mau,
    Ochieng: Ochi, Mwangi: Mwas, Kimani: Kim, Otieno: Otis, Kiprono: Kip}
  # Contacts are typically saved "{first} {last}" with the Christian name first and the
  # ethnic/family name second ("Brian Otieno", "Faith Wanjiku"). Very common extras that the
  # schema cannot express (proposed: `display_variants` with weights):
  #  - teknonyms: "Mama Wanjiru", "Mama Brayo", "Baba Otieno", "Mama Kevo"
  #  - role/trade tags: "Mama Mboga", "Boda Peter", "Fundi Juma", "Landlord", "Caretaker",
  #    "John Mpesa Agent", "Mama Mboga Kiosk", "Peter Mjengo", "Kinyozi", "Mechanic Ochi"
  #  - place/context tags: "Kevo Campo", "Faith Church", "Wanjiru Chama", "Sam Work",
  #    "Ann Ruiru", "Denno Shags" (shags = upcountry home)
  #  - family: "Mum", "Mathe", "Dad", "Buda", "Shosh", "Guka", "Cucu", "Bro", "Sis",
  #    "Auntie Grace", "Uncle Sam", "Cuz Brian", "Hubby", "Wifey", "Bae"
  #  - duplicates for second SIM: "Kevo Saf", "Kevo Airtel", "Mum 2"
  display: "{first} {last}"
cultures:
  # KNBS 2019 Census Vol. IV ethnic affiliation (S4). Shares of 47.56 M.
  - {culture: so, share: 0.058}    # Somali (2,780,502), incl. Kenyan Somali of the north-east and Eastleigh
  - {culture: in, share: 0.0019}   # Kenyan Asians + non-citizen Asians (90,527), predominantly Indian-origin
  - {culture: ar, share: 0.0012}   # Kenyan Arabs (59,021), coast
  - {culture: gb, share: 0.0015}   # Kenyan Europeans + non-citizen Europeans (69,621), largely British
email:
  # Authored estimate: Gmail dominates (Android-first market); Yahoo persists among 35+.
  domains:
    - {domain: gmail.com, share: 0.82}
    - {domain: yahoo.com, share: 0.08}
    - {domain: outlook.com, share: 0.03}
    - {domain: hotmail.com, share: 0.03}
    - {domain: icloud.com, share: 0.02}
    - {domain: ymail.com, share: 0.01}
  patterns: ["{first}{last}", "{first}.{last}", "{first}{last}{yy}", "{last}{first}", "{f}{last}",
             "{first}{digits:3}", "{first}.{last}{yy}", "{first}_{last}"]
services:
  # Alphanumeric sender IDs in Kenya are max 11 chars, no spaces (S9). Spellings are the
  # common ones observed in Kenyan inboxes (authored, best effort; S9 confirms MPESA,
  # Safaricom, JUMIA). Kinds are restricted to schema v1; the comment gives the proposed
  # finer kind (see report: mobile_money, lender, betting).
  # --- mobile money (proposed kind: mobile_money) ---
  - {sender: MPESA, kind: mobile_money, sender_type: alphanumeric}          # M-PESA confirmations, Fuliza, Lipa na M-PESA; THE key harvest target
  - {sender: M-SHWARI, kind: mobile_money, sender_type: alphanumeric}       # Safaricom/NCBA savings & loan
  - {sender: AIRTELMONEY, kind: mobile_money, sender_type: alphanumeric}    # Airtel Money
  - {sender: T-KASH, kind: mobile_money, sender_type: alphanumeric}         # Telkom T-Kash
  # --- banks ---
  - {sender: EquityBank, kind: bank, sender_type: alphanumeric}
  - {sender: KCB, kind: bank, sender_type: alphanumeric}
  - {sender: Co-opBank, kind: bank, sender_type: alphanumeric}
  - {sender: NCBA, kind: bank, sender_type: alphanumeric}
  - {sender: ABSA_KENYA, kind: bank, sender_type: alphanumeric}
  - {sender: FamilyBank, kind: bank, sender_type: alphanumeric}
  - {sender: StanbicBank, kind: bank, sender_type: alphanumeric}
  - {sender: Timiza, kind: bank, sender_type: alphanumeric}         # Absa micro-loan wallet
  # --- digital lenders (proposed kind: lender); repayment reminders, often several per day ---
  - {sender: Tala, kind: lender, sender_type: alphanumeric}
  - {sender: Branch, kind: lender, sender_type: alphanumeric}
  - {sender: Zenka, kind: lender, sender_type: alphanumeric}
  - {sender: ZashLoan, kind: lender, sender_type: alphanumeric}
  - {sender: M-KOPA, kind: lender, sender_type: alphanumeric}
  - {sender: Watu, kind: lender, sender_type: alphanumeric}
  - {sender: HustlerFund, kind: government, sender_type: alphanumeric}   # state Financial Inclusion Fund (USSD *254#)
  - {sender: "+254 7...", kind: lender, sender_type: number}          # unlicensed lenders / debt collectors text from plain mobile numbers
  # --- telecom ---
  - {sender: Safaricom, kind: telecom, sender_type: alphanumeric}
  - {sender: Airtel, kind: telecom, sender_type: alphanumeric}
  - {sender: Telkom, kind: telecom, sender_type: alphanumeric}
  - {sender: Equitel, kind: telecom, sender_type: alphanumeric}
  # --- OTP ---
  - {sender: Google, kind: otp_service, sender_type: alphanumeric}
  - {sender: "+254 7...", kind: otp_service, sender_type: number}   # many OTPs (WhatsApp, apps) arrive from long numbers
  # --- utilities ---
  - {sender: KPLC, kind: utility, sender_type: alphanumeric}        # Kenya Power prepaid token / outage notices
  - {sender: NCWSC, kind: utility, sender_type: alphanumeric}       # Nairobi City Water & Sewerage
  - {sender: ZukuFiber, kind: utility, sender_type: alphanumeric}   # home internet/TV
  # --- government ---
  - {sender: eCitizen, kind: government, sender_type: alphanumeric}
  - {sender: KRA, kind: government, sender_type: alphanumeric}
  - {sender: SHA, kind: government, sender_type: alphanumeric}      # Social Health Authority (replaced NHIF Oct 2024)
  - {sender: NTSA, kind: government, sender_type: alphanumeric}
  - {sender: HELB, kind: government, sender_type: alphanumeric}
  - {sender: NSSF, kind: government, sender_type: alphanumeric}
  # --- courier / delivery ---
  - {sender: JUMIA, kind: courier, sender_type: alphanumeric}
  - {sender: Kilimall, kind: courier, sender_type: alphanumeric}
  - {sender: G4S, kind: courier, sender_type: alphanumeric}
  - {sender: PostaKenya, kind: courier, sender_type: alphanumeric}
  - {sender: Glovo, kind: delivery_food, sender_type: alphanumeric}
  # --- transport ---
  - {sender: Uber, kind: ride_hailing, sender_type: alphanumeric}
  - {sender: Bolt, kind: ride_hailing, sender_type: alphanumeric}
  - {sender: Little, kind: ride_hailing, sender_type: alphanumeric}
  - {sender: KenyaAirway, kind: airline, sender_type: alphanumeric}
  - {sender: JamboJet, kind: airline, sender_type: alphanumeric}
  - {sender: KenyaRail, kind: rail, sender_type: alphanumeric}      # Madaraka Express (SGR) bookings
  # --- retail / pharmacy / health ---
  - {sender: NAIVAS, kind: retail, sender_type: alphanumeric}
  - {sender: QUICKMART, kind: retail, sender_type: alphanumeric}
  - {sender: CARREFOUR, kind: retail, sender_type: alphanumeric}
  - {sender: GOODLIFE, kind: pharmacy, sender_type: alphanumeric}
  - {sender: "+254 20...", kind: doctor, sender_type: number}       # clinic / hospital reception line
  # --- betting (proposed kind: betting); extremely common in Kenyan inboxes ---
  - {sender: BETIKA, kind: betting, sender_type: alphanumeric}
  - {sender: SPORTPESA, kind: betting, sender_type: alphanumeric}
holidays:
  # Public Holidays Act (Cap. 110) as amended 2024 (S10). Eid al-Fitr is a public holiday but
  # follows the lunar calendar (no schema rule; proposed `rule: hijri+10-01`). Eid al-Adha is
  # gazetted ad hoc. Sunday holidays move to Monday (no schema rule).
  - {date: "01-01", name: "New Year's Day"}
  - {rule: "hijri:10-01", name: Eid al-Fitr}   # v1.1: from the comment above (tabular Hijri date)
  - {rule: easter-2, name: Good Friday}
  - {rule: easter+1, name: Easter Monday}
  - {date: "05-01", name: Labour Day}
  - {date: "06-01", name: Madaraka Day}
  - {date: "10-10", name: Mazingira Day}
  - {date: "10-20", name: Mashujaa Day}
  - {date: "12-12", name: Jamhuri Day}
  - {date: "12-25", name: Christmas Day}
  - {date: "12-26", name: Boxing Day}
