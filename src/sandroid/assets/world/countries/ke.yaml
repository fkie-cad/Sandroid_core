# Kenya country pack (schema v1). Sources: ke.SOURCES.md (S1..Sn).
# Context: Kenya is a key market in research on predatory digital-lending apps that
# harvest SMS (M-PESA confirmations), contacts and call logs. Sender IDs, mobile-money
# and lender entries below are therefore modelled with extra care.
pack: country
schema: 1.1
country: ke
name: Kenya
# Locally written SMS/chat text is heavily code-switched English/Swahili ("Swanglish")
# with Sheng slang among under-40s and urban users. `sw` here includes Sheng.
# Bank/M-PESA/government service SMS are almost always English.
languages: {en: 0.5, sw: 0.5}
timezones: [Africa/Nairobi]
# People mostly write d/M/yy or dd/MM/yyyy; M-PESA confirmations use "on 12/3/26 at 4:15 PM".
date_format: "dd/MM/yyyy"
time_format: "h:mm a"     # 12-hour clock dominates in SMS ("4:15 PM", "saa nne" in Swahili time)
currency: {code: KES, symbol: "KSh", format: "KSh 1,250.00"}   # M-PESA style: "Ksh1,250.00"
phone:
  country_code: "254"
  trunk_prefix: "0"
  national_format_examples: ["0712 345678", "0733 456789", "0110 123456", "020 2345678"]
  mobile:
    # NSN is always 9 digits (S1, S2). Entries are listed at 3-digit NDC granularity so that
    # uniform sampling over the list approximates subscription shares (S5): Safaricom 58,
    # Airtel 28, Equitel 2, Telkom 1 entries -> ~65 % / 31 % / 2 % / 1 %.
    # Small allocations deliberately left out of `realistic` (real but tiny): 744 Homeland
    # Media, 747 Jamii Telecoms, 749 IEBC KIEMS kits, 760 Mobile Pay, 761 Eferio, 120 Jambo,
    # 124 Infura, 126 Hidiga, 128 Webtribe, 130 NRG Media, 100-108 Airtel (new, low fill),
    # 116-119/140-146/180-182 Safaricom (new, low fill), 770-779 Telkom except one.
    realistic:
      # Safaricom: 58 prefixes
      - {prefix: "700", length: 9, operator: Safaricom}
      - {prefix: "701", length: 9, operator: Safaricom}
      - {prefix: "702", length: 9, operator: Safaricom}
