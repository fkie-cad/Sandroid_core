      - {prefix: "772", length: 9, operator: Telkom}
    unallocated:
      # Whole 3-digit NDCs inside the mobile "01" space (S1 section 1.3) that are NOT assigned
      # in the CA plan of April 2026 (S1) nor in the April 2024 plan (S2), are not among the
      # Safaricom 0118/0119/014x/018x prefixes announced in Aug 2026 (S3), and are NOT valid
      # in libphonenumber 9.0.43 (is_valid_number=False, type UNKNOWN).
      # Avoided on purpose: 147-149 and 183-189 (CA may fill them next; libphonenumber already
      # treats 140-146 and 18x as mobile), 131-139 (libphonenumber treats 135-139 as mobile).
      - {prefix: "150", length: 9, note: "NDC 150 unassigned per CA numbering plan April 2026", source: S1}
      - {prefix: "160", length: 9, note: "NDC 160 unassigned per CA numbering plan April 2026", source: S1}
      - {prefix: "170", length: 9, note: "NDC 170 unassigned per CA numbering plan April 2026", source: S1}
      - {prefix: "175", length: 9, note: "NDC 175 unassigned per CA numbering plan April 2026", source: S1}
      - {prefix: "192", length: 9, note: "NDC 192 unassigned per CA numbering plan April 2026 (199 is the CA test NDC, avoid)", source: S1}
      - {prefix: "122", length: 9, note: "NDC 122 unassigned (120/124/126/128 are MVNO allocations) per CA plan April 2026", source: S1}
    # Kenya has no official drama/fiction range. The closest thing is NDC 199 (01 99 xxx xxx),
    # which the April 2026 plan (S1) lists as a "shared resource for internal use for purposes
    # of network testing, experimentation and research" -- a test range, not a drama range,
    # and test SIMs may exist on live networks. Not used as fiction.
    fiction: null
  landline:
    # Area codes per CA plan (S1 section 1.2). Fixed NSN is mostly 9 digits (2-digit area code
    # + 7-digit subscriber). Landlines are rare in personal contact lists today.
    cities:
      - {city: Nairobi, area_code: "20", subscriber_length: 7}
      - {city: Mombasa, area_code: "41", subscriber_length: 7}
      - {city: Kisumu, area_code: "57", subscriber_length: 7}
      - {city: Nakuru, area_code: "51", subscriber_length: 7}
      - {city: Eldoret, area_code: "53", subscriber_length: 7}
      - {city: Thika, area_code: "66", subscriber_length: 7}
      - {city: Kisii, area_code: "58", subscriber_length: 7}
      - {city: Kakamega, area_code: "56", subscriber_length: 7}
      - {city: Malindi, area_code: "42", subscriber_length: 7}
      - {city: Meru, area_code: "64", subscriber_length: 7}
    fiction: null
  validation_note: >-
    libphonenumber 9.0.43 KE mobile pattern is (?:1(?:0[0-8]|[18]\d|2[014]|3[05-9]|4[0-6])|7\d\d)\d{6}:
    every 07xx NDC is valid MOBILE (including 749 IEBC and 767, which the April 2026 CA plan
    no longer lists as assigned); the unallocated prefixes 150/160/170/175/192/122 return
    is_valid_number=False and type UNKNOWN, so apps using libphonenumber will reject them.
    NDC 199 (CA test resource) is also invalid in libphonenumber. No fiction range exists.
carriers:
  # Shares: CA Sector Statistics Q3 FY2025/26 (Jan-Mar 2026) for Safaricom/Airtel/Telkom,
  # Q2 FY2025/26 for Finserve (S5). MNCs per CA plan section 7.3 (S1).
  # sim_operator = SIM/network display name as typically shown on Android (S7, best effort).
  - {name: Safaricom, sim_operator: "Safaricom", mccmnc: "63902", share: 0.689}
  - {name: Airtel, sim_operator: "Airtel", mccmnc: "63903", share: 0.276}
  - {name: Equitel, sim_operator: "Equitel", mccmnc: "63906", share: 0.019}   # Finserve Africa (MNC 06), MVNO on Airtel
  - {name: Telkom, sim_operator: "Telkom KE", mccmnc: "63907", share: 0.007}
