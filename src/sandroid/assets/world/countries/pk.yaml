names:
  culture: pk
  # No official given-name or surname frequency statistics are published for Pakistan
  # (NADRA/PBS release none). Pools and weights below are AUTHORED from general knowledge
  # of naming in Punjabi, Urdu-speaking, Pashtun, Sindhi and Baloch families, mixing older
  # (Parveen, Nasreen, Aslam, Pervaiz) and younger (Hoorain, Inaya, Ayaan, Rayyan)
  # generations; weights are rough tiers (1.0 very common ... 0.1 rare). Faker en_PK was
  # inspected and rejected (unweighted, sourced from a baby-name site, mostly male).
  #
  # Conventions:
  # - Many men carry "Muhammad" (or Ghulam/Abdul + second element) as a first element but are
  #   called by the second name; compound entries below are full given names as written on
  #   the CNIC, and `nicknames` maps them to the name used in a contacts list.
  # - Women usually have no family surname; they carry father's/husband's given name or a
  #   clan name (Bibi, Begum, Khatoon are given-name suffixes, mostly older/rural women).
  # - Contacts are saved by first name + context, not formal "First Last": "Ammi", "Abbu",
  #   "Abbu Jaan", "Bhai Jaan", "Baji", "Khala", "Phuppo", "Chachu", "Mamu", "Nano", "Dadi",
  #   "Ali Bhai", "Usman Office", "Bilal Uni", "Sana Cousin", "Imran Electrician",
  #   "Javed Plumber", "Rizwan Jazz Franchise", "Ahmed Jutt", "Saima Baji". The generator's
  #   display formats cannot express this context suffix yet (see report).
  female:
    - {name: Ayesha, w: 1.0}
    - {name: Fatima, w: 1.0}
