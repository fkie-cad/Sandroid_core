# Pakistan country pack (schema v1). Sources: pk.SOURCES.md (S1..S20).
# Context: Pakistan is a key market in research on predatory nano-loan apps that harvest
# SMS / contacts / call logs; mobile-money (JazzCash, easypaisa) and bank senders are
# therefore modelled in detail under `services`.
pack: country
schema: 1
country: pk
name: Pakistan
# Locally written text: SMS between people is overwhelmingly ROMAN URDU (Urdu in Latin
# script, heavy English code-switching: "kal office ke baad milte hain, ok?"). Nastaliq
# (Urdu script) SMS are rare. `ur` here therefore means Roman Urdu; the ur language pack
# should be written in Latin script. Punjabi/Pashto/Sindhi chat is also typed in Roman
# script and mixed into Roman Urdu; no separate share is given for them.
languages: {ur: 0.7, en: 0.3}
timezones: [Asia/Karachi]          # single zone, UTC+5, no DST
date_format: "dd/MM/yyyy"          # also common: "12-11-2026", bank SMS "12-Nov-26"
time_format: "hh:mm a"             # 12-hour clock is the everyday norm ("08:30 PM")
# Banks/JazzCash write "Rs.1,250" or "PKR 1,250.00"; people write "1250 rs" / "15k" / "2 lac".
currency: {code: PKR, symbol: "Rs", format: "Rs. 4,999"}
phone:
  country_code: "92"
  trunk_prefix: "0"
  national_format_examples: ["0300 1234567", "0333-5123456", "021 34567890", "042 35761234", "051 2345678"]
  mobile:
    # Mobile NSN = 10 digits: 3 + X (operator block) + Z + 7-digit subscriber (S1, S2).
    # Operator per block from libphonenumber carrier metadata (S4) cross-checked with S2/S3.
    realistic:
      - {prefix: "30", length: 10, operator: Jazz}            # 0300-0309 (ex-Mobilink)
      - {prefix: "32", length: 10, operator: Jazz}            # 0320-0329 (ex-Warid, merged into Jazz 2017)
      - {prefix: "31", length: 10, operator: Zong}            # 0310-0319 (CMPak)
      - {prefix: "370", length: 10, operator: Zong}           # 037 series, newest Zong block (S2)
      - {prefix: "371", length: 10, operator: Zong}
      - {prefix: "330", length: 10, operator: Ufone}          # 0330-0337, 0339 (PTML); 0338 not valid in libphonenumber
      - {prefix: "331", length: 10, operator: Ufone}
      - {prefix: "332", length: 10, operator: Ufone}
      - {prefix: "333", length: 10, operator: Ufone}
      - {prefix: "334", length: 10, operator: Ufone}
      - {prefix: "335", length: 10, operator: Ufone}
      - {prefix: "336", length: 10, operator: Ufone}
      - {prefix: "337", length: 10, operator: Ufone}
      - {prefix: "339", length: 10, operator: Ufone}
      - {prefix: "34", length: 10, operator: Telenor}         # 0340-0349; Telenor Pakistan amalgamated into PTML (Ufone's company) July 2026, brand still in use (S7)
      - {prefix: "355", length: 10, operator: SCO}            # Special Communications Organization (AJK / Gilgit-Baltistan)
    unallocated:
      # PTA's numbering plan (ITU communication 9.XI.2021, S1) reserves mobile NDCs 3A with
      # A = 0-6. Blocks 035x (except 0355) and 036x (except 0364, ex-Instaphone, defunct
      # since 2008) are inside the planned mobile range but carry no operator assignment in
      # any source found, and libphonenumber 9.0.43 rejects them (S4). No public PTA
      # allocation table could be fetched (pta.gov.pk refused connections), so these are
      # "unallocated per best available evidence", not regulator-certified.
      - {prefix: "350", length: 10, note: "inside PTA mobile plan (3A, A=0-6), no operator assigned; libphonenumber: invalid", source: S1}
      - {prefix: "351", length: 10, note: "as 0350", source: S1}
      - {prefix: "352", length: 10, note: "as 0350", source: S1}
      - {prefix: "353", length: 10, note: "as 0350", source: S1}
      - {prefix: "354", length: 10, note: "as 0350", source: S1}
      - {prefix: "356", length: 10, note: "as 0350 (0355 is SCO)", source: S1}
      - {prefix: "357", length: 10, note: "as 0350", source: S1}
      - {prefix: "358", length: 10, note: "as 0350", source: S1}
      - {prefix: "359", length: 10, note: "as 0350", source: S1}
      - {prefix: "360", length: 10, note: "inside PTA mobile plan, no operator assigned; libphonenumber: invalid", source: S1}
      - {prefix: "361", length: 10, note: "as 0360", source: S1}
      - {prefix: "362", length: 10, note: "as 0360", source: S1}
      - {prefix: "363", length: 10, note: "as 0360", source: S1}
      - {prefix: "365", length: 10, note: "as 0360 (0364 = ex-Instaphone, avoided)", source: S1}
      - {prefix: "366", length: 10, note: "as 0360", source: S1}
      - {prefix: "367", length: 10, note: "as 0360", source: S1}
      - {prefix: "368", length: 10, note: "as 0360", source: S1}
      - {prefix: "369", length: 10, note: "as 0360", source: S1}
    fiction: null   # PTA publishes no fiction/drama number range (none found in S1, S2, S3)
  landline:
    # ITU/PTA S1: NDC 21 (Karachi) and 42 (Lahore) have 8-digit subscriber numbers,
    # other 2-digit NDCs 7 digits, 3-digit NDCs 6 digits (some 5).
    cities:
      - {city: Karachi, area_code: "21", subscriber_length: 8}
      - {city: Lahore, area_code: "42", subscriber_length: 8}
      - {city: Islamabad, area_code: "51", subscriber_length: 7}
      - {city: Rawalpindi, area_code: "51", subscriber_length: 7}
      - {city: Faisalabad, area_code: "41", subscriber_length: 7}
      - {city: Multan, area_code: "61", subscriber_length: 7}
      - {city: Hyderabad, area_code: "22", subscriber_length: 7}
      - {city: Peshawar, area_code: "91", subscriber_length: 7}
      - {city: Quetta, area_code: "81", subscriber_length: 7}
      - {city: Gujranwala, area_code: "55", subscriber_length: 7}
      - {city: Sialkot, area_code: "52", subscriber_length: 7}
      - {city: Sargodha, area_code: "48", subscriber_length: 7}
      - {city: Bahawalpur, area_code: "62", subscriber_length: 7}
      - {city: Sukkur, area_code: "71", subscriber_length: 7}
      - {city: Larkana, area_code: "74", subscriber_length: 7}
      - {city: Gujrat, area_code: "53", subscriber_length: 7}
      - {city: Mardan, area_code: "937", subscriber_length: 6}
      - {city: Abbottabad, area_code: "992", subscriber_length: 6}
    fiction: null
  validation_note: >-
    libphonenumber 9.0.43 (S4): 030x/031x/032x/034x/037x valid MOBILE; 033x valid except
    0338; 0355 valid (SCO), 0364 valid (Instaphone, historical). 0350-0354, 0356-0363 and
    0365-0369 are INVALID (good: well-formed but non-routable test numbers). It also accepts
    0372-0379 as Zong although sources only confirm 0370/0371, so those were left out of both
    lists. Landlines: 2-digit NDCs accept both 7- and 8-digit subscribers; Karachi/Lahore 8.
carriers:
  # MCC 410. Shares approximate (pre-merger subscriber split reported early 2026, S7):
  # Jazz ~38 %, Zong ~26 %, PTML (Ufone + Telenor) ~35 %, SCO ~1 %.
  # Ufone and Telenor are one company (PTML) since July 2026 but still separate brands and
  # network codes; a rebrand (e&/Etisalat) was blocked/pending as of Oct 2026 (S7).
  - {name: Jazz, sim_operator: "Jazz", mccmnc: "41001", share: 0.38}
  - {name: Zong, sim_operator: "Zong", mccmnc: "41004", share: 0.26}
  - {name: Telenor, sim_operator: "Telenor", mccmnc: "41006", share: 0.20}
  - {name: Ufone, sim_operator: "Ufone", mccmnc: "41003", share: 0.15}
  - {name: SCO, sim_operator: "SCO", mccmnc: "41005", share: 0.01}
