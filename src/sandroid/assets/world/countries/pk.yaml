services:
  # Pakistan mixes alphanumeric masks (bank short names, brands) and numeric SHORT CODES
  # (3-5 digits, e.g. 8558, 3737, 6222). The schema has no `shortcode` sender_type, so short
  # codes are `number` without "+". Mobile-money wallets use kind `bank` (schema has no
  # `mobile_money` kind). Confidence per sender in pk.SOURCES.md.
  # -- mobile money / branchless banking
  - {sender: "8558", kind: bank, sender_type: number}            # JazzCash transaction receipts (S10)
  - {sender: "3737", kind: bank, sender_type: number}            # easypaisa (S11)
  - {sender: "JazzCash", kind: bank, sender_type: alphanumeric}  # promos / OTP mask
  - {sender: "easypaisa", kind: bank, sender_type: alphanumeric}
  - {sender: "SadaPay", kind: bank, sender_type: alphanumeric}
  - {sender: "NayaPay", kind: bank, sender_type: alphanumeric}
  - {sender: "UPaisa", kind: bank, sender_type: alphanumeric}
  # -- banks (SBP/NTISB: genuine bank alerts carry the bank short name or a 4-digit short code, S12)
  - {sender: "6222", kind: bank, sender_type: number}            # MCB Bank official short code (S13)
  - {sender: "HBL", kind: bank, sender_type: alphanumeric}
  - {sender: "UBL", kind: bank, sender_type: alphanumeric}
  - {sender: "MeezanBank", kind: bank, sender_type: alphanumeric}
  - {sender: "ABL", kind: bank, sender_type: alphanumeric}       # Allied Bank
  - {sender: "BankAlfalah", kind: bank, sender_type: alphanumeric}
  - {sender: "NBP", kind: bank, sender_type: alphanumeric}       # National Bank of Pakistan
  - {sender: "BankIslami", kind: bank, sender_type: alphanumeric}
  - {sender: "FaysalBank", kind: bank, sender_type: alphanumeric}
  # -- nano-lending (SECP-whitelisted apps, S9); repayment reminders/OTPs from masks
  - {sender: "Paisayaar", kind: bank, sender_type: alphanumeric}   # lender (no `lender` kind in schema v1)
  - {sender: "SmartQarza", kind: bank, sender_type: alphanumeric}   # lender (no `lender` kind in schema v1)
  - {sender: "Aitemaad", kind: bank, sender_type: alphanumeric}   # lender (no `lender` kind in schema v1)
  # -- telecom
  - {sender: "Jazz", kind: telecom, sender_type: alphanumeric}
  - {sender: "ZONG", kind: telecom, sender_type: alphanumeric}
  - {sender: "Ufone", kind: telecom, sender_type: alphanumeric}
  - {sender: "Telenor", kind: telecom, sender_type: alphanumeric}
  - {sender: "PTCL", kind: telecom, sender_type: alphanumeric}
  # -- government (consumer short codes)
  - {sender: "8484", kind: government, sender_type: number}      # PTA DIRBS device/IMEI status (S14)
  - {sender: "668", kind: government, sender_type: number}       # PTA: SIMs registered on a CNIC (S14)
  - {sender: "8400", kind: government, sender_type: number}      # NADRA CNIC tracking (widely reported, unverified)
  - {sender: "9966", kind: government, sender_type: number}      # FBR Active Taxpayer List check (widely reported, unverified)
  - {sender: "8300", kind: government, sender_type: number}      # ECP voter info (widely reported, unverified)
  # -- OTP
  - {sender: "Google", kind: otp_service, sender_type: alphanumeric}
  # -- courier
  - {sender: "TCS", kind: courier, sender_type: alphanumeric}
