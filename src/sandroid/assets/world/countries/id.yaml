cultures:
  # Foreign-origin minorities only. Chinese-Indonesians (1.2% self-identified, 2010 census, S8),
  # Arab-Indonesians, Batak, Minahasa etc. are domestic and already in the main pools above:
  # most Chinese-Indonesians carry Indonesian given names and Indonesianised surnames
  # (Wijaya, Halim, Gunawan, Salim, Tanoto), so a mainland-Chinese culture pack would be WRONG here.
  # Indian-Indonesians (Tamil/Punjabi/Sindhi, mainly Medan and Jakarta): ~0.04-0.05% (S8).
  # Foreign residents (Chinese, Japanese, Korean, Indian, US, Malaysian, Australian expats) are
  # each well below 0.05% of 288M people.
  - {culture: in, share: 0.0005}
email:
  domains:
    - {domain: gmail.com, share: 0.80}
    - {domain: yahoo.com, share: 0.06}
    - {domain: yahoo.co.id, share: 0.04}
    - {domain: ymail.com, share: 0.01}
    - {domain: hotmail.com, share: 0.02}
    - {domain: outlook.com, share: 0.02}
    - {domain: icloud.com, share: 0.02}
  # Mononym owners use "{first}{yy}" / "{first}{last}" with the father's name or a digit run;
  # SCHEMA: no {nn} random-digits token, common in ID ("dewi123", "agus.s88").
  patterns: ["{first}{last}", "{first}.{last}", "{first}{yy}", "{first}_{last}", "{f}{last}", "{first}{last}{yy}"]
services:
  # Indonesia requires masking (alphanumeric) sender registration with operators, so most
  # brands appear as text IDs. SCHEMA: no kinds for e-wallet / mobile money and for lenders
  # (pinjol); they use kind "bank" here and are marked in the comment.
  # telecom
