names:
  culture: id
  # NAMING NOTES (for the generator):
  # - Many Indonesians, esp. older Javanese, have ONE name only (mononym): the top Dukcapil
  #   names (Sutrisno, Nurhayati, Slamet, Sulastri) are usually the whole legal name.
  #   SCHEMA: no `mononym_share`; suggest ~0.35 for people born before 1980, ~0.10 after.
  # - There is no general family name. The `surnames` pool below = (a) real clan/family names
  #   (Batak marga, Minahasa, Maluku, Chinese-Indonesian, Arab-Indonesian) and (b) common
  #   second-name elements that children (incl. daughters, e.g. "Rina Gunawan") often carry
  #   from the father, patronymic-like. Gendered elements (Saputra, Putri, Pratama, -wati) were
  #   deliberately left out so the pool works for both sexes.
  # - Batak marga only fit Batak-sounding first names in reality; the generator has no way to
  #   tie them, so their weights are kept proportional to the ~3.6% Batak population.
  # - Weights: the top-10 per sex are Dukcapil e-KTP counts in thousands (S6); the rest are
  #   authored estimates on the same scale, generations mixed (boomer/X/millennial/Z/alpha, S7).
  # - Contacts are saved with honorific + name + context, not "first last": "Mama", "Bapak",
  #   "Bu Dewi", "Pak Slamet RT 05", "Mas Agus Kantor", "Mbak Sari", "Kak Rina", "Bang Ucok"
  #   (Batak/Medan), "Om Budi", "Tante Lina", "Sutrisno Bengkel", "Dewi Kos", "Ojek Pak Man".
  #   SCHEMA: `display` takes one template; proposal: `display_variants` with weights and
  #   tokens {honorific} {context}.
  female:
    - {name: Nurhayati, w: 255}
    - {name: Sulastri, w: 193}
    - {name: Sumiati, w: 173}
    - {name: Sri Wahyuni, w: 163}
