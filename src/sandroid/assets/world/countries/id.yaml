# Indonesia country pack. Sources: see id.SOURCES.md (S1..S14).
# Things schema v1 cannot express are kept in comments marked "SCHEMA:".
pack: country
schema: 1.1
country: id
name: Indonesia
# Locally written text: Bahasa Indonesia dominates; Javanese (and Sundanese, folded into
# jv here) code-switching in family threads; English loanwords/phrases among urban young.
languages: {id: 0.88, jv: 0.07, en: 0.05}
# Four IANA zones. WIB = Asia/Jakarta (Java, Sumatra) and Asia/Pontianak (West/Central
# Kalimantan, also UTC+7); WITA = Asia/Makassar (Bali, Sulawesi, South/East Kalimantan,
# NTB/NTT); WIT = Asia/Jayapura (Maluku, Papua). ~57% of people live on Java (WIB).
# SCHEMA: no per-city timezone field; mapping is in the city comments below.
timezones: [Asia/Jakarta, Asia/Pontianak, Asia/Makassar, Asia/Jayapura]
date_format: "dd/MM/yyyy"        # banks/couriers often "17/08/26"; people write "17-8" or "tgl 17"
time_format: "HH.mm"             # PUEBI standard uses a dot (19.30); bank SMS often "19:30:05"; chat: "jam 7 malem"
currency: {code: IDR, symbol: "Rp", format: "Rp49.900"}   # "." thousands sep, no decimals; also "Rp 49.900", "49rb", "1,5jt"
phone:
  country_code: "62"
  trunk_prefix: "0"
  national_format_examples: ["0812-3456-7890", "0896-1234-56789", "(021) 5312 3456", "(0274) 512345"]
  mobile:
    # NSN (without trunk 0) is 9-12 digits; operators set subscriber length themselves (FTP 2018, S1).
    # New prepaid SIMs today are mostly 11 (0812-xxxx-xxxx) or 12 digits (0896-xxxx-xxxxx).
    # Operator names reflect 2024-2025 mergers: Indosat Ooredoo Hutchison (Indosat + Tri),
    # XLSMART (XL Axiata + Smartfren, 2025). Brands kept separate because SIM names differ.
    realistic:
      - {prefix: "811", length: 11, operator: Telkomsel}
      - {prefix: "812", length: 11, operator: Telkomsel}
      - {prefix: "813", length: 11, operator: Telkomsel}
      - {prefix: "821", length: 11, operator: Telkomsel}
      - {prefix: "822", length: 11, operator: Telkomsel}
      - {prefix: "823", length: 11, operator: Telkomsel}
      - {prefix: "851", length: 11, operator: "Telkomsel (by.U)"}
      - {prefix: "852", length: 11, operator: Telkomsel}
      - {prefix: "853", length: 11, operator: Telkomsel}
      - {prefix: "814", length: 11, operator: Indosat}
      - {prefix: "815", length: 11, operator: Indosat}
      - {prefix: "816", length: 11, operator: Indosat}
      - {prefix: "855", length: 11, operator: Indosat}
      - {prefix: "856", length: 11, operator: Indosat}
      - {prefix: "857", length: 11, operator: Indosat}
      - {prefix: "858", length: 11, operator: Indosat}
      - {prefix: "895", length: 12, operator: "Tri (Indosat)"}
      - {prefix: "896", length: 12, operator: "Tri (Indosat)"}
      - {prefix: "897", length: 12, operator: "Tri (Indosat)"}
      - {prefix: "898", length: 12, operator: "Tri (Indosat)"}
      - {prefix: "899", length: 11, operator: "Tri (Indosat)"}
      - {prefix: "817", length: 11, operator: XL}
      - {prefix: "818", length: 11, operator: XL}
      - {prefix: "819", length: 11, operator: XL}
      - {prefix: "859", length: 11, operator: XL}
      - {prefix: "877", length: 11, operator: XL}
      - {prefix: "878", length: 11, operator: XL}
      - {prefix: "831", length: 11, operator: "AXIS (XLSMART)"}
      - {prefix: "832", length: 11, operator: "AXIS (XLSMART)"}
      - {prefix: "833", length: 11, operator: "AXIS (XLSMART)"}
      - {prefix: "838", length: 11, operator: "AXIS (XLSMART)"}
      - {prefix: "881", length: 11, operator: "Smartfren (XLSMART)"}
      - {prefix: "882", length: 11, operator: "Smartfren (XLSMART)"}
      - {prefix: "887", length: 11, operator: "Smartfren (XLSMART)"}
      - {prefix: "888", length: 11, operator: "Smartfren (XLSMART)"}
      - {prefix: "889", length: 12, operator: "Smartfren (XLSMART)"}
    # FTP 2018 (S1, Tabel II.9) reserves 08XY (X != 0,6) and 086X (X != 1) as network NDCs but the
    # per-operator allocation list is not published in the regulation. The prefixes below are
    # absent from every operator in the community-maintained allocation table (S3, id.wikipedia,
    # which also lists formerly-allocated-now-vacant 0825/0827/0828/0829: excluded here because
    # they may be re-assigned). All are VALID MOBILE in libphonenumber 9.0.x (S4), which treats
    # 08[1-35-9]x broadly. 084x avoided: libphonenumber rejects it as invalid. Confidence: medium.
    unallocated:
      - {prefix: "820", length: 11, note: "never assigned to an operator per S3; inside FTP 08XY NDC space", source: S3}
      - {prefix: "824", length: 11, note: "never assigned per S3", source: S3}
      - {prefix: "826", length: 11, note: "never assigned per S3", source: S3}
      - {prefix: "834", length: 11, note: "not listed for AXIS or any operator per S3", source: S3}
      - {prefix: "835", length: 11, note: "not listed for any operator per S3", source: S3}
      - {prefix: "836", length: 11, note: "not listed for any operator per S3", source: S3}
      - {prefix: "854", length: 11, note: "gap between Telkomsel 0853 and Indosat 0855; unassigned per S3", source: S3}
      - {prefix: "871", length: 11, note: "087x only 0877-0879 assigned (XL) per S3", source: S3}
      - {prefix: "874", length: 11, note: "unassigned per S3", source: S3}
      - {prefix: "891", length: 11, note: "089x only 0895-0899 assigned (Tri) per S3", source: S3}
      - {prefix: "893", length: 11, note: "unassigned per S3", source: S3}
    fiction: null    # no official drama/fiction range exists in Indonesia (S1 has none; S5 search found none)
  landline:
    # 2-digit area codes (big metros): 7-8 digit subscriber numbers; 3-digit codes: mostly 6-7.
    cities:
      - {city: Jakarta, area_code: "21", subscriber_length: 8}
      - {city: Surabaya, area_code: "31", subscriber_length: 7}
      - {city: Bandung, area_code: "22", subscriber_length: 7}
      - {city: Medan, area_code: "61", subscriber_length: 7}
      - {city: Semarang, area_code: "24", subscriber_length: 7}
      - {city: Palembang, area_code: "711", subscriber_length: 6}
      - {city: Makassar, area_code: "411", subscriber_length: 6}
      - {city: Yogyakarta, area_code: "274", subscriber_length: 6}
      - {city: Denpasar, area_code: "361", subscriber_length: 6}
      - {city: Malang, area_code: "341", subscriber_length: 6}
      - {city: Batam, area_code: "778", subscriber_length: 6}
      - {city: Balikpapan, area_code: "542", subscriber_length: 6}
      - {city: Pontianak, area_code: "561", subscriber_length: 6}
      - {city: Manado, area_code: "431", subscriber_length: 6}
      - {city: Jayapura, area_code: "967", subscriber_length: 6}
      - {city: Ambon, area_code: "911", subscriber_length: 6}
      - {city: Bogor, area_code: "251", subscriber_length: 7}
    fiction: null
  validation_note: >-
    libphonenumber 9.0.43: all realistic and unallocated mobile prefixes above parse as valid
    MOBILE for NSN lengths 9-12 (13-digit NSN is invalid). The 084x block is INVALID (UNKNOWN),
    so it was not used. Landlines: Jakarta/Semarang need >=7 subscriber digits to be valid,
    Bandung >=6; 3-digit area codes accept 5-8 digits. Because libphonenumber accepts the whole
    08[1-35-9] space, it cannot distinguish allocated from unallocated mobile prefixes.
