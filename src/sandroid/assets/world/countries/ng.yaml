holidays:
  # Federal public holidays (S12). Islamic holidays (Eid al-Fitr 2 days, Eid al-Adha 2 days,
  # Eid-el-Maulud) follow the Hijri calendar and are declared by the FG each year; the schema
  # cannot express them (proposed rule form e.g. "hijri:10-01").
  - {date: "01-01", name: "New Year's Day"}
  - {date: "05-01", name: "Workers' Day"}
  - {date: "06-12", name: "Democracy Day"}
  - {date: "10-01", name: "Independence Day"}
  - {date: "12-25", name: "Christmas Day"}
  - {date: "12-26", name: "Boxing Day"}
  - {rule: easter-2, name: "Good Friday"}
  - {rule: easter+1, name: "Easter Monday"}
  # v1.1 Hijri rules for the Islamic holidays named in the comment above (tabular dates;
  # the FG declares the actual days each year):
  - {rule: "hijri:10-01", name: "Eid al-Fitr"}
  - {rule: "hijri:10-02", name: "Eid al-Fitr (2nd day)"}
  - {rule: "hijri:12-10", name: "Eid al-Adha"}
  - {rule: "hijri:12-11", name: "Eid al-Adha (2nd day)"}
  - {rule: "hijri:03-12", name: "Eid-el-Maulud"}
