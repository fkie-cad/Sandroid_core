names:
  # No official given-name/surname frequency statistics exist for Nigeria (NPC/NBS publish none).
  # Pool is AUTHORED from general knowledge, partly drafted from Faker en_NG/yo_NG/ig_NG/ha_NG (MIT);
  # weights are rough relative frequencies, blended for the national mix (Hausa-Fulani ~36%,
  # Yoruba ~15%, Igbo ~15%, many others; CIA World Factbook 2018, S10), shifted toward the south
  # because smartphone ownership is higher there. Christian/English given names ("Blessing",
  # "Emmanuel") are used across southern and Middle-Belt groups; Muslim/Arabic given names
  # across the north and among Yoruba Muslims.
  # LIMITATION: one pool cannot keep ethnic coherence (a Hausa given name with an Igbo surname is
  # unrealistic). See the report: proposed `names.groups`.
  # Contact-saving conventions (for the language pack / generator): parents as "Mummy"/"Daddy"
  # (also "Mum", "Mama", "Baba" in Yoruba homes, "Mama"/"Papa" in Igbo homes, "Umma"/"Abba" in
  # Hausa homes); teknonyms "Iya Bisi", "Baba Tunde", "Mama Chidi"; honorifics "Alhaji Musa",
  # "Hajia Amina", "Mallam Sani", "Chief Okafor", "Pastor Femi", "Engr Kunle", "Dr Ada";
  # seniority "Bro Chidi", "Sis Ngozi", "Aunty Bimpe", "Uncle Segun", "Oga Emeka"; service
  # contacts by trade: "Emeka Mechanic", "Tunde Vulcanizer", "Mama Put", "Musa Gate", "Bola Tailor",
  # "Kola Landlord", "POS Lady", "Keke Driver"; and church/school tags: "Ngozi RCCG", "Femi UNILAG".
  # People typically carry several given names (e.g. "Oluwaseun Michael Adeyemi", "Chukwuemeka
  # John Okafor"); the contact shows only the one in use.
  culture: ng
  female:
    - {name: Blessing, w: 1.0}
    - {name: Fatima, w: 1.0}
    - {name: Aisha, w: 0.9}
    - {name: Grace, w: 0.9}
