# Nigeria country pack. Sources: see ng.SOURCES.md (S1..S12).
pack: country
schema: 1.1
country: ng
name: Nigeria
# Locally written text: Nigerian English with heavy Nigerian Pidgin code-switching ("abeg",
# "how far", "no wahala") is the norm in SMS across all groups; Hausa dominates written chat in
# the north, Yoruba/Igbo appear mostly as greetings and phrases mixed into English.
# Pidgin (BCP-47 "pcm") is folded into `en` here; a separate pcm language pack is proposed.
languages: {en: 0.86, ha: 0.07, yo: 0.04, ig: 0.03}
timezones: [Africa/Lagos]          # WAT, UTC+1, no DST
date_format: "dd/MM/yyyy"
time_format: "h:mm a"              # 12-hour clock dominates in everyday writing ("4:30pm")
currency: {code: NGN, symbol: "₦", format: "₦4,500.00"}   # bank alerts often write "NGN4,500.00"; casual SMS "N4,500" / "4k"
phone:
  country_code: "234"
  trunk_prefix: "0"
  national_format_examples: ["0803 123 4567", "0812 345 6789", "0201 234 5678", "02064 23 4567"]
  mobile:
    # NCC Mobile Number Allocation Table "as at December 2023" (S1) and NCC ITU-T E.129
    # notification of existing mobile E.164 numbers (S2). All mobile NSNs are 10 digits.
    # Mobile number portability exists, so a prefix only shows the ORIGINAL operator.
    realistic:
      - {prefix: "703", length: 10, operator: MTN}
      - {prefix: "704", length: 10, operator: MTN}
      - {prefix: "706", length: 10, operator: MTN}
      - {prefix: "707", length: 10, operator: MTN}
      - {prefix: "803", length: 10, operator: MTN}
      - {prefix: "806", length: 10, operator: MTN}
      - {prefix: "810", length: 10, operator: MTN}
      - {prefix: "813", length: 10, operator: MTN}
      - {prefix: "814", length: 10, operator: MTN}
      - {prefix: "816", length: 10, operator: MTN}
      - {prefix: "903", length: 10, operator: MTN}
      - {prefix: "906", length: 10, operator: MTN}
      - {prefix: "913", length: 10, operator: MTN}
      - {prefix: "916", length: 10, operator: MTN}
      - {prefix: "701", length: 10, operator: Airtel}
      - {prefix: "708", length: 10, operator: Airtel}
      - {prefix: "802", length: 10, operator: Airtel}
      - {prefix: "808", length: 10, operator: Airtel}
      - {prefix: "812", length: 10, operator: Airtel}
      - {prefix: "901", length: 10, operator: Airtel}
      - {prefix: "902", length: 10, operator: Airtel}
      - {prefix: "904", length: 10, operator: Airtel}
      - {prefix: "907", length: 10, operator: Airtel}
      - {prefix: "911", length: 10, operator: Airtel}
      - {prefix: "912", length: 10, operator: Airtel}
      - {prefix: "705", length: 10, operator: Glo}
      - {prefix: "805", length: 10, operator: Glo}
      - {prefix: "807", length: 10, operator: Glo}
      - {prefix: "811", length: 10, operator: Glo}
      - {prefix: "815", length: 10, operator: Glo}
      - {prefix: "905", length: 10, operator: Glo}
      - {prefix: "915", length: 10, operator: Glo}
      - {prefix: "809", length: 10, operator: "T2 (ex-9mobile/EMTS)"}
      - {prefix: "817", length: 10, operator: "T2 (ex-9mobile/EMTS)"}
      - {prefix: "818", length: 10, operator: "T2 (ex-9mobile/EMTS)"}
      - {prefix: "908", length: 10, operator: "T2 (ex-9mobile/EMTS)"}
      - {prefix: "909", length: 10, operator: "T2 (ex-9mobile/EMTS)"}
      # Not listed: 0702 (split Smile/Visafone/ICN blocks, partly withdrawn), 0801 (MAFAB block
      # 0801 0xx), 0804 (M-Tel, defunct), 0914 (in S2 but no operator in S1), 071x/072x (MVNO
      # NDCs notified to ITU in Jan 2024, S3; blocks being assigned to MVNOs e.g. 0712).
    unallocated:
      - {prefix: "819", length: 10, note: "NCC table (S1): 0819 000-099 'Withdrawn', rest 'Available'; absent from NCC ITU notification (S2). libphonenumber: INVALID.", source: S1}
      - {prefix: "917", length: 10, note: "Not in NCC allocation table (S1) nor in NCC ITU notification of mobile NDCs (S2). libphonenumber: INVALID.", source: S1}
      - {prefix: "918", length: 10, note: "Not in S1 nor S2. libphonenumber: INVALID.", source: S1}
      - {prefix: "919", length: 10, note: "Not in S1 nor S2. libphonenumber: INVALID.", source: S1}
      - {prefix: "709", length: 10, note: "NCC table (S1): whole 0709 'Withdrawn' (ex-Multilinks CDMA); absent from S2. libphonenumber still says valid MOBILE, so it looks fully realistic. Could be re-issued later.", source: S1}
      - {prefix: "910", length: 10, note: "Not in S1 nor S2 (lower confidence: libphonenumber already classifies 0910 as valid MOBILE, may anticipate an allocation).", source: S2}
    fiction: null   # Nigeria/NCC publishes no reserved drama/fiction number range (none found in S1-S3, S4).
  landline:
    # Since 2023 fixed numbers are 10-digit: "0" + "2" + old area code + subscriber (Lagos 01xxxxxxx -> 0201 xxx xxxx). S3, S5.
    cities:
      - {city: Lagos, area_code: "201", subscriber_length: 7}
      - {city: Ibadan, area_code: "202", subscriber_length: 7}
      - {city: Abuja, area_code: "209", subscriber_length: 7}
