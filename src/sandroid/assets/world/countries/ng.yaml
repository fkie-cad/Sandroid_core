      - {city: Onitsha, area_code: "2046", subscriber_length: 6}
      - {city: Aba, area_code: "2082", subscriber_length: 6}
      - {city: Owerri, area_code: "2083", subscriber_length: 6}
      - {city: Calabar, area_code: "2087", subscriber_length: 6}
      - {city: Uyo, area_code: "2085", subscriber_length: 6}
      - {city: Maiduguri, area_code: "2076", subscriber_length: 6}
      - {city: Warri, area_code: "2053", subscriber_length: 6}
    fiction: null
  validation_note: >-
    phonenumbers 9.0.43: all realistic prefixes valid MOBILE; 0819/0917/0918/0919 INVALID (good
    test of validators); 0709 and 0910 still valid MOBILE although not allocated per NCC. 0700 is
    UAN/vanity and 0800 toll-free, not mobile. Landline area codes 201..2087 in new 10-digit form
    validate as FIXED_LINE; the legacy 8-digit forms (e.g. 01 2345678) no longer validate.
    Fixed lines are rare in personal phone books; mobile numbers dominate contacts.
