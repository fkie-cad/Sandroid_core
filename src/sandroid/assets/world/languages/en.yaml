    - "Your trip receipt: {amount}. Thanks for riding!"
    - "{digits:4} is your ride verification code."
    - {text: "Your ride OTP is {digits:4}. Share it with the driver at the start of the trip.", regions: [in]}
  airline:
    - "Check-in is now open for your flight to {city}. Booking ref {code}."
    - "Your flight to {city} on {date} is boarding from gate {digits:2} at {time}."
    - "Flight update: your flight to {city} is delayed. New departure {time}."
    - "Booking confirmed. Ref {code}. Departure {date} {time}."
    - "Your boarding pass is ready. Seat {digits:2}C."
  rail:
    - "Your ticket is confirmed. Booking ref {code}. Departure {date} {time}."
    - "Your train to {city} is running approx 15 minutes late."
    - "Platform change: your train to {city} now departs from platform {digits:1}."
    - {text: "PNR {digits:10}, Train {digits:5}, DOJ {date}, SL S{digits:1} {digits:2}. Chart prepared.", regions: [in]}
    - {text: "Your e-ticket for {date} is attached in the app. Coach {digits:1}, seat {digits:2}.", regions: [gb, us]}
  government:
    - "Your application {code} has been received and is being processed."
    - "Your document is ready for collection at the {city} office."
    - "Reminder: your tax return is due on {date}."
    - {text: "OTP for Aadhaar authentication is {digits:6}. Valid for 10 minutes.", regions: [in]}
    - {text: "Your NIN verification code is {digits:6}. Do not share.", regions: [ng]}
    - {text: "Your vehicle tax is due on {date}. Renew online to avoid a penalty.", regions: [gb]}
  retail:
    - "Thanks for shopping at {shop}! You earned {digits:3} points."
    - "Your order {code} has been confirmed. Total {amount}."
    - "Flash sale: up to 50% off this weekend only at {shop}. Reply STOP to opt out."
    - "Your order is ready for pickup at {shop} {city}."
    - "Your refund of {amount} has been processed."
  utility:
    - "Your electricity bill of {amount} is due on {date}."
    - "Planned water maintenance in {city} on {date} from {time}. We apologise for any inconvenience."
    - "Thank you, your payment of {amount} has been received. Ref {code}."
    - {text: "Token: {digits:4}-{digits:4}-{digits:4}-{digits:4}-{digits:4}\nUnits: {digits:2}.{digits:1}kWh\nAmt: {amount}\nMtr: {digits:11}", regions: [ke, ng]}
    - {text: "Your gas and electricity bill of {amount} is ready. It will be paid by Direct Debit on {date}.", regions: [gb]}
  mobile_money:
    - {text: "{code} Confirmed. {amount} sent to {first} {last} on {date} at {time}. New balance is {balance}. Transaction cost, {fee}.", regions: [ke]}
    - {text: "{code} Confirmed. You have received {amount} from {first} {last} on {date} at {time}. New balance is {balance}.", regions: [ke]}
    - {text: "{code} Confirmed. {amount} paid to {shop}. on {date} at {time}. New balance is {balance}.", regions: [ke]}
    - {text: "You have received {amount} from {first} {last}. Your new balance is {balance}. Ref. No. {digits:13}.", regions: [ph]}
    - {text: "You have sent {amount} to {first} {last} on {date} {time}. Ref. No. {digits:13}.", regions: [ph]}
    - {text: "Transfer of {amount} to {first} {last} successful. Ref: {code}. Bal: {balance}", regions: [ng]}
    - {text: "{amount} sent to {first} via UPI. Ref No {digits:12}.", regions: [in]}
  loan:
    - "Reminder: your loan instalment of {amount} is due on {date}. Pay on time to keep your credit limit."
    - "Your loan of {amount} has been approved and sent to your account."
    - "Your loan is overdue. Please repay {amount} today to avoid extra charges."
