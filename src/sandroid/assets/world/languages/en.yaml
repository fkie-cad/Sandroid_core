# English language pack. One pack for all English-writing countries.
# Optional `regions: [us, gb, in, ke, ng, ph]` on a thread or a service/calendar/file/note
# entry marks wording that only fits those countries; untagged entries fit everywhere.
# `emoji: true` marks threads/entries that contain emoji (strip or skip for live SMS).
# Proposed (not yet in schema v1): service kinds `mobile_money`, `loan`;
# placeholders `{balance}`, `{fee}`; list values in `call_names`. See SOURCES.md.
pack: language
schema: 1.1
lang: en
name: English
threads:
  family:
    - {msgs: [[p, "Are you coming Sunday? Dinner at 6"], [o, "Yes should be there by 6:30"], [p, "Ok bring {partner_first}"], [o, "Will do"]]}
    - {msgs: [[p, "Call me when you get a sec"], [o, "In a meeting, call u at lunch"], [p, "No rush its nothing bad"]]}
    - {emoji: true, msgs: [[p, "Happy birthday sweetheart!! Love you so much ❤️❤️"], [o, "Thanks mom love you too"], [p, "Did you get the card"], [o, "Yes it was lovely x"]]}
    - {msgs: [[o, "Landed"], [p, "Thank god. Text when ur home"], [o, "Will do"]]}
    - {regions: [gb], msgs: [[p, "Did you remember to ring your nan"], [o, "Oh no I forgot, will do it tonight"], [p, "She was asking after you"], [o, "Ringing her now"]]}
    - {regions: [us], msgs: [[p, "Dad says can you pick up the turkey from {shop} on your way"], [o, "Sure what time do they close"], [p, "8 I think"], [o, "ok on it"]]}
    - {regions: [in], msgs: [[p, "Beta did you eat"], [o, "Yes mummy"], [p, "What did you eat"], [o, "Dal rice, dont worry"], [p, "Ok take care. Call papa also he is asking"]]}
    - {regions: [ng], msgs: [[p, "Good morning my dear. How was your night"], [o, "Morning mummy, fine thank you"], [p, "Please don't forget to send the money for your brother's school fees"], [o, "I will send it before 12 ma"]]}
