    - {text: "{courier}: your parcel {tracking} is due today. Driver: {first}. 1hr window {time}.", regions: [gb]}
  bank:
    - "{bank}: {digits:6} is your one-time password. Do not share it with anyone. Bank staff will never ask for it."
    - "A purchase of {amount} was made with your card ending {digits:4} at {shop} on {date}."
    - "{bank}: Your account ending {digits:4} has been credited with {amount}. Avail bal: {balance}."
    - "Did you attempt a payment of {amount} at {shop}? Reply YES or NO."
    - "{bank}: Your statement is ready. Log in to the app to view it."
    - {text: "{amount} debited from A/c XX{digits:4} on {date} to VPA {first}@upi UPI Ref {digits:12}. Not you? Call 1800{digits:7}", regions: [in]}
    - {text: "{amount} credited to A/c XX{digits:4} on {date} by UPI. Avl Bal {balance}. -{bank}", regions: [in]}
    - {text: "Acct: {digits:3}XXXX{digits:3}\nAmt: {amount} DR\nDesc: POS {shop}\nDate: {date}\nAvail Bal: {balance}", regions: [ng]}
    - {text: "Acct: {digits:3}XXXX{digits:3}\nAmt: {amount} CR\nDesc: TRF FROM {first} {last}\nAvail Bal: {balance}", regions: [ng]}
    - {text: "{bank}: You've paid {amount} to {first} {last}. If this wasn't you, call us on the number on the back of your card.", regions: [gb]}
    - {text: "{bank} Alert: Card ending {digits:4} was used for {amount} at {shop}. Reply STOP to opt out.", regions: [us]}
  telecom:
    - "You have used 80% of your data bundle. Buy more data to stay connected."
    - "Your bill of {amount} is due on {date}. Pay in the app to avoid service interruption."
    - "Welcome! Your number is now active. Dial *{digits:3}# to check your balance."
    - "Recharge successful. You have received {amount} airtime. New balance: {balance}."
    - {text: "Get 10GB for 30 days at only {amount}! Dial *{digits:3}*{digits:2}# now. T&Cs apply.", regions: [ke, ng, ph, in]}
    - {text: "Dear customer, your pack expires on {date}. Recharge now to continue enjoying unlimited calls and 1.5GB/day.", regions: [in]}
    - {text: "You have borrowed {amount} airtime. It will be deducted on your next recharge plus service fee.", regions: [ng, ke]}
    - {text: "Your monthly allowance has reset. You have unlimited mins & texts and 30GB data until {date}.", regions: [gb, us]}
  otp_service:
    - "{digits:6} is your verification code. Don't share this code with anyone."
    - "Your login code is {digits:6}. It expires in 10 minutes."
    - "Use {digits:4} to verify your phone number."
    - "<#> Your code is {digits:6}\n{code}"
    - "{digits:6} is your security code. If you didn't request it, ignore this message."
    - "{digits:6} is your code. It expires in 5 minutes."
  doctor:
    - "Reminder: your appointment at the clinic is on {date} at {time}. Reply C to cancel."
    - "Your doctor's appointment has been confirmed for {day} {date} at {time}. Please arrive 10 minutes early."
    - "Your test results are ready. Please call the clinic to book a follow-up."
