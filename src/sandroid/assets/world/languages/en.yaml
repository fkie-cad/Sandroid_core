    - {regions: [ke], msgs: [[p, "Habari. Did you reach safely"], [o, "Yes I reached, the matatu was full but ok"], [p, "Good. Greet {partner_first}"]]}
    - {msgs: [[o, "Can you send me grandma's soup recipe"], [p, "Its in my head lol I'll write it down tonight"], [o, "Thanks"]]}
    - {emoji: true, msgs: [[p, "Group pic from today"], [p, "Everyone looks great except your uncle 😂"], [o, "Haha he always closes his eyes"]]}
  partner:
    - {msgs: [[p, "Do we need anything from the shop"], [o, "Milk and bread. And toilet paper"], [p, "Got it"]]}
    - {emoji: true, msgs: [[p, "Running late, sorry 😩"], [o, "No worries, I'll start cooking"], [p, "Ur the best"]]}
    - {msgs: [[o, "What time are you home"], [p, "Around 7"], [o, "Ok I'll order food"], [p, "Pizza pls"]]}
    - {emoji: true, msgs: [[p, "Miss you"], [o, "Miss you more ❤️"], [p, "2 more days"]]}
    - {msgs: [[p, "Did u pay the electric bill"], [o, "Yes this morning"], [p, "Thank you"]]}
    - {msgs: [[o, "Babe have you seen my keys"], [p, "Kitchen counter next to the fruit bowl"], [o, "Found them thx"]]}
    - {regions: [gb], msgs: [[p, "Fancy a takeaway tonight"], [o, "Go on then. Curry?"], [p, "Yes. Usual?"], [o, "Yep"]]}
    - {regions: [us], msgs: [[p, "Can you grab gas on your way back, I'm almost on empty"], [o, "Sure"]]}
    - {emoji: true, msgs: [[p, "Look what I found 😍"], [o, "Omg we need that"], [p, "It's on sale too"], [o, "Buy it"]]}
    - {msgs: [[o, "Movie tonight?"], [p, "Yes but something light pls"], [o, "Comedy it is"]]}
    - {msgs: [[p, "Leaving work now"], [o, "Ok see u soon"]]}
  friend:
    - {emoji: true, msgs: [[p, "Are we still on for tonight"], [o, "Yesss 8 at {place}?"], [p, "Perfect see u there 🍻"]]}
    - {msgs: [[p, "u up?"], [o, "Yeah whats up"], [p, "Can't sleep. Saw the new episode?"], [o, "Not yet no spoilers!!"]]}
    - {emoji: true, msgs: [[o, "Happy birthday!! Have an amazing day 🎉🎂"], [p, "Thank youuu"], [o, "Drinks this weekend on me"]]}
    - {msgs: [[p, "Can I borrow your drill this weekend"], [o, "Sure come grab it Saturday"], [p, "Legend"]]}
    - {emoji: true, msgs: [[p, "LMAO did you see what {first} posted"], [o, "Nooo what"], [p, "Check the group chat 💀"]]}
    - {msgs: [[o, "Sorry missed your call"], [p, "No worries just wanted to catch up"], [o, "Call you tomorrow?"], [p, "Sounds good"]]}
    - {regions: [gb], msgs: [[p, "Pub quiz Thursday? We need a 4th"], [o, "Im in"], [p, "Cheers mate"]]}
    - {regions: [us], msgs: [[p, "Game's at 7 wanna come over"], [o, "Down. I'll bring chips"], [p, "Bet"]]}
    - {regions: [in], msgs: [[p, "Bro where are you"], [o, "5 mins"], [p, "Ur 5 mins means 30 lol"], [o, "Reached reached"]]}
    - {regions: [ng], emoji: true, msgs: [[p, "Guy how far"], [o, "I dey o. You?"], [p, "We still dey go Saturday abi"], [o, "Sure 💯"]]}
    - {regions: [ph], msgs: [[p, "Hey sis free ka ba this weekend"], [o, "Yes! Where u wanna go"], [p, "Mall then dinner?"], [o, "G"]]}
    - {regions: [ke], msgs: [[p, "Sasa. Uko town?"], [o, "Yes near {place}"], [p, "Lets meet in 20"], [o, "Poa"]]}
