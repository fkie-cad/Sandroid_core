service_sms:
  courier:
    - "Your parcel {tracking} is out for delivery today. Track: {courier} app"
    - "{courier}: Your package {tracking} will be delivered on {date} between {time}."
    - "We missed you. Your parcel {tracking} could not be delivered. It will be re-attempted on {date}."
    - "Your order from {shop} has been shipped. Tracking no: {tracking}"
    - "Delivered: Your parcel {tracking} was left in a safe place at {time}."
    - {text: "Your shipment {tracking} is out for delivery. Delivery OTP: {digits:4}. Share only with the delivery agent.", regions: [in]}
