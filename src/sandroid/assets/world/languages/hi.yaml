service_sms:
  courier:
    - "Your shipment {tracking} is out for delivery today. Delivery OTP: {digits:4}. Share only with delivery agent. -{courier}"
    - "Your order with {shop} has been shipped. AWB {tracking}. Track: {courier} app"
    - "{courier}: Delivery attempt failed for {tracking}. We will try again on {date}."
    - "Delivered: Your package {tracking} was delivered at {time}."
    - {text: "आपका पार्सल {tracking} आज डिलीवर होगा। OTP {digits:4} केवल डिलीवरी एजेंट को बताएं।", script: Deva}
  bank:
    - "{amount} debited from A/c XX{digits:4} on {date} to VPA {first}{digits:2}@upi UPI Ref No {digits:12}. Not you? Call 1800{digits:7} -{bank}"
    - "Dear Customer, A/c XX{digits:4} credited with {amount} on {date} by UPI/{digits:12}. Avl Bal {balance} -{bank}"
    - "{digits:6} is OTP for txn of {amount} at {shop} on card XX{digits:4}. Valid for 5 mins. Do not share OTP with anyone. -{bank}"
    - "{amount} spent on {bank} Credit Card XX{digits:4} at {shop} on {date}. Avl Lmt {balance}."
    - "Your A/c XX{digits:4} is credited with {amount} on {date} - SALARY. Avl Bal {balance}."
    - "Dear Customer, never share your OTP, PIN or CVV with anyone. {bank} never asks for these details."
    - {text: "प्रिय ग्राहक, आपके खाते XX{digits:4} में {amount} जमा किए गए। शेष राशि {balance}। -{bank}", script: Deva}
  telecom:
    - "Recharge of {amount} successful. Pack: 1.5GB/day, Unlimited calls, 28 days. Validity till {date}."
    - "Dear customer, your plan expires on {date}. Recharge now to enjoy uninterrupted services."
    - "90% of your daily high speed data quota has been used. Speed will reduce to 64 Kbps after 100%."
    - "Your bill of {amount} is due on {date}. Pay now via app to avoid late fee."
    - {text: "प्रिय ग्राहक, आपका प्लान {date} को समाप्त हो रहा है। अभी रिचार्ज करें और अनलिमिटेड कॉल का आनंद लें।", script: Deva}
    - {text: "बधाई! आपको {digits:1}GB अतिरिक्त डेटा मिला है, वैधता {date} तक।", script: Deva}
  otp_service:
    - "{digits:6} is your OTP for login. Do not share it with anyone."
    - "<#> {digits:6} is your verification code. {code}"
    - "Your OTP is {digits:4}. Valid for 10 minutes."
    - "Use OTP {digits:6} to verify your mobile number. Never share OTP with anyone."
    - {text: "{digits:6} आपका OTP है। इसे किसी के साथ साझा न करें।", script: Deva}
  doctor:
    - "Your appointment with the doctor is confirmed for {date} at {time}. Please reach 15 min early. Token no {digits:2}."
    - "Reminder: Your consultation is scheduled tomorrow at {time}. Reply C to cancel."
    - "Your lab report is ready. Download from the app using ID {code}."
    - "Dear patient, please come fasting for your blood test on {date}."
    - {text: "आपकी डॉक्टर से मुलाकात {date} को {time} बजे निर्धारित है।", script: Deva}
  pharmacy:
    - "Your order #{digits:8} is confirmed. Medicines will be delivered by {date}. Total: {amount}"
    - "Your medicines order has been packed and is out for delivery."
    - "Reminder: your monthly medicines refill is due. Reorder now and get 20% off."
    - "Order {code} delivered. Thank you for ordering with {shop}."
    - "Prescription verified for order {code}. Delivery expected {date}."
  delivery_food:
    - "Your order from {shop} is on the way! Rider {first} will reach in {digits:2} mins."
    - "Order #{digits:6} confirmed. Total {amount}. Track live in app."
    - "Your order has been delivered. Rate your meal and earn rewards!"
    - "Delivery OTP for your order is {digits:4}. Share with rider at doorstep."
    - "Paneer khane ka mann? 50% OFF on {shop} today only! Order now."
  ride_hailing:
    - "Your ride OTP is {digits:4}. {first} is arriving in a white hatchback {code}."
    - "Your driver has arrived at pickup point."
    - "Trip completed. Fare {amount}. Thank you for riding!"
    - "Your auto is booked. Driver {first}, arriving in 4 min. OTP {digits:4}"
    - "Your ride has been cancelled by the driver. Searching for another driver."
  airline:
    - "Web check-in is now open for flight {code} to {city} on {date}. PNR {code}."
    - "Your flight to {city} departs at {time}. Boarding gate {digits:2}. Gate closes 25 min before departure."
    - "Flight delayed: new departure time {time}. We regret the inconvenience."
    - "Booking confirmed. PNR {code}. Dep {date} {time}."
    - "Boarding pass for PNR {code} has been sent to your email."
  rail:
    - "PNR:{digits:10},TRN:{digits:5},DOJ:{date},SL,{city}-{city},Dep:{time},S{digits:1} {digits:2}"
    - "PNR {digits:10}: Chart prepared. Coach B{digits:1} Berth {digits:2}."
    - "PNR {digits:10} is WL {digits:2}. Status will be updated after chart preparation."
    - "Your ticket for PNR {digits:10} is cancelled. Refund of {amount} will be credited in 3-5 days."
    - "Train {digits:5} is running late by approx {digits:2} minutes."
  government:
    - "OTP for Aadhaar (XX{digits:4}) is {digits:6} (valid for 10 mins)."
    - "Your application {code} for passport has been received. Appointment on {date} at {time}."
    - "Dear taxpayer, your ITR for AY 2026-27 has been processed. Refund of {amount} determined."
    - "Your vehicle challan of {amount} is pending. Pay online to avoid court proceedings."
    - {text: "आपका आवेदन {code} स्वीकार कर लिया गया है। स्थिति जानने हेतु पोर्टल देखें।", script: Deva}
  retail:
    - "Thank you for shopping at {shop}! You earned {digits:3} points. Bill amt {amount}."
    - "MEGA SALE! Flat 50% off at {shop}. Hurry, offer valid till {date}. T&C"
    - "Your order {code} has been delivered. Rate your experience."
    - "Your refund of {amount} for order {code} has been initiated."
    - "Diwali dhamaka! Extra 10% off on all orders. Use code {code}"
  utility:
    - "Dear consumer, your electricity bill for CA no {digits:10} is {amount}. Due date {date}."
    - "Power supply will remain suspended in your area on {date} from {time} due to maintenance."
    - "Your LPG cylinder booking is confirmed. Booking no {digits:6}. Delivery within 2 days."
    - "Payment of {amount} received for CA {digits:10}. Thank you."
    - "Your water bill of {amount} is due on {date}."
  mobile_money:
    - "{amount} sent to {first} {last} via UPI. UPI Ref {digits:12}."
    - "You have received {amount} from {first} {last}. UPI Ref {digits:12}."
    - "Wallet: {amount} paid to {shop}. Wallet balance {balance}. Txn ID {digits:12}"
    - "Money added to wallet: {amount}. Updated balance {balance}."
    - "Payment of {amount} to {shop} failed. Amount, if debited, will be refunded within 3 working days."
  loan:
    - "Dear customer, EMI of {amount} for loan A/c XX{digits:4} is due on {date}. Maintain sufficient balance."
    - "Your EMI of {amount} has been successfully debited. Thank you."
    - "Congratulations! You are pre-approved for a personal loan of up to {amount}. Apply in 2 mins."
    - "Your EMI payment is overdue. Pay {amount} today to avoid penal charges and impact on credit score."
    - "Loan of {amount} disbursed to your A/c XX{digits:4}. First EMI on {date}."
