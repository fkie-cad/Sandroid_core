# Hindi language pack. Personal texts are mostly romanized Hinglish (how people actually
# type on Indian phones); entries tagged `script: Deva` are in Devanagari.
# Indian service SMS are overwhelmingly English or English-Hindi mixed; that is mirrored here.
# `emoji: true` marks threads/entries containing emoji.
# Proposed (not yet in schema v1): `script` tag, service kinds `mobile_money`, `loan`,
# placeholders `{balance}`, `{fee}`, list values in `call_names`. See SOURCES.md.
pack: language
schema: 1.1
lang: hi
name: हिन्दी (Hinglish)
threads:
  family:
    - {msgs: [[p, "Beta khana kha liya?"], [o, "Haan mummy abhi khaya"], [p, "Kya khaya"], [o, "Dal chawal"], [p, "Theek hai. Papa ko call kar lena"]]}
    - {msgs: [[p, "Kab aa rahe ho ghar"], [o, "Diwali pe aaunga, ticket book kar liya"], [p, "Accha. Kaunsi train"], [o, "Rajdhani, {date} ko"]]}
    - {emoji: true, msgs: [[p, "Happy birthday beta 🎂🎉 bhagwan tumhe khush rakhe"], [o, "Thank you papa 🙏"], [p, "Shaam ko call karna"]]}
    - {msgs: [[o, "Pahunch gaya"], [p, "Thik hai. Aaram karo"]]}
    - {msgs: [[p, "Didi ki shaadi ki date fix ho gayi"], [o, "Kab?"], [p, "{date}. Chhutti le lena pehle se"], [o, "Haan bol dunga office me"]]}
