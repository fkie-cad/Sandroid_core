# Language pack: Turkish (tr). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see tr.SOURCES.md.
# Conventions: friends/family/partner use "sen"; neighbours mix "siz" and "sen";
# services use formal "siz" forms.
# Placeholders never carry Turkish case suffixes (vowel harmony is unknown at
# generation time): sentences are built as "saat {time}", "{date} tarihinde",
# "{place} önünde", "{city} tarafında", "{partner_first} ile".
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1
lang: tr
name: Türkçe

