    - {emoji: true, msgs: [[p, "Eid Mubarak 🌙"], [o, "Khair Mubarak, sheer khurma bhijwa rahe hain"]]}
    - {msgs: [[p, "Paani ki motor kharab hai, plumber aa raha hai"], [o, "Acha theek hai"]]}
    - {msgs: [[o, "Bhai sahab aap ke yahan gas aa rahi hai?"], [p, "Nahi subah se pressure bohat kam hai"]]}
    - {msgs: [[p, "Doodh wala aaj nahi aya, aap ke paas extra hai?"], [o, "Haan aik packet hai, le jayen"]]}
service_sms:
  courier:
    - "Dear Customer, your shipment {tracking} is out for delivery today. Please keep {amount} ready for COD. -{courier}"
    - "Your order from {shop} has been dispatched. CN# {tracking}. Track on {courier} website."
    - "{courier}: Delivery attempt unsuccessful for CN {tracking}. Rider will try again on {date}."
    - "Your shipment {tracking} has been delivered at {time}. Thank you."
    - "Aap ka parcel {tracking} aaj deliver hoga. Rider {first} aap se rabta karega."
  bank:
    - "Dear Customer, {amount} has been debited from your A/C ****{digits:4} on {date} at {time} for IBFT to {first} {last}. Avl Bal: {balance}. -{bank}"
    - "Dear Customer, your A/C ****{digits:4} has been credited with {amount} on {date}. Avl Bal: {balance}."
    - "Your OTP for online transaction of {amount} at {shop} is {digits:6}. Do not share with anyone. -{bank}"
    - "Cash withdrawal of {amount} from ATM using card ****{digits:4} on {date}. Avl Bal: {balance}."
    - "{bank} kabhi bhi aap se PIN, OTP ya password nahi poochta. Kisi ko na batayen."
    - {text: "محترم صارف، آپ کے اکاؤنٹ ****{digits:4} میں {amount} جمع ہو گئے ہیں۔ -{bank}", script: Arab}
  telecom:
    - "Sirf {amount} mein 10GB internet aur 1000 mins hasil karein, 30 din ke liye. Dial *{digits:3}#"
    - "Aap ka balance {balance} hai. Validity {date} tak."
    - "Recharge successful. {amount} credited. Your balance is {balance}."
    - "Aap ka internet bundle 80% istemal ho chuka hai. Mazeed MBs ke liye *{digits:3}# dial karein."
    - "Advance balance {amount} aap ke account mein add kar diya gaya hai. Agle recharge par {fee} service charges ke sath kaat liya jayega."
    - {text: "خوشخبری! صرف {amount} میں ہفتہ بھر انٹرنیٹ حاصل کریں۔ ڈائل کریں *{digits:3}#", script: Arab}
  otp_service:
    - "{digits:6} is your verification code. Do not share it with anyone."
    - "<#> Your code is {digits:6} {code}"
    - "Your OTP is {digits:4}. It is valid for 5 minutes."
    - "Use {digits:6} to verify your mobile number."
    - "Aap ka verification code {digits:6} hai. Ye code kisi ko na batayen."
  doctor:
    - "Your appointment is confirmed for {date} at {time}. Token # {digits:2}. Please arrive 15 min early."
    - "Reminder: aap ka doctor ke sath appointment kal {time} bajay hai."
    - "Your lab report is ready. View online with MR# {digits:7}."
    - "Please come fasting for your test on {date}."
    - {text: "آپ کی ڈاکٹر سے ملاقات {date} کو {time} بجے ہے۔", script: Arab}
  pharmacy:
    - "Your medicine order #{digits:7} is confirmed. Delivery by {date}. Total {amount}."
    - "Your order is out for delivery. Rider {first} will contact you."
    - "Reminder: aap ki monthly medicines ka waqt ho gaya hai. Abhi order karein."
    - "Order {code} delivered. Shukriya."
    - "Your prescription has been verified for order {code}."
  delivery_food:
    - "Your order from {shop} is on its way! Rider {first} will reach in {digits:2} mins."
    - "Order #{digits:6} confirmed. Total {amount}. Cash on delivery."
    - "Your order has been delivered. Enjoy your meal!"
    - "Bhook lagi hai? {shop} par aaj 40% off. Abhi order karein!"
    - "Your rider has arrived. Please collect your order."
  ride_hailing:
    - "Your captain {first} is arriving in a white car {code}. ETA 4 min."
    - "Your captain has arrived at the pickup location."
    - "Ride completed. Fare {amount}. Shukriya!"
    - "Your ride PIN is {digits:4}. Share with captain at start."
    - "Your ride has been cancelled. Please request again."
  airline:
    - "Online check-in is now open for your flight to {city} on {date}. PNR {code}."
    - "Your flight to {city} is scheduled at {time}. Please report 3 hours before for international flights."
    - "Flight delayed: new departure time {time}. We regret the inconvenience."
    - "Booking confirmed. PNR {code}. Departure {date} {time}."
    - "Boarding gate {digits:2} for flight to {city}. Gate closes at {time}."
  rail:
    - "Your seat is reserved. PNR {digits:8}, Train {digits:3} Up, {date} {time}, Coach {digits:1} Seat {digits:2}."
    - "Train {digits:3} Dn is running late by {digits:2} min."
    - "Your ticket PNR {digits:8} has been cancelled. Refund {amount}."
    - "Reminder: your train to {city} departs tomorrow at {time}."
    - "Booking confirmed. Ticket no {code}. Total {amount}."
  government:
    - "Your CNIC application {code} is ready for collection from the {city} centre."
    - "Your passport application tracking ID {digits:12} is under process."
    - "Aap ki SIMs ki tadaad janne ke liye apna CNIC number 668 par bhejein."
    - "Your vehicle token tax is due. Pay online before {date} to avoid penalty."
    - "Your tax return for tax year 2026 has been received. Ref {code}."
  retail:
    - "Thank you for shopping at {shop}! Bill {amount}. Points earned {digits:3}."
    - "Mega Sale! Flat 50% off at {shop}. Sirf {date} tak. T&C apply"
    - "Your order {code} has been delivered."
    - "Your refund of {amount} for order {code} has been processed."
    - "Eid collection a gayi hai! {shop} par visit karein."
  utility:
    - "Your electricity bill ref {digits:14} amount {amount} due date {date}. Pay on time to avoid surcharge."
    - "Shutdown notice: {date} ko {time} se bijli band rahegi maintenance ki wajah se."
    - "Your gas bill of {amount} is due on {date}. Consumer # {digits:10}."
    - "Payment of {amount} received against ref {digits:14}. Thank you."
    - "Paani ki supply kal subah {time} tak band rahegi."
  mobile_money:
    - "Trx ID {digits:11}. You have received {amount} from {first} {last} on {date} at {time}. Your new balance is {balance}."
    - "Trx ID {digits:11}. You have sent {amount} to {first} {last} on {date} at {time}. Fee {fee}. Your new balance is {balance}."
    - "{amount} has been paid to {shop}. Trx ID {digits:11}. Balance {balance}."
    - "Mobile load of {amount} successful. Trx ID {digits:11}."
    - "Aap ne {first} {last} ko {amount} bheje hain. Trx ID {digits:11}. Naya balance {balance}."
  loan:
    - "Dear Customer, your loan installment of {amount} is due on {date}. Please pay on time."
    - "Your loan of {amount} has been disbursed to your wallet."
    - "Aap ki qist {amount} {date} tak ada karni hai. Waqt par ada karein."
    - "Your loan is overdue. Pay {amount} today to avoid late charges."
    - "Thank you for repayment of {amount}. Remaining balance {balance}."
