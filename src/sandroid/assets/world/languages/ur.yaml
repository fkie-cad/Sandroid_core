# Urdu language pack. Personal texts are mostly Roman Urdu (the default way people text
# in Pakistan); entries tagged `script: Arab` are in Urdu (Nastaliq) script.
# Pakistani service SMS are mostly English, telecom promos often Roman Urdu or Urdu script.
# `emoji: true` marks threads/entries containing emoji.
# Proposed (not yet in schema v1): `script` tag, service kinds `mobile_money`, `loan`,
# placeholders `{balance}`, `{fee}`, list values in `call_names`. See SOURCES.md.
pack: language
schema: 1.1
lang: ur
name: اردو (Roman Urdu)
threads:
  family:
    - {msgs: [[p, "Beta khana kha liya?"], [o, "Ji ammi kha liya"], [p, "Kya khaya"], [o, "Daal chawal bana liye thay"], [p, "Acha. Abbu ko call kar lena wo pooch rahe thay"]]}
    - {msgs: [[p, "Kab tak aao ge"], [o, "Eid se 2 din pehle in sha Allah"], [p, "Ticket kara li?"], [o, "Ji kal kara li"]]}
    - {emoji: true, msgs: [[p, "Happy birthday meri jaan 🎂 Allah lambi umar de"], [o, "Thank you ammi ❤️"], [p, "Shaam ko video call karna"]]}
    - {msgs: [[o, "Pohanch gaya hun"], [p, "Shukar hai. Araam karo ab"]]}
    - {script: Arab, msgs: [[p, "بیٹا دوائی لے لی؟"], [o, "جی امی لے لی"], [p, "ٹھنڈ میں باہر مت جانا"]]}
    - {msgs: [[p, "Bhai abbu ka number band aa raha"], [o, "Charging pe hoga, main ne abhi baat ki"], [p, "Ok shukriya"]]}
    - {msgs: [[p, "Baji ki mehndi ki date fix ho gayi"], [o, "Kab hai?"], [p, "{date}. Chuttiyan pehle se le lena"], [o, "Ji office mein bata dunga"]]}
    - {emoji: true, msgs: [[p, "Kal wali pics bhejo"], [o, "Bhej di hain"], [p, "Bohat pyari ayi hain 😍"]]}
    - {msgs: [[p, "Bijli ka bill jama karwa diya?"], [o, "Ji app se kar diya"], [p, "Jazak Allah"]]}
    - {script: Arab, emoji: true, msgs: [[p, "عید مبارک 🌙"], [o, "آپ کو بھی خیر مبارک چاچو"]]}
  partner:
    - {msgs: [[p, "Kahan ho"], [o, "Raste mein hun, 15 min"], [p, "Aate hue doodh aur double roti le aana"], [o, "Theek hai"]]}
    - {emoji: true, msgs: [[p, "Miss kar rahi hun 🥺"], [o, "Main bhi jaan ❤️"], [p, "Jaldi aa jao"]]}
    - {msgs: [[o, "Aaj bahar khana khayen?"], [p, "Haan please aaj pakane ka mood nahi"], [o, "8 baje tayyar rehna"]]}
    - {emoji: true, msgs: [[p, "Late ho jaunga meeting lambi ho gayi"], [o, "Hmm 😒"], [p, "Ice cream le aunga"], [o, "😂 acha theek hai"]]}
    - {msgs: [[o, "Meri chabiyan dekhi?"], [p, "TV ke paas table pe hain"], [o, "Mil gayin shukriya"]]}
    - {msgs: [[p, "Ammi Sunday ko aa rahi hain"], [o, "Acha main station se le aunga"]]}
    - {msgs: [[p, "Ghar pohanch gaye?"], [o, "Haan abhi"], [p, "Ok gn"]]}
    - {msgs: [[p, "Gas ka bill aya hai is dafa zyada"], [o, "Kitna?"], [p, "{amount}"], [o, "Kal jama kara deta hun"]]}
  friend:
    - {msgs: [[p, "Yaar kidhar hai"], [o, "Bas 5 min"], [p, "Tera 5 min matlab aadha ghanta"], [o, "Arey pohanch gaya bas"]]}
    - {emoji: true, msgs: [[p, "Aaj match dekhne aa raha?"], [o, "Haan pakka"], [p, "Samosay le aana 😂"]]}
    - {emoji: true, msgs: [[o, "Happy birthday yaar 🎉 treat kab hai"], [p, "Thanks bhai. Saturday ko"], [o, "Done"]]}
    - {msgs: [[p, "Yaar notes bhej de kal walay"], [o, "Abhi bhejta hun"], [p, "Shukriya yaar"]]}
    - {msgs: [[p, "Murree ka plan pakka?"], [o, "Haan bas gaari ka intezam karna hai"], [p, "Meri gaari le chalte hain"]]}
    - {emoji: true, msgs: [[p, "Group mein dekha {first} ne kya bheja 😂😂"], [o, "Hahaha pagal hai wo"]]}
    - {msgs: [[o, "Yaar 2000 bhej sakta hai? kal wapas kar dunga"], [p, "Bhej diye"], [o, "Thanks bhai"]]}
