    - {msgs: [[p, "Report bhej di?"], [o, "Ji email kar di 10 min pehle"], [p, "Thanks"]]}
    - {msgs: [[o, "Aaj ghar se kaam kar raha hun, kuch urgent ho to call kar lena"], [p, "Ok sure"]]}
    - {msgs: [[p, "Lunch pe chalein?"], [o, "Haan 1:30 pe, namaz ke baad"]]}
    - {msgs: [[o, "Traffic mein phansa hun, 15 min late"], [p, "Koi masla nahi"]]}
    - {msgs: [[p, "Kal client visit hai, formal aana"], [o, "Ji yaad hai"]]}
    - {msgs: [[p, "Leave approve hui?"], [o, "Abhi tak nahi, manager ko reminder bheja hai"]]}
    - {msgs: [[p, "Please presentation shaam tak share kar dein"], [o, "Ji 5 bajay tak bhej dunga"]]}
