# Filipino language pack. Personal texts are Taglish (Tagalog-English code-switching)
# with common text shortcuts (san, nasan, otw, sge, d2, lng, nmn, po/opo).
# Philippine service SMS are mostly English; telecom promos often Taglish.
# `emoji: true` marks threads/entries containing emoji.
# Proposed (not yet in schema v1): service kinds `mobile_money`, `loan`,
# placeholders `{balance}`, `{fee}`, list values in `call_names`. See SOURCES.md.
pack: language
schema: 1
lang: fil
name: Filipino (Taglish)
threads:
  family:
    - {msgs: [[p, "Anak kumain ka na ba?"], [o, "Opo ma kakatapos lang"], [p, "Ano ulam mo"], [o, "Adobo po"], [p, "Sige ingat ka lagi"]]}
    - {msgs: [[p, "Uuwi ka ba sa Pasko?"], [o, "Opo ma, naka-book na ko"], [p, "Kailan dating mo"], [o, "{date} po ng gabi"]]}
    - {emoji: true, msgs: [[p, "Happy birthday anak! 🎂 God bless you always"], [o, "Thank you po ma ❤️"], [p, "Video call tayo mamaya"]]}
    - {msgs: [[o, "Nakarating na po ako"], [p, "Salamat sa Diyos. Pahinga ka na"]]}
    - {msgs: [[p, "Nak padala ka na ba ng pambayad sa kuryente?"], [o, "Opo kanina pa, check nyo po"], [p, "Ok na natanggap ko na salamat"]]}
