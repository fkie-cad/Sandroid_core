service_sms:
  courier:
    - "Your parcel {tracking} is out for delivery today. Please prepare the exact amount of {amount} for COD."
    - "{courier}: Your parcel {tracking} has been delivered on {date} {time}. Received by: {first}."
    - "Your order from {shop} has been shipped. Tracking no: {tracking}"
    - "We tried to deliver your parcel {tracking} but no one was available. We will attempt again on {date}."
    - "Hi! Si {first} ito, rider ng parcel nyo {tracking}. Papunta na po ako."
  bank:
    - "{bank}: Your OTP is {digits:6}. NEVER share this with anyone. {bank} will never ask for your OTP."
    - "{bank}: You have successfully transferred {amount} to {first} {last} on {date} {time}. Ref No. {digits:12}"
    - "{bank}: Your account ending {digits:4} was credited with {amount} on {date}. Avail bal: {balance}"
    - "A purchase of {amount} was made using your card ending {digits:4} at {shop} on {date}."
    - "Your credit card statement is ready. Total amount due: {amount}. Due date: {date}."
  telecom:
    - "You have successfully loaded {amount}. Your load balance is {balance}, valid until {date}."
    - "You have received {amount} load from {first}. Ref: {digits:12}"
    - "Your data promo will expire on {date}. Mag-register ulit para tuloy-tuloy ang surfing!"
    - "Sulit deal! 30GB for 30 days for only {amount}. Dial *{digits:3}# para mag-register."
    - "Your registration to 15GB+unli calls is successful. Valid until {date}."
    - "You have used 90% of your data. Mag-add-on na para hindi maputol."
  otp_service:
    - "{digits:6} is your verification code. Do not share this code with anyone."
    - "<#> Your OTP is {digits:6}. {code}"
    - "Your one-time PIN is {digits:6}. It will expire in 5 minutes."
    - "Use {digits:4} to verify your mobile number."
    - "Huwag ibigay ang code na ito kahit kanino. Code: {digits:6}"
  doctor:
    - "Reminder: Your check-up is on {date} at {time}. Please bring your HMO card."
    - "Your appointment has been confirmed for {date}, {time}. Queue no. {digits:2}."
    - "Your lab results are now available. Ref {code}."
    - "Please fast for 8-10 hours before your test on {date}."
    - "Ang inyong appointment sa {date} ay na-reschedule. Tumawag po para sa bagong schedule."
  pharmacy:
    - "Your order #{digits:8} is confirmed. Delivery on {date}. Total: {amount}."
    - "Your medicines are out for delivery."
    - "Time to refill your maintenance meds! Order now and get free delivery."
    - "Your prescription for order {code} has been verified."
    - "Order {code} delivered. Thank you!"
  delivery_food:
    - "Your order from {shop} is on the way! Rider {first} will arrive in {digits:2} mins."
    - "Order #{digits:6} confirmed. Total {amount}."
    - "Your order has been delivered. Enjoy your meal!"
    - "Gutom na? 50% OFF sa {shop} today only!"
    - "Nandito na po ang rider sa labas."
  ride_hailing:
    - "Your driver {first} is on the way. Plate no. {code}. ETA 4 mins."
    - "Your driver has arrived at the pick-up point."
    - "Trip completed. Fare: {amount}. Thanks for riding!"
    - "Your ride PIN is {digits:4}."
    - "Sorry, your booking was cancelled by the driver. Finding you another ride."
  airline:
    - "Online check-in is now open for your flight to {city} on {date}. Booking ref {code}."
    - "Your flight to {city} is now boarding at Gate {digits:1}."
    - "Flight advisory: your flight to {city} has been delayed. New departure: {time}."
    - "Booking confirmed! Ref {code}. Departure {date} {time}."
    - "Reminder: please be at the airport at least 2 hours before your flight."
  rail:
    - "Your ticket is confirmed. Booking ref {code}. Departure {date} {time}."
    - "Train service advisory: delays of {digits:2} minutes expected this morning."
    - "Your bus/train ticket to {city} on {date} is confirmed. Seat {digits:2}."
    - "Reminder: your trip to {city} departs tomorrow at {time}."
    - "Refund of {amount} for booking {code} has been processed."
  government:
    - "Your National ID is ready for delivery. Tracking {tracking}."
    - "Your application {code} has been received and is being processed."
    - "Reminder: deadline for filing of annual income tax return is {date}."
    - "Your appointment at the {city} office is on {date} at {time}. Bring your valid ID."
    - "Your SIM registration is successful. Ref No. {code}."
  retail:
    - "Thank you for shopping at {shop}! You earned {digits:3} points."
    - "PAYDAY SALE! Up to 70% off at {shop} until {date}."
    - "Your order {code} has been shipped."
    - "Your refund of {amount} for order {code} is processed."
    - "11.11 sale na bukas! Check out {shop}."
  utility:
    - "Your electric bill for this month is {amount}, due on {date}. Acct no. {digits:10}."
    - "Scheduled power interruption on {date}, {time}, due to maintenance works."
    - "Water service interruption advisory: {date} from {time}."
    - "Payment of {amount} received. Ref {code}. Thank you!"
    - "Your water bill of {amount} is due on {date}."
  mobile_money:
    - "You have received {amount} of wallet balance from {first} {last}. Your new balance is {balance}. Ref. No. {digits:13}."
    - "You have sent {amount} to {first} {last} on {date} {time}. Ref. No. {digits:13}. Your new balance is {balance}."
    - "You have paid {amount} to {shop}. Ref. No. {digits:13}."
    - "Cash-in of {amount} successful. Your new balance is {balance}."
    - "You have successfully bought {amount} load for {first}. Ref. No. {digits:13}."
  loan:
    - "Reminder: your loan payment of {amount} is due on {date}. Pay on time to avoid penalties."
    - "Congratulations! Your loan of {amount} has been approved and credited to your wallet."
    - "Your loan is now overdue. Please settle {amount} today."
    - "Thank you for your payment of {amount}. Remaining balance: {balance}."
    - "Pwede ka nang mag-loan ng hanggang {amount}! Apply na sa app."
