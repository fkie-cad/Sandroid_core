# Language pack: Dutch (nl). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see nl.SOURCES.md.
# Conventions: friends/family/partner/neighbours use "je/jij"; banks, government,
# doctors and utilities use "u"; apps, delivery and OTP services often use "je"
# (as real Dutch services do).
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1
lang: nl
name: Nederlands

threads:
  family:
    - msgs:
        - [p, "Kom je zondag eten? Opa en oma komen ook"]
        - [o, "Ja leuk! Hoe laat?"]
        - [p, "Rond 5 uur. Neem {partner_first} mee hoor"]
        - [o, "Doe ik 👍"]
      emoji: true
    - msgs:
        - [p, "Ben je al thuis?"]
        - [o, "Ja net binnen"]
        - [p, "Fijn. Slaap lekker xx"]
    - msgs:
        - [p, "Heb je mijn appje gezien over de verjaardag van tante Ria?"]
        - [o, "Nee sorry, wanneer is het?"]
        - [p, "{day} om 3 uur, bij haar thuis"]
        - [o, "Ok ik kom, neem wel taart mee"]
    - msgs:
        - [p, "Kun je me ff bellen als je tijd hebt?"]
        - [o, "Is er iets?"]
        - [p, "Nee hoor niks ergs, gaat over de vakantie"]
        - [o, "Ok bel je vanavond"]
    - msgs:
        - [p, "De tv doet het weer niet. Hoe moest dat ook alweer met die afstandsbediening"]
        - [o, "Op 'source' drukken en dan HDMI 1"]
        - [p, "Gelukt! Je bent een schat"]
        - [o, "😂"]
      emoji: true
    - msgs:
        - [p, "Gefeliciteerd lieverd!! 🎉🎂 Fijne dag vandaag"]
        - [o, "Dankjewel mam ❤️"]
      emoji: true
    - msgs:
        - [p, "Ik ben {date} in {city}, zullen we samen lunchen?"]
        - [o, "Ja gezellig! Waar?"]
        - [p, "Zeg jij het maar, jij kent het daar beter"]
        - [o, "Bij {place} zit een leuk tentje, 12 uur?"]
        - [p, "Top"]
    - msgs:
        - [p, "Heb je nog die ladder van papa? Wij hebben hem nodig zaterdag"]
        - [o, "Staat in de schuur, haal maar op"]
    - msgs:
        - [p, "Kerst dit jaar bij ons of bij jullie?"]
        - [o, "Bij jullie toch? Wij deden vorig jaar"]
        - [p, "Klopt haha. Prima"]
    - msgs:
        - [p, "Ik heb {amount} overgemaakt voor het cadeau van oma"]
        - [o, "Thx! Ik bestel het vandaag"]
    - msgs:
        - [p, "Staan in de file bij de afrit, wordt half uurtje later"]
        - [o, "Geen probleem, rij voorzichtig"]
        - [p, "😘"]
      emoji: true

  partner:
    - msgs:
        - [p, "Moet ik nog iets meenemen van de supermarkt?"]
        - [o, "Melk, brood en kaas"]
        - [p, "Ok"]
    - msgs:
        - [p, "Ben er zo"]
        - [o, "👍"]
      emoji: true
    - msgs:
        - [o, "Wordt later vandaag, overleg loopt uit"]
        - [p, "Balen 😕 hoe laat ongeveer?"]
        - [o, "Rond {time}"]
        - [p, "Ok dan eet ik vast. Bewaar wat voor je"]
        - [o, "Lief ❤️"]
      emoji: true
    - msgs:
        - [p, "Heb jij de sleutels van de fiets?"]
        - [o, "Nee die hangen aan het haakje"]
        - [p, "Hangen er niet..."]
        - [p, "Laat maar, zaten in mijn jaszak 🙈"]
      emoji: true
    - msgs:
        - [p, "Niet vergeten: tandarts morgen {time}"]
        - [o, "O ja shit, was ik echt vergeten"]
        - [p, "Weet ik 😏"]
      emoji: true
    - msgs:
        - [o, "Zin om vanavond naar de film te gaan?"]
        - [p, "Jaa welke"]
        - [o, "Maakt me niet uit, kies jij maar"]
        - [p, "Ok stuur zo ff wat"]
    - msgs:
        - [p, "Mis je xx"]
        - [o, "Ik jou ook. Nog 2 nachtjes"]
        - [p, "Te lang 💕"]
      emoji: true
    - msgs:
        - [p, "Kun jij het pakketje van {courier} bij de buren ophalen? Ik red het niet"]
        - [o, "Is goed"]
    - msgs:
        - [o, "Goed aangekomen?"]
        - [p, "Jep, trein had maar 20 min vertraging haha"]
        - [o, "Bijna op tijd dus"]
    - msgs:
        - [p, "Wat eten we vanavond"]
        - [o, "Pizza?"]
        - [p, "Alweer 😂"]
        - [o, "Ok ok dan maak ik pasta"]
      emoji: true
    - msgs:
        - [p, "Welterusten schat"]
        - [o, "Slaap lekker xx"]

  friend:
    - msgs:
        - [p, "Hoi! Hoe is het? Lang niks gehoord"]
        - [o, "Hee! Goed hoor, druk druk. Met jou?"]
        - [p, "Zelfde haha. Moeten echt weer eens afspreken"]
        - [o, "Idd! Volgende week?"]
        - [p, "Do of vr kan ik"]
        - [o, "Vr is top"]
    - msgs:
        - [p, "Kom je vanavond ook?"]
        - [o, "Waar gaan jullie heen"]
        - [p, "{place}, vanaf {time}"]
        - [o, "Ben erbij 🍻"]
      emoji: true
    - msgs:
        - [p, "Hvj!! 🥳🎉 Maak er een mooie dag van"]
        - [o, "Dankjee 🥰"]
      emoji: true
    - msgs:
        - [p, "Wil je de foto's van zaterdag ff sturen?"]
        - [o, "Ja doe ik vanavond"]
        - [p, "Thx"]
    - msgs:
        - [p, "Sorry kom 10 min later"]
        - [o, "Geen stress"]
        - [p, "Bestel je vast een koffie voor me? Cappuccino"]
        - [o, "Ok top"]
    - msgs:
        - [o, "Heb jij nog mijn oplader?"]
        - [p, "Ohja sorry 😅 neem ik mee"]
      emoji: true
    - msgs:
        - [p, "Wie komen er allemaal {day}?"]
        - [o, "Ik, Sanne en wss Jeroen"]
        - [p, "Ok ik neem salade mee"]
        - [o, "Lekker"]
    - msgs:
        - [p, "Zag je de wedstrijd gisteren"]
        - [o, "Jaaa niet normaal"]
        - [p, "Die laatste goal 😱"]
        - [o, "Volgende keer samen kijken"]
      emoji: true
    - msgs:
        - [p, "Weet jij een goede kapper in {city}?"]
        - [o, "Ik ga altijd naar eentje in het centrum, stuur je zo het nummer"]
        - [p, "Top dankje"]
    - msgs:
        - [o, "Morgen hardlopen?"]
        - [p, "Hoe laat"]
        - [o, "7 uur bij {place}"]
        - [p, "Pff ok maar max 5 km"]
    - msgs:
        - [p, "Thuis! Was echt gezellig vanavond"]
        - [o, "Zeker, snel weer 😄"]
      emoji: true
    - msgs:
        - [p, "Heb jij dat betaalverzoek van het etentje al betaald?"]
        - [o, "Nee vergeten, doe ik nu"]

  colleague:
    - msgs:
        - [p, "Hoi {owner_first}, ben je vandaag op kantoor?"]
        - [o, "Nee vandaag thuis"]
        - [p, "Ok dan mail ik je de stukken"]
        - [o, "Dankje"]
    - msgs:
        - [p, "Het overleg van {time} is verplaatst naar morgen"]
        - [o, "Ok bedankt voor het laten weten"]
    - msgs:
        - [p, "Ik ben ziek vandaag, wil jij het even doorgeven aan het team?"]
        - [o, "Doe ik, beterschap!"]
        - [p, "Dank je"]
    - msgs:
        - [p, "Lunchen?"]
        - [o, "Ja, 12:30 beneden?"]
        - [p, "👍"]
      emoji: true
    - msgs:
        - [o, "Sta in de file op de A12, ben 15 min later"]
        - [p, "Geen probleem, we beginnen vast"]
    - msgs:
        - [p, "Kun je me de presentatie van gisteren sturen?"]
        - [o, "Staat op de gedeelde schijf, map Projecten"]
        - [p, "Gevonden, thx!"]
    - msgs:
        - [p, "Denk je aan de deadline van {day}?"]
        - [o, "Ja, ben bijna klaar"]
    - msgs:
        - [p, "We zamelen in voor het afscheid van Marieke, doe je mee? 10 euro"]
        - [o, "Ja natuurlijk, geef ik je morgen"]
    - msgs:
        - [p, "Fijne vakantie! Geniet ervan 🌴☀️"]
        - [o, "Dank je! Tot over 2 weken"]
      emoji: true
    - msgs:
        - [p, "Weet jij of de parkeergarage morgen dicht is?"]
        - [o, "Ja ivm onderhoud, pak de trein maar"]
        - [p, "Ok thx"]
    - msgs:
        - [p, "Vrijdagmiddagborrel om 4 uur, kom je ook?"]
        - [o, "Ik schuif aan 🍺"]
      emoji: true

  neighbor:
    - msgs:
        - [p, "Goedemiddag, met {first} van hiernaast. Ik heb een pakketje voor u aangenomen"]
        - [o, "Wat fijn, dank u wel! Ik kom het vanavond halen"]
    - msgs:
        - [p, "Hoi, zou jij dit weekend onze planten water willen geven? We zijn weg"]
        - [o, "Ja hoor, geen probleem. Sleutel zoals altijd?"]
