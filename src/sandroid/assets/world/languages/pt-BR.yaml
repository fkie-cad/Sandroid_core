    - "Codigo: {digits:4}. Valido por 10 minutos."
    - "Use {digits:6} para redefinir sua senha. Se nao solicitou, ignore esta mensagem."
    - "Seu codigo de confirmacao: {digits:6}. Nunca informe este codigo por telefone."
  telecom:
    - "Seu saldo e de {amount}. Recarregue pelo app ou disque *222#."
    - "Voce usou 80% da sua internet. Contrate um pacote adicional pelo app."
    - "Sua internet acabou. Navegacao reduzida ate a renovacao do plano."
    - "Recarga de {amount} realizada com sucesso."
    - "Sua fatura de {amount} vence em {date}. Codigo de barras disponivel no app."
    - "Seu plano foi renovado. Aproveite sua internet."
