# Language pack: Brazilian Portuguese (pt-BR). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see pt-BR.SOURCES.md.
# Conventions: friends/family/partner/neighbours use informal "você"/"vc"; services use
# neutral "você" or impersonal forms (the real norm for Brazilian service SMS).
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1.1
lang: pt-BR
name: Português (Brasil)

threads:
  family:
    - msgs:
        - [p, "Filho vem almoçar domingo?"]
        - [o, "Vou sim mae, chego umas 12h"]
        - [p, "Traz a {partner_first} tb"]
        - [o, "Blz, falo com ela"]
    - msgs:
        - [p, "Chegou bem?"]
        - [o, "Cheguei sim"]
        - [p, "Graças a Deus 🙏 dorme com Deus"]
        - [o, "Amem mae, bjs"]
      emoji: true
    - msgs:
        - [p, "Me ajuda com o celular, as mensagens pararam de apitar"]
        - [o, "Ve se ta no silencioso"]
        - [p, "Como ve isso"]
        - [o, "Te ligo de noite e te explico"]
        - [p, "Ta bom filho obg"]
    - msgs:
