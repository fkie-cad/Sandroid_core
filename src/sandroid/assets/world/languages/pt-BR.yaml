service_sms:
  courier:
    - "Seu pedido {tracking} saiu para entrega e chega hoje ate as {time}."
    - "{courier}: Objeto {tracking} entregue ao destinatario."
    - "Nao conseguimos entregar o objeto {tracking}. Nova tentativa em {date}."
    - "Sua encomenda {tracking} esta disponivel para retirada. Codigo: {code}"
    - "{courier}: Objeto {tracking} em transito. Previsao de entrega: {day}."
    - "Sua encomenda {tracking} esta no armario inteligente. Senha: {digits:6}. Retire ate {date}."
  bank:
    - "{bank}: Compra aprovada de {amount} em {shop} no cartao final {digits:4}."
    - "{bank}: Seu codigo de seguranca e {digits:6}. Nao compartilhe com ninguem."
