    - "Clinica: confirmamos seu exame em {date} as {time}. Chegue com 15 min de antecedencia."
    - "Sua consulta odontologica e amanha as {time}. Traga documento com foto e carteirinha do convenio."
    - "Sua consulta de {date} foi desmarcada. Entre em contato para reagendar."
    - "Seus resultados ja estao disponiveis no portal do paciente."
  pharmacy:
    - "Seu pedido esta pronto para retirada na farmacia a partir das {time}."
    - "Farmacia: pedido {code} saiu para entrega."
    - "Os produtos que voce encomendou chegaram e ficam reservados ate {date}."
    - "Ganhe desconto informando seu CPF no caixa. CPF final {digits:3}."
    - "Sua receita foi recebida. Avisaremos quando estiver tudo separado."
  delivery_food:
    - "Seu pedido em {shop} foi confirmado. Previsao de entrega: {time}."
    - "Seu pedido saiu para entrega! O entregador chega em cerca de 10 minutos."
    - "O entregador chegou. Bom apetite!"
    - "Seu pedido em {shop} vai atrasar uns 15 minutos. Desculpe o transtorno."
    - "Pedido {code} cancelado. O valor de {amount} sera estornado."
    - "Codigo de entrega do seu pedido: {digits:4}. Informe ao entregador."
  ride_hailing:
    - "Seu motorista esta a caminho e chega em cerca de 4 minutos."
    - "Seu motorista chegou. Placa: {code}"
    - "Codigo da sua viagem: {digits:4}. Informe somente ao motorista."
    - "Obrigado por viajar conosco. Total: {amount}. Recibo no app."
    - "Sua viagem das {time} foi agendada. Embarque em {place}."
  airline:
    - "Check-in aberto para o voo {code} de {date}. Cartao de embarque no app."
    - "Mudanca de portao do voo {code}: novo portao {digits:2}."
    - "Seu voo {code} esta atrasado. Novo horario de partida: {time}."
    - "Embarque do voo {code} inicia as {time}. Dirija-se ao portao."
    - "Reserva {code} confirmada: {city}, {date}. Boa viagem!"
  rail:
    - "Sua passagem de onibus para {city} em {date}: localizador {code}."
    - "Seu onibus para {city} sai hoje da plataforma {digits:2}."
    - "Seu onibus das {time} para {city} esta atrasado cerca de 20 minutos."
    - "Poltrona {digits:2} confirmada. Boa viagem!"
    - "Sua viagem das {time} para {city} foi cancelada. Veja alternativas no app."
  government:
    - "Agendamento confirmado em {date} as {time}. Protocolo {code}."
    - "Lembrete: seu atendimento no posto e amanha as {time}. Leve documento com foto."
    - "Sua carteira de identidade esta pronta para retirada."
    - "Recebemos sua solicitacao {code}. Acompanhe pelo portal."
    - "Seu passaporte esta disponivel para retirada. Leve o protocolo e o passaporte anterior."
  retail:
    - "Seu pedido {code} na {shop} foi enviado."
    - "{shop}: seu pedido esta pronto para retirada na loja. Codigo {digits:6}"
    - "So hoje: 20% off em toda a loja {shop}. Sair: responda SAIR"
    - "Recebemos sua devolucao. O reembolso de {amount} sera feito em ate 5 dias uteis."
    - "{shop}: seu cupom de desconto para a proxima compra: {code}"
  utility:
    - "Sua conta de luz de {amount} vence em {date}."
    - "Conta de agua disponivel. Valor: {amount}. Pague pelo app ou boleto."
    - "Interrupcao programada de energia em {date} das 9h as 13h."
    - "Aviso de debito: regularize sua conta para evitar o corte do fornecimento."
    - "Leitura do seu medidor sera feita em {date}. Mantenha o acesso livre."

