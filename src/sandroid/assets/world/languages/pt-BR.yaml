        - [o, "Ainda nao 😅"]
        - [p, "Sempre em cima da hora né"]
        - [o, "Kkkk vou comprar no fds prometo"]
      emoji: true
    - msgs:
        - [p, "Te mandei um pix de {amount} pra viagem"]
        - [o, "Mae nao precisava!"]
        - [p, "Precisava sim, aproveita ❤️"]
      emoji: true
    - msgs:
        - [p, "Vó perguntou se vc vem no natal"]
        - [o, "Vou sim ja comprei a passagem"]
        - [p, "Ela vai ficar mt feliz 🥰"]
