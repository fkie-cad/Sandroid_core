        - [p, "Grave, on voit quoi"]
        - [o, "Choisis toi"]
        - [p, "Ok je regarde les séances"]
    - msgs:
        - [p, "Tu me manques 💕"]
        - [o, "Toi aussi. Plus que 2 jours"]
        - [p, "C est long"]
      emoji: true
    - msgs:
        - [p, "Tu peux récupérer le colis chez la voisine ? Je pourrai pas aujourd hui"]
        - [o, "Oui tkt"]
    - msgs:
        - [o, "Bien arrivée ?"]
        - [p, "Oui, le train avait que 20 min de retard mdr"]
