# Language pack: French (fr). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see fr.SOURCES.md.
# Conventions: friends/family/partner/neighbours use "tu"; services use "vous".
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1
lang: fr
name: Français

threads:
  family:
    - msgs:
        - [p, "Tu viens manger dimanche midi ?"]
        - [o, "Oui normalement, vers 12h30"]
        - [p, "Super. Tu peux venir avec {partner_first} bien sur"]
        - [o, "Ok je lui dis"]
    - msgs:
        - [p, "Bien rentré ?"]
        - [o, "Oui tout va bien, je viens d arriver"]
        - [p, "Ok bonne nuit mon chéri 😘"]
      emoji: true
    - msgs:
        - [p, "Tu n oublies pas l anniversaire de papa {day} hein"]
        - [o, "Mais non maman 🙄"]
        - [o, "J ai deja le cadeau"]
        - [p, "C est quoi ?"]
        - [o, "Surprise 😁"]
      emoji: true
    - msgs:
        - [p, "Appelle moi quand tu peux stp"]
        - [o, "Ya un souci ?"]
        - [p, "Non non rien de grave, c est pour Noël"]
        - [o, "Ok je t appelle ce soir"]
    - msgs:
        - [p, "La box internet marche plus, tu sais comment on la redemarre ?"]
        - [o, "Tu débranches 30 secondes et tu rebranches"]
        - [p, "J ai fait ça ça marche pas"]
        - [o, "Ok je passe samedi je regarde"]
        - [p, "Merci mon grand"]
    - msgs:
        - [p, "Mamie demande si tu passes {day} pour le goûter"]
        - [o, "Oui vers 16h, fais lui un bisou"]
    - msgs:
        - [p, "Je serai a {city} le {date}, t es dispo le soir ?"]
        - [o, "Oui ! Ton train arrive a quelle heure"]
        - [p, "Vers {time}"]
        - [o, "Je viens te chercher a la gare 👍"]
      emoji: true
    - msgs:
        - [p, "Je t ai fait un virement de {amount} pour les billets"]
        - [o, "Merci c était pas la peine"]
        - [p, "Si si"]
    - msgs:
        - [p, "Le gigot est au four, vous arrivez quand ?"]
        - [o, "On est dans les bouchons, une demi heure de retard environ"]
        - [p, "Pas grave roulez doucement"]
    - msgs:
        - [p, "Joyeuses Pâques a tous 🐣🍫"]
        - [o, "Merci a vous aussi ! Bisous a tout le monde"]
      emoji: true
    - msgs:
        - [p, "T as pensé a renvoyer le papier pour la mutuelle ?"]
        - [o, "Oups non"]
        - [p, "Fais le cette semaine sinon ils vont relancer"]
        - [o, "Oui oui promis"]

  partner:
    - msgs:
        - [p, "Je prends quelque chose en rentrant ?"]
        - [o, "Du pain et du lait stp"]
        - [p, "Ok 👍"]
      emoji: true
    - msgs:
        - [p, "J arrive dans 10 min"]
        - [o, "Ok"]
    - msgs:
