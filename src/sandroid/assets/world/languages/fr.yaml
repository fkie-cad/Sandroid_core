        - [o, "Non elles sont sur le meuble de l entrée"]
        - [p, "Super..."]
        - [p, "C bon elles étaient dans ma poche 🙈"]
      emoji: true
    - msgs:
        - [p, "N oublie pas ton rdv demain a {time}"]
        - [o, "Quel rdv"]
        - [p, "Le dentiste !!"]
        - [o, "Ah mince merci"]
    - msgs:
