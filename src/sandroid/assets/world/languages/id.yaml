service_sms:
  courier:
    - "Paket Anda dgn no resi {tracking} sedang dibawa kurir dan akan diantar hari ini."
    - "{courier}: Paket {tracking} telah diterima oleh YBS pada {date} {time}."
    - "Pesanan Anda dari {shop} telah dikirim. No resi: {tracking}"
    - "Kurir kami gagal mengantar paket {tracking}. Pengiriman ulang dijadwalkan {date}."
    - "Paket {tracking} sudah tiba di gudang {city} dan akan segera diantar."
  bank:
    - "JANGAN BERIKAN KODE INI KEPADA SIAPAPUN termasuk pihak bank. Kode OTP Anda: {digits:6}. Berlaku 3 menit."
    - "{bank}: Transfer {amount} ke {first} {last} BERHASIL pada {date} {time}. Ref {digits:12}."
    - "{bank}: Dana masuk {amount} dari {first} {last} pada {date}. Saldo: {balance}"
    - "Transaksi kartu debit {digits:4} sebesar {amount} di {shop} pada {date} {time}."
    - "Hati-hati penipuan! {bank} tidak pernah meminta PIN, OTP, atau password melalui telepon/SMS."
    - "{bank}: Tagihan kartu kredit Anda {amount} jatuh tempo {date}. Pembayaran minimum {balance}."
  telecom:
    - "Isi ulang pulsa {amount} berhasil. Sisa pulsa {balance}. Masa aktif s.d. {date}."
    - "Sisa kuota internet Anda tinggal 500MB. Beli paket di *{digits:3}# sekarang!"
    - "Paket internet 30GB 30 hari Anda aktif s.d. {date}. Cek kuota di *{digits:3}#"
    - "Promo spesial! Kuota 25GB cuma {amount}. Tekan *{digits:3}*{digits:2}# sekarang. S&K berlaku."
    - "Masa aktif kartu Anda akan berakhir {date}. Segera isi ulang agar nomor tetap aktif."
    - "Selamat! Anda mendapat bonus kuota 2GB berlaku 3 hari."
  otp_service:
    - "{digits:6} adalah kode verifikasi Anda. Jangan berikan kode ini kepada siapa pun."
    - "<#> Kode OTP Anda: {digits:6}. {code}"
    - "Kode verifikasi: {digits:4}. Berlaku 5 menit. JANGAN BAGIKAN kode ini."
    - "Gunakan kode {digits:6} untuk masuk ke akun Anda."
    - "RAHASIA! Kode verifikasi Anda {digits:6}. Waspada penipuan."
  doctor:
    - "Pengingat: Jadwal kontrol Anda di poli pada {date} pukul {time}. No antrean {digits:2}."
    - "Pendaftaran berhasil. Silakan datang 30 menit sebelum jadwal {time}."
    - "Hasil lab Anda sudah dapat diambil. Kode {code}."
    - "Mohon puasa 10 jam sebelum pemeriksaan pada {date}."
    - "Jadwal dokter pada {date} dibatalkan. Silakan daftar ulang."
  pharmacy:
    - "Pesanan obat #{digits:8} dikonfirmasi. Estimasi tiba {date}. Total {amount}."
    - "Pesanan Anda sedang dikirim oleh kurir."
    - "Waktunya tebus resep bulanan Anda. Pesan sekarang, gratis ongkir!"
    - "Resep Anda untuk pesanan {code} sudah diverifikasi apoteker."
    - "Pesanan {code} telah diterima. Terima kasih."
  delivery_food:
    - "Pesanan Anda dari {shop} sedang diantar. Driver {first} tiba dlm {digits:2} menit."
    - "Pesanan #{digits:6} dikonfirmasi. Total {amount}."
    - "Pesanan sudah sampai. Selamat menikmati!"
    - "Lapar? Diskon 50% di {shop} khusus hari ini!"
    - "Driver sudah sampai di lokasi Anda."
  ride_hailing:
    - "Driver {first} menuju lokasi jemput. Plat {code}. Tiba 3 menit."
    - "Driver sudah tiba di titik jemput."
    - "Perjalanan selesai. Tarif {amount}. Terima kasih!"
    - "Kode PIN perjalanan Anda: {digits:4}"
    - "Pesanan ojek Anda dibatalkan oleh driver. Sedang mencari driver lain."
  airline:
    - "Check-in online untuk penerbangan ke {city} {date} sudah dibuka. Kode booking {code}."
    - "Penerbangan Anda ke {city} boarding pukul {time} di gate {digits:1}."
    - "Mohon maaf, penerbangan Anda ke {city} mengalami keterlambatan. Jadwal baru {time}."
    - "Pemesanan berhasil. Kode booking {code}. Berangkat {date} {time}."
    - "E-boarding pass Anda telah dikirim ke email."
  rail:
    - "Kode booking {code}. KA tujuan {city} {date} {time}. Kereta {digits:1} kursi {digits:1}A. Tunjukkan KTP saat boarding."
    - "Pemesanan tiket kereta berhasil. Kode booking {code}. Total {amount}."
    - "Pengingat: kereta Anda ke {city} berangkat besok pukul {time}."
    - "Pembatalan tiket {code} berhasil. Pengembalian dana {amount} diproses 30 hari."
    - "Mohon maaf, KA tujuan {city} terlambat sekitar {digits:2} menit."
  government:
