# Bahasa Indonesia language pack. Personal texts use everyday chat Indonesian
# (gak/ga, udh, blm, aja, bgt, wkwk, otw, gpp, mksh) with some Jakarta slang;
# service SMS use the formal register real Indonesian senders use.
# `emoji: true` marks threads/entries containing emoji.
# Proposed (not yet in schema v1): service kinds `mobile_money`, `loan`,
# placeholders `{balance}`, `{fee}`, list values in `call_names`. See SOURCES.md.
pack: language
schema: 1
lang: id
name: Bahasa Indonesia
