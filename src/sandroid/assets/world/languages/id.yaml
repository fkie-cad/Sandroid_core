    - "Dokumen Anda sudah dapat diambil di kantor {city}."
    - "Batas lapor SPT Tahunan {date}. Segera laporkan secara online."
    - "Kode verifikasi akun Anda: {digits:6}. Jangan berikan kepada siapapun."
    - "Pajak kendaraan Anda jatuh tempo {date}. Bayar online agar tidak kena denda."
  retail:
    - "Terima kasih telah berbelanja di {shop}. Anda mendapat {digits:3} poin."
    - "PROMO GAJIAN! Diskon s.d. 70% di {shop}. Berlaku s.d. {date}."
    - "Pesanan {code} sudah dikirim."
    - "Pengembalian dana {amount} untuk pesanan {code} berhasil."
    - "Flash sale jam 12.12 nanti! Cek di {shop}."
  utility:
    - "Token listrik: {digits:4}-{digits:4}-{digits:4}-{digits:4}-{digits:4}. {digits:2},{digits:1} kWh. Total {amount}."
    - "Tagihan listrik bulan ini {amount}. Jatuh tempo {date}."
    - "Pemberitahuan pemadaman listrik {date} pukul {time} karena pemeliharaan jaringan."
    - "Tagihan air {amount} jatuh tempo {date}. No pelanggan {digits:8}."
    - "Pembayaran {amount} berhasil. Ref {code}."
  mobile_money:
    - "Kamu menerima {amount} dari {first} {last}. Saldo: {balance}. ID transaksi {digits:12}."
    - "Transfer {amount} ke {first} {last} berhasil. Biaya admin {fee}. Saldo {balance}."
    - "Pembayaran {amount} ke {shop} berhasil. Saldo {balance}."
    - "Top up {amount} berhasil. Saldo kamu sekarang {balance}."
    - "Pembayaran QRIS {amount} di {shop} berhasil. Ref {digits:12}."
  loan:
    - "Tagihan Anda sebesar {amount} jatuh tempo {date}. Bayar tepat waktu untuk menjaga skor kredit."
    - "Pinjaman {amount} telah dicairkan ke rekening Anda."
    - "Tagihan Anda telah melewati jatuh tempo. Segera bayar {amount} untuk menghindari denda."
    - "Terima kasih, pembayaran cicilan {amount} sudah kami terima. Sisa tagihan {balance}."
    - "Limit pinjaman Anda naik menjadi {amount}. Ajukan sekarang!"
