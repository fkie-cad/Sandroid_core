    - "Farmacia: su pedido {code} puede recogerse hoy hasta las 21:00."
    - "Hemos recibido su receta. Le avisaremos cuando este todo disponible."
  delivery_food:
    - "Tu pedido en {shop} ha sido confirmado. Entrega estimada: {time}."
    - "Tu comida va en camino! El repartidor llegara en unos 10 minutos."
    - "Tu repartidor esta en la puerta. Buen provecho!"
    - "Tu pedido en {shop} se retrasara unos 15 minutos. Disculpa las molestias."
    - "Pedido {code} cancelado. Te reembolsaremos {amount}."
  ride_hailing:
    - "Su conductor esta en camino y llegara en unos 4 minutos."
    - "Su conductor ha llegado. Matricula: {code}"
    - "Codigo de su viaje: {digits:4}. Compartalo solo con su conductor."
    - "Gracias por viajar con nosotros. Total: {amount}. Recibo en la app."
    - "Su viaje para las {time} esta reservado. Recogida en {place}."
  airline:
    - "Ya puede hacer el check-in para su vuelo {code} del {date}."
    - "Cambio de puerta para el vuelo {code}: nueva puerta B{digits:2}."
    - "Su vuelo {code} sale con retraso. Nueva hora de salida: {time}."
    - "El embarque del vuelo {code} comienza a las {time}. Dirijase a la puerta."
    - "Reserva {code} confirmada: {city}, {date}. Buen viaje!"
  rail:
    - "Su billete para el {date} a {city}: localizador {code}."
    - "Su tren a {city} circula hoy con unos 15 minutos de retraso."
    - "Cambio de via: su tren a {city} sale hoy por la via {digits:1}."
    - "Su plaza: coche {digits:2}, asiento {digits:2}. Buen viaje!"
    - "Su tren de las {time} a {city} ha sido cancelado. Consulte alternativas en la web."
  government:
    - "Cita confirmada el {date} a las {time}. Numero de tramite: {code}."
    - "Recordatorio: su cita en la oficina de atencion ciudadana es mañana a las {time}."
    - "Su documento de identidad ya esta listo para recoger."
    - "Hemos recibido su solicitud {code}. Le informaremos de su estado."
    - "Su pasaporte esta disponible. Acuda con el resguardo y el pasaporte anterior."
  retail:
    - "Su pedido {code} de {shop} ha sido enviado."
    - "{shop}: su pedido esta listo para recoger en tienda. Codigo {digits:6}"
    - "Solo hoy: 20% en toda la tienda en {shop}. Baja: envie BAJA al 12345"
    - "Hemos recibido su devolucion. El reembolso de {amount} se hara en 3-5 dias."
    - "{shop}: su cupon de descuento para la proxima compra: {code}"
  utility:
    - "Su factura de luz de {amount} se cargara en su cuenta el {date}."
    - "Por favor, envienos la lectura de su contador antes del {date}."
    - "Corte de suministro programado el {date} de 9:00 a 13:00. Disculpe las molestias."
    - "Ya esta disponible su factura de gas. Importe: {amount}."
    - "Cita para cambio de contador: {date} entre las 8:00 y las 12:00."

