# Language pack: Spanish (es). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see es.SOURCES.md.
# Conventions: friends/family/partner/neighbours use "tú"; services use "usted" or impersonal forms.
# Pan-Hispanic: some threads lean Spain (vale, quedamos, finde), others Latin America (tqm, ahorita, celu).
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1.1
lang: es
name: Español

threads:
  family:
    - msgs:
        - [p, "Hijo vienes a comer el domingo?"]
        - [o, "Si mama, llego como a las 2"]
        - [p, "Trae a {partner_first} q hace mucho q no la veo"]
        - [o, "Vale se lo digo"]
    - msgs:
        - [p, "Ya llegaste?"]
        - [o, "Si ya estoy en casa"]
        - [p, "Ok descansa, tqm ❤️"]
      emoji: true
    - msgs:
        - [p, "Me puedes ayudar con el celu? No me salen los mensajes"]
        - [o, "Que te sale exactamente"]
        - [p, "Nada, se queda en blanco"]
        - [o, "Apagalo y prendelo. Si no te llamo en la noche"]
        - [p, "Ok gracias mijo"]
    - msgs:
        - [p, "El cumple de tu papa es el {day}, ya le compraste algo?"]
        - [o, "Todavia no 😬"]
        - [p, "Ay hijo siempre a ultima hora"]
        - [o, "Jajaja este finde lo compro lo prometo"]
      emoji: true
    - msgs:
        - [p, "Te mandé {amount} para lo del viaje"]
        - [o, "Gracias ma no hacia falta"]
        - [p, "Si hacia falta, disfrutalo"]
    - msgs:
        - [p, "La abuela pregunta si vienes en navidad"]
        - [o, "Claro q si, ya tengo el billete"]
        - [p, "Que bien!! Se va a poner feliz 😊"]
      emoji: true
    - msgs:
        - [p, "Estamos en el super, necesitas algo?"]
        - [o, "Pan y leche si pueden"]
        - [p, "Ok"]
    - msgs:
        - [p, "Llego el {date} a {city}, me recoges?"]
        - [o, "Claro, a q hora llega el bus"]
        - [p, "A las {time} creo"]
        - [o, "Perfecto ahi estoy"]
    - msgs:
        - [p, "Feliz cumpleaños hermanita!!! 🎉🎂 te quiero mucho"]
        - [o, "Graciaaas 🥹❤️"]
      emoji: true
    - msgs:
        - [p, "Me pasas la receta del flan de la abuela?"]
        - [o, "Te la mando en un rato, la tengo en una foto"]
        - [p, "Dale gracias"]
    - msgs:
        - [p, "Llamame cuando puedas, nada grave"]
        - [o, "Ok en 10 min"]

  partner:
    - msgs:
        - [p, "Compro algo de camino?"]
        - [o, "Tomates y pan porfa"]
        - [p, "Ok 👍"]
      emoji: true
    - msgs:
        - [o, "Salgo tarde hoy, la reunion se alargo"]
        - [p, "Noo 😩 a q hora mas o menos"]
        - [o, "Como a las {time}"]
        - [p, "Ok te guardo cena"]
        - [o, "Eres la mejor ❤️"]
      emoji: true
    - msgs:
        - [p, "Ya voy saliendo"]
        - [o, "Ok"]
    - msgs:
        - [p, "Tienes las llaves??"]
        - [o, "No, se quedaron en la mesa"]
        - [p, "Pff"]
        - [p, "Ya las encontre estaban en mi bolso jajaja"]
    - msgs:
        - [o, "Te extraño"]
        - [p, "Yo mas 🥺 ya quiero q sea viernes"]
        - [o, "Falta poquito"]
      emoji: true
    - msgs:
        - [p, "Que cenamos?"]
        - [o, "Pedimos algo?"]
        - [p, "Otra vez jajaja"]
        - [o, "Vale vale, hago pasta"]
    - msgs:
        - [p, "Recuerda q mañana tenemos dentista a las {time}"]
        - [o, "Uff se me habia olvidado, gracias amor"]
    - msgs:
        - [o, "Vamos al cine el sabado?"]
        - [p, "Siii cual peli"]
        - [o, "Tu eliges"]
        - [p, "Ok luego te paso opciones 😘"]
      emoji: true
    - msgs:
        - [p, "Llegaste bien?"]
        - [o, "Si amor, el tren llego con 20 min de retraso pero bien"]
        - [p, "Ok descansa"]
    - msgs:
        - [p, "Puedes recoger el paquete de {courier}? yo no llego hoy"]
        - [o, "Si yo paso"]
        - [p, "Gracias 😘"]
      emoji: true
    - msgs:
        - [o, "Buenas noches amor"]
        - [p, "Buenas noches, tqm"]

  friend:
    - msgs:
        - [p, "Holaaa q tal? Hace mil q no hablamos"]
        - [o, "Bien y tu? Mucho trabajo jaja"]
        - [p, "Igual. Quedamos un dia de estos?"]
        - [o, "Si porfa. El jueves?"]
        - [p, "Jueves me va bien"]
        - [o, "Pues hecho"]
    - msgs:
        - [p, "Esta noche salimos?"]
        - [o, "A donde"]
        - [p, "{place}, a partir de las {time}"]
        - [o, "Voy! 🍻"]
      emoji: true
    - msgs:
        - [p, "Feliz cumple!!! 🥳🎉 q lo pases genial"]
        - [o, "Muchas gracias guapa 😘"]
      emoji: true
    - msgs:
        - [p, "Me pasas las fotos del sabado?"]
        - [o, "Si ahorita te las mando"]
        - [p, "Grax!"]
    - msgs:
        - [p, "Perdon voy tarde, 15 min"]
        - [o, "Ntp"]
        - [p, "Pideme un cafe porfa"]
    - msgs:
        - [o, "Oye tienes mi cargador?"]
        - [p, "Ay si perdon 🙈 te lo llevo mañana"]
      emoji: true
    - msgs:
        - [p, "Quien va el {day}?"]
        - [o, "Yo, Laura y quiza Diego"]
        - [p, "Vale yo llevo algo de picar"]
        - [o, "Genial"]
    - msgs:
        - [p, "Viste el partido ayer??"]
        - [o, "Siii q nervios"]
        - [p, "El proximo lo vemos juntos"]
        - [o, "Obvio"]
    - msgs:
        - [p, "Conoces algun dentista bueno en {city}?"]
        - [o, "Yo voy a una en el centro, te paso el numero"]
        - [p, "Gracias!!"]
    - msgs:
        - [o, "Correr mañana temprano?"]
        - [p, "A q hora"]
        - [o, "7 en {place}"]
        - [p, "Uff ok pero solo 5k jaja"]
    - msgs:
        - [p, "Ya llegue a casa, gracias por la noche, me rei muchisimo"]
        - [o, "Igual!! Hay q repetir 😂"]
      emoji: true
    - msgs:
        - [p, "bss"]
        - [o, "besooos 😘"]
      emoji: true

  colleague:
    - msgs:
        - [p, "Hola {owner_first}, estas hoy en la oficina?"]
        - [o, "Hola, no, hoy trabajo desde casa"]
        - [p, "Ok, te mando los documentos por correo"]
        - [o, "Gracias"]
    - msgs:
        - [p, "La reunion de las {time} se pasa a mañana"]
        - [o, "Ok gracias por avisar"]
    - msgs:
        - [p, "Estoy enfermo, puedes avisar al equipo q hoy no voy?"]
        - [o, "Claro, mejorate!"]
    - msgs:
        - [p, "Comemos?"]
        - [o, "Si, 13:30 abajo?"]
        - [p, "👍"]
      emoji: true
    - msgs:
        - [o, "Hay mucho trafico, llego unos 15 min tarde"]
        - [p, "Tranqui, empezamos sin ti"]
    - msgs:
        - [p, "Me puedes pasar la presentacion de ayer?"]
        - [o, "Esta en la carpeta compartida, en Proyectos"]
        - [p, "Ya la vi, gracias"]
    - msgs:
        - [p, "Te acuerdas q la entrega es el {day}?"]
        - [o, "Si, ya casi la tengo"]
    - msgs:
        - [p, "Estamos juntando para el regalo de Marta, te apuntas?"]
        - [o, "Claro, cuanto es?"]
        - [p, "10 cada uno"]
        - [o, "Ok mañana te lo doy"]
    - msgs:
        - [p, "Felices vacaciones! Disfruta 🌴☀️"]
        - [o, "Gracias! Nos vemos en dos semanas"]
      emoji: true
    - msgs:
        - [p, "Sabes si mañana cierran el estacionamiento?"]
        - [o, "Si, por obras. Mejor ven en metro"]
        - [p, "Ok gracias"]

  neighbor:
    - msgs:
        - [p, "Hola, soy {first} del 3B. Tengo un paquete suyo"]
        - [o, "Muchas gracias! Paso esta tarde a recogerlo"]
    - msgs:
        - [p, "Hola! Nos vamos el finde, podrias regar las plantas?"]
        - [o, "Claro, sin problema. Las llaves como siempre?"]
        - [p, "Si, mil gracias 🙏"]
      emoji: true
    - msgs:
        - [p, "Aviso: el {day} cortan el agua de 9 a 13 por la obra"]
        - [o, "Gracias por avisar"]
    - msgs:
        - [p, "Dejaste las luces del carro prendidas 😉"]
        - [o, "Ay gracias!! Ya bajo"]
      emoji: true
    - msgs:
        - [p, "El sabado hacemos una cenita en la terraza, puede q haya algo de ruido. Estan invitados!"]
        - [o, "Gracias! Igual nos pasamos un rato"]
    - msgs:
        - [o, "Hola, a ustedes tambien les va mal el internet?"]
        - [p, "Si, desde esta mañana. Ya llame a la compañia"]
        - [o, "Ok gracias"]
    - msgs:
        - [p, "De casualidad tienes un taladro q me prestes?"]
        - [o, "Si, pasa cuando quieras"]
        - [p, "Genial, voy en 5"]
    - msgs:
        - [p, "Recuerden q mañana es la reunion de vecinos a las {time} en el portal"]
        - [o, "Ok alli estaremos"]
    - msgs:
        - [p, "Buenas, su gato esta otra vez en nuestro balcon 😄"]
        - [o, "Ay no 🙈 ya voy por el"]
      emoji: true
    - msgs:
        - [p, "Hola! Hicimos galletas de mas, les dejo unas en la puerta 🍪"]
        - [o, "Que detalle, muchas gracias!!"]
      emoji: true

service_sms:
