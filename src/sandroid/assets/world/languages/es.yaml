    - "Le recordamos su cita de mañana a las {time}. Traiga su tarjeta sanitaria."
    - "Su cita del {date} ha sido cancelada. Llamenos para reprogramarla."
    - "Sus resultados ya estan disponibles. Solicite cita para revisarlos."
  pharmacy:
    - "Su pedido ya esta disponible en la farmacia a partir de las {time}."
    - "Su receta esta lista para recoger. Codigo de recogida: {code}"
