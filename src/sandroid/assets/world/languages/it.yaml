# Language pack: Italian (it). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see it.SOURCES.md.
# Conventions: friends/family/partner/neighbours use "tu"; services use "Lei"
# or impersonal forms (app OTPs sometimes "tu", as in real Italian SMS).
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1.1
lang: it
name: Italiano

threads:
  family:
    - msgs:
        - [p, "Domenica vieni a pranzo?"]
        - [o, "Si verso l una"]
        - [p, "Porta anche {partner_first} che faccio le lasagne"]
        - [o, "Ok glielo dico"]
    - msgs:
        - [p, "Sei arrivato a casa?"]
        - [o, "Si tutto ok"]
        - [p, "Bene. Buonanotte tesoro 😘"]
      emoji: true
    - msgs:
        - [p, "Ti ricordi che {day} e il compleanno di papà?"]
        - [o, "Si mamma 🙄"]
        - [o, "Il regalo ce l ho già"]
        - [p, "Cosa gli hai preso?"]
        - [o, "Sorpresa 😁"]
      emoji: true
    - msgs:
        - [p, "Quando puoi chiamami"]
        - [o, "E successo qualcosa?"]
        - [p, "No no tutto bene, e per organizzare Natale"]
        - [o, "Ok ti chiamo stasera"]
    - msgs:
        - [p, "Il modem non va più, come si fa a riavviarlo?"]
        - [o, "Staccalo dalla corrente 30 secondi e riattaccalo"]
        - [p, "Fatto ma niente"]
        - [o, "Va bene passo sabato e guardo"]
        - [p, "Grazie amore di mamma"]
    - msgs:
        - [p, "La nonna chiede se passi {day} per un caffè"]
        - [o, "Si verso le 4, salutamela"]
    - msgs:
        - [p, "Il {date} sono a {city}, sei libero la sera?"]
        - [o, "Certo! A che ora arriva il treno"]
        - [p, "Verso le {time}"]
        - [o, "Ti vengo a prendere in stazione 👍"]
      emoji: true
    - msgs:
        - [p, "Ti ho fatto un bonifico di {amount} per i biglietti"]
        - [o, "Grz ma non dovevi"]
        - [p, "Figurati"]
    - msgs:
        - [p, "L arrosto e nel forno, a che ora arrivate?"]
        - [o, "Siamo in coda in autostrada, mezz ora di ritardo"]
        - [p, "Tranquilli andate piano"]
    - msgs:
        - [p, "Buona Pasqua a tutti 🐣🕊️"]
        - [o, "Grazie anche a voi! Un bacio a tutti"]
      emoji: true
    - msgs:
        - [p, "Hai chiamato il commercialista per il 730?"]
        - [o, "Non ancora"]
        - [p, "Fallo questa settimana che poi e tardi"]
        - [o, "Si si lo chiamo domani"]

  partner:
    - msgs:
        - [p, "Prendo qualcosa tornando?"]
        - [o, "Latte e pane grz"]
        - [p, "Ok 👍"]
      emoji: true
    - msgs:
        - [p, "Arrivo tra 10 min"]
        - [o, "Ok"]
    - msgs:
        - [o, "Faccio tardi, la riunione non finisce più"]
        - [p, "Uffa 😕 tipo a che ora?"]
        - [o, "Verso le {time}"]
        - [p, "Va bene allora mangio, ti lascio un piatto"]
        - [o, "Grazie amo ❤️"]
      emoji: true
    - msgs:
        - [p, "Hai le chiavi?"]
        - [o, "No sono sul mobile all ingresso"]
        - [p, "Perfetto..."]
        - [p, "Trovate erano nella giacca 🙈"]
      emoji: true
    - msgs:
        - [p, "Ricordati domani alle {time}"]
        - [o, "Cosa"]
        - [p, "Il dentista!!"]
        - [o, "Ah cavolo grazie"]
    - msgs:
        - [o, "Cinema stasera?"]
        - [p, "Sii che film"]
        - [o, "Scegli tu"]
        - [p, "Ok guardo gli orari"]
    - msgs:
        - [p, "Mi manchi 💕"]
        - [o, "Anche tu. Ancora 2 giorni"]
        - [p, "Troppi"]
        - [o, "Tvb"]
        - [p, "Tvtb"]
      emoji: true
    - msgs:
        - [p, "Riesci a ritirare il pacco dalla vicina? Oggi io non ce la faccio"]
        - [o, "Si tranqui"]
    - msgs:
        - [o, "Arrivata?"]
        - [p, "Si, il treno aveva solo 20 min di ritardo ahahah"]
        - [o, "Quasi puntuale 😄"]
      emoji: true
    - msgs:
        - [p, "Cosa mangiamo stasera"]
        - [o, "Pizza?"]
        - [p, "Di nuovo 😂"]
        - [o, "Ok ok faccio una pasta"]
      emoji: true
    - msgs:
        - [p, "Notte amore"]
        - [o, "Notte 😘 un bacio"]
      emoji: true

  friend:
    - msgs:
        - [p, "Ehi come stai? Era un sacco che non ci sentivamo"]
        - [o, "Ciaoo! Bene tu? Periodo pieno"]
        - [p, "Anche io. Dobbiamo vederci"]
        - [o, "Assolutamente, settimana prossima?"]
        - [p, "Giovedì o venerdì per me va bene"]
        - [o, "Venerdì perfetto"]
    - msgs:
        - [p, "Stasera ci sei?"]
        - [o, "Dove si va"]
        - [p, "{place}, dalle {time}"]
        - [o, "Ci sono 🍻"]
      emoji: true
    - msgs:
        - [p, "Tanti auguri!!! 🎉🎂 Goditi la giornata"]
        - [o, "Grazieee 🥰"]
      emoji: true
    - msgs:
        - [p, "Mi mandi le foto di sabato?"]
        - [o, "Si stasera te le giro"]
        - [p, "Grz sei un tesoro"]
    - msgs:
        - [p, "Scusa sono in ritardo 15 min"]
        - [o, "Tranqui"]
        - [p, "Ordinami un caffè intanto"]
    - msgs:
        - [o, "Ce l hai ancora il mio caricatore?"]
        - [p, "Ah si scusa 😅 te lo riporto"]
      emoji: true
    - msgs:
        - [p, "Raga chi viene {day} sera?"]
        - [o, "Io, Giulia e forse Marco"]
        - [p, "Ok porto il dolce"]
        - [o, "Top"]
    - msgs:
        - [p, "Hai visto la partita ieri?? Nn ci credo ancora"]
        - [o, "Lascia stare ero nero"]
        - [p, "La prossima la guardiamo insieme cmq"]
    - msgs:
        - [p, "Domanda veloce: conosci un buon meccanico a {city}?"]
        - [o, "Si il mio e bravissimo, ti mando il numero"]
        - [p, "Grazie mille!"]
    - msgs:
        - [o, "Corsa domattina?"]
        - [p, "A che ora"]
        - [o, "Alle 7 al {place}"]
        - [p, "Mamma mia ok ma max 5 km"]
    - msgs:
        - [p, "Arrivata a casa, grazie per la serata"]
        - [o, "Ma figurati e stato bellissimo 😂 ahahah"]
      emoji: true
    - msgs:
        - [p, "Xké nn rispondi?"]
        - [o, "Scusa ero in palestra, dimmi"]
        - [p, "Niente volevo sapere se domani c e la cena"]
        - [o, "Si si alle 8 tt ok"]

  colleague:
    - msgs:
        - [p, "Ciao {owner_first}, oggi sei in ufficio?"]
        - [o, "Ciao, no oggi lavoro da casa"]
        - [p, "Ok allora ti mando i documenti per mail"]
        - [o, "Grazie"]
    - msgs:
        - [p, "La riunione delle {time} e spostata a domani"]
        - [o, "Ok grazie dell avviso"]
    - msgs:
        - [p, "Sto male, puoi avvisare il team per favore?"]
        - [o, "Certo, riguardati!"]
        - [p, "Grazie"]
    - msgs:
        - [p, "Pranzo insieme?"]
        - [o, "Si, 12:30 giù?"]
        - [p, "👍"]
      emoji: true
    - msgs:
        - [o, "Sono nel traffico, arrivo con 15 min di ritardo"]
        - [p, "Nessun problema iniziamo noi"]
    - msgs:
        - [p, "Mi rimandi la presentazione di ieri?"]
        - [o, "E nella cartella condivisa, Progetti"]
        - [p, "Trovata, grazie!"]
    - msgs:
        - [p, "Ti ricordi la consegna di {day}?"]
        - [o, "Si ho quasi finito"]
    - msgs:
        - [p, "Facciamo una colletta per il regalo di Francesca, ci sei? 10 euro"]
        - [o, "Certo te li do domani"]
    - msgs:
        - [p, "Buone ferie! Goditele 🌴"]
        - [o, "Grazie! Ci vediamo tra 2 settimane"]
      emoji: true
    - msgs:
        - [p, "Sai se domani il parcheggio e chiuso?"]
        - [o, "Si per lavori, meglio prendere i mezzi"]
        - [p, "Ok grazie"]
    - msgs:
        - [p, "Il cliente ha approvato il preventivo 🎉"]
        - [o, "Grande! Ottimo lavoro"]
      emoji: true

  neighbor:
    - msgs:
        - [p, "Buongiorno, sono {first} della porta accanto. Ho ritirato un pacco per Lei"]
        - [o, "Grazie mille! Passo stasera a prenderlo"]
    - msgs:
        - [p, "Ciao, potresti bagnarci le piante nel weekend? Siamo via"]
        - [o, "Certo nessun problema. Chiavi come al solito?"]
        - [p, "Si grazie mille 🙏"]
      emoji: true
    - msgs:
        - [p, "Vi ricordo che {day} c e la riunione di condominio alle {time}"]
        - [o, "Grazie per l avviso"]
    - msgs:
        - [p, "Avete lasciato i fari della macchina accesi 😉"]
        - [o, "Oddio grazie!! Scendo subito"]
      emoji: true
    - msgs:
        - [p, "Sabato facciamo una piccola festa in giardino, magari un po di rumore. Siete invitati"]
        - [o, "Grazie, magari passiamo un attimo"]
    - msgs:
        - [o, "Buonasera, anche da voi manca l acqua calda?"]
        - [p, "Si anche da noi. L amministratore e già avvisato"]
        - [o, "Ok grazie"]
    - msgs:
        - [p, "Per caso hai un trapano da prestarmi?"]
        - [o, "Si vieni pure"]
        - [p, "Grande, passo tra 5 min"]
    - msgs:
        - [p, "Stasera si mette fuori la plastica, passano domattina"]
        - [o, "Grazie la porto giù"]
    - msgs:
        - [p, "Buonasera, il vostro gatto e di nuovo sul nostro balcone 😄"]
        - [o, "Oh no 🙈 arrivo"]
      emoji: true
    - msgs:
        - [p, "Domani mattina viene il tecnico della caldaia condominiale, potrebbe mancare il gas fino a mezzogiorno"]
        - [o, "Ok grazie per l info"]

