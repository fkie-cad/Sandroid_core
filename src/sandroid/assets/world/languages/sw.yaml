service_sms:
  courier:
    - "Kifurushi chako {tracking} kiko njiani na kitafikishwa leo."
    - "{courier}: Kifurushi {tracking} kimefika {city}. Kichukue ndani ya siku 5 kwa nambari {digits:6}."
    - "Agizo lako kutoka {shop} limetumwa. Nambari ya ufuatiliaji: {tracking}"
    - "Hatukuweza kuwasilisha kifurushi {tracking}. Tutajaribu tena tarehe {date}."
    - "Your parcel {tracking} has been delivered. Thank you for using {courier}."
  bank:
    - "{bank}: Nambari yako ya siri ya mara moja (OTP) ni {digits:6}. Usimpe mtu yeyote."
    - "{bank}: Akaunti yako ****{digits:4} imetolewa {amount} tarehe {date}. Salio: {balance}."
    - "{bank}: Akaunti yako ****{digits:4} imepokea {amount} kutoka {first} {last}. Salio: {balance}."
    - "Dear Customer, your account ****{digits:4} has been debited with {amount} on {date}. Avail bal: {balance}."
    - "{bank} haitakuuliza PIN au OTP yako kwa simu. Jihadhari na matapeli."
  telecom:
    - "Umenunua bundle ya 1GB kwa {amount}. Inaisha {date} saa {time}."
    - "Salio lako la muda wa maongezi ni {balance}."
    - "Umepokea muda wa maongezi wa {amount} kutoka kwa {first} {last}."
    - "Umekopa {amount}. Itakatwa utakapoweka salio, pamoja na ada ya {fee}."
    - "Ofa! Pata 10GB kwa {amount} kwa siku 30. Piga *{digits:3}# sasa."
    - "Bundle yako ya data imebaki 100MB. Nunua zaidi kupitia *{digits:3}#."
  otp_service:
    - "{digits:6} ni nambari yako ya uthibitisho. Usimpe mtu yeyote."
    - "<#> Your code is {digits:6}. {code}"
    - "Nambari yako ya kuthibitisha ni {digits:4}. Itaisha baada ya dakika 5."
    - "Use {digits:6} to verify your phone number."
    - "Tumia {digits:6} kuingia kwenye akaunti yako."
  doctor:
    - "Ukumbusho: miadi yako na daktari ni tarehe {date} saa {time}."
    - "Your appointment is confirmed for {date} at {time}. Please arrive 15 minutes early."
    - "Majibu ya vipimo vyako yako tayari. Tafadhali fika kliniki."
    - "Tafadhali usile chochote saa 8 kabla ya kipimo tarehe {date}."
    - "Miadi yako ya {date} imeahirishwa. Piga simu kupanga upya."
  pharmacy:
    - "Agizo lako la dawa #{digits:7} limethibitishwa. Jumla {amount}."
    - "Dawa zako zimetumwa na zitafika leo."
    - "Ukumbusho: ni wakati wa kujaza tena dawa zako za kila mwezi."
    - "Your prescription order {code} is ready for pickup at {shop}."
    - "Agizo {code} limewasilishwa. Asante."
  delivery_food:
    - "Agizo lako kutoka {shop} liko njiani! Rider {first} atafika baada ya dakika {digits:2}."
    - "Order #{digits:6} confirmed. Total {amount}."
    - "Agizo lako limefika. Furahia mlo wako!"
    - "Njaa? Punguzo la 40% kwa {shop} leo tu!"
    - "Rider amefika, tafadhali chukua agizo lako."
  ride_hailing:
    - "Dereva {first} anakuja. Nambari ya gari {code}. Atafika baada ya dakika 4."
    - "Dereva amefika mahali pa kuchukuliwa."
    - "Safari imekamilika. Nauli {amount}. Asante!"
    - "Your ride code is {digits:4}."
    - "Boda yako imeagizwa. Mpanda {first} anakuja."
  airline:
    - "Check-in ya mtandaoni imefunguliwa kwa safari yako ya {city} tarehe {date}. Booking ref {code}."
    - "Your flight to {city} is now boarding at gate {digits:1}."
    - "Samahani, ndege yako ya {city} imechelewa. Muda mpya wa kuondoka {time}."
    - "Booking confirmed. Ref {code}. Departure {date} {time}."
    - "Boarding pass yako imetumwa kwa barua pepe."
  rail:
    - "Tiketi yako imethibitishwa. Ref {code}. Treni ya {city} {date} saa {time}. Behewa {digits:1} kiti {digits:2}."
    - "Your train ticket {code} is confirmed. Total {amount}."
    - "Ukumbusho: treni yako ya {city} inaondoka kesho saa {time}."
    - "Treni ya {city} imechelewa takriban dakika {digits:2}."
    - "Tiketi {code} imeghairiwa. Marejesho ya {amount} yatashughulikiwa."
  government:
    - "Ombi lako {code} limepokelewa na linashughulikiwa."
    - "Kitambulisho chako kiko tayari kuchukuliwa katika ofisi ya {city}."
    - "Ukumbusho: mwisho wa kuwasilisha ritani ya kodi ni {date}."
    - "Your application {code} has been approved. Visit the {city} office with your ID."
    - "Nambari yako ya uthibitisho ni {digits:6}. Usimpe mtu."
  retail:
    - "Asante kwa kununua {shop}! Umepata pointi {digits:3}."
    - "OFA! Punguzo hadi 50% {shop} hadi {date}."
    - "Agizo lako {code} limetumwa."
    - "Your refund of {amount} for order {code} has been processed."
    - "Black Friday imefika! Tembelea {shop}."
  utility:
    - "Token: {digits:4}-{digits:4}-{digits:4}-{digits:4}-{digits:4}\nUnits: {digits:2}.{digits:1}\nAmt: {amount}\nMtr: {digits:11}"
    - "Bili yako ya maji ni {amount}, mwisho wa kulipa {date}."
    - "Taarifa: umeme utakatwa tarehe {date} kuanzia saa {time} kwa matengenezo."
    - "Malipo ya {amount} yamepokelewa. Ref {code}. Asante."
    - "Your water bill of {amount} is due on {date}. Acc {digits:8}."
  mobile_money:
    - "{code} Imethibitishwa. {amount} imetumwa kwa {first} {last} tarehe {date} saa {time}. Salio lako jipya ni {balance}. Gharama ya kutuma ni {fee}."
    - "{code} Imethibitishwa. Umepokea {amount} kutoka kwa {first} {last} tarehe {date} saa {time}. Salio lako jipya ni {balance}."
    - "{code} Imethibitishwa. {amount} imelipwa kwa {shop} tarehe {date} saa {time}. Salio lako jipya ni {balance}."
    - "{code} Confirmed. You bought {amount} of airtime on {date} at {time}. New balance is {balance}."
    - "{code} Confirmed. {amount} sent to {first} {last} on {date} at {time}. New balance is {balance}. Transaction cost, {fee}."
    - "{code} Imethibitishwa. Umetoa {amount} kwa wakala tarehe {date} saa {time}. Salio lako jipya ni {balance}."
  loan:
    - "Mkopo wako wa {amount} unadaiwa tarehe {date}. Lipa kwa wakati kudumisha kikomo chako."
    - "Hongera! Mkopo wa {amount} umetumwa kwa akaunti yako."
    - "Mkopo wako umepita muda. Tafadhali lipa {amount} leo kuepuka adhabu."
    - "Asante kwa kulipa {amount}. Deni lililobaki ni {balance}."
    - "Unastahili mkopo hadi {amount}. Piga *{digits:3}# kuomba."
