# Swahili language pack. Untagged entries are everyday Swahili usable in Kenya and
# Tanzania; entries tagged `regions: [ke]` use Nairobi Sheng / Kenyan code-switching
# (niaje, poa, maze, form, doh, mbogi, buda, mathe), `regions: [tz]` Tanzanian usage.
# Kenyan service SMS are mostly English; the Swahili variants here mirror the
# Swahili-language setting of mobile money and telecom services.
# `emoji: true` marks threads/entries containing emoji.
# Proposed (not yet in schema v1): `regions` tag, service kinds `mobile_money`, `loan`,
# placeholders `{balance}`, `{fee}`, list values in `call_names`. See SOURCES.md.
pack: language
schema: 1
lang: sw
name: Kiswahili
