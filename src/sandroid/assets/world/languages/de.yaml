  doctor:
    - "Erinnerung: Ihr Termin in der Praxis am {date} um {time}. Bitte bringen Sie Ihre Versichertenkarte mit."
    - "Terminerinnerung: {day}, {date}, {time} Uhr. Absage bitte bis 24h vorher."
    - "Ihr Termin am {date} um {time} wurde bestätigt. Ihre Zahnarztpraxis"
