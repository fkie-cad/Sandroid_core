    - "Erinnerung: Ihr Termin bei der Kfz-Zulassungsstelle am {date} um {time}."
    - "Ihr Antrag {code} ist eingegangen und wird bearbeitet."
    - "Ihr Reisepass ist fertig und kann abgeholt werden. Bitte alten Pass mitbringen."
  retail:
    - "Ihre Bestellung {code} bei {shop} wurde versandt."
    - "{shop}: Ihre Bestellung liegt zur Abholung im Markt bereit. Abholnummer {digits:6}"
    - "Nur heute: 20% auf alles bei {shop}. Abmelden: STOP an 12345"
    - "Ihre Rücksendung bei {shop} ist eingegangen. Die Erstattung über {amount} erfolgt in 3-5 Tagen."
    - "{shop}: Ihr Gutscheincode für den nächsten Einkauf: {code}"
  utility:
    - "Ihr Abschlag über {amount} wird am {date} abgebucht."
    - "Bitte teilen Sie uns Ihren Zählerstand bis {date} mit."
    - "Geplante Versorgungsunterbrechung am {date} von 9 bis 12 Uhr. Wir bitten um Verständnis."
    - "Ihre Jahresabrechnung ist da. Guthaben: {amount}."
    - "Termin Zählerwechsel: {date} zwischen 8 und 12 Uhr."

