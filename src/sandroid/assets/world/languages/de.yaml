    - "{courier}: Ihre Sendung {tracking} ist unterwegs. Voraussichtliche Zustellung: {day}."
    - "Ihr Paket {tracking} wurde in die Packstation gelegt. Abholcode: {digits:6}. Abholung bis {date}."
  bank:
