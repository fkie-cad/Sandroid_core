    - "Ihre Befunde liegen vor. Bitte vereinbaren Sie einen Besprechungstermin."
  pharmacy:
    - "Ihre Bestellung liegt ab {time} zur Abholung bereit. Ihre Apotheke"
    - "Ihr Rezept ist eingelöst. Abholung ab {date} möglich. Abholnummer: {code}"
    - "Ihre vorbestellten Artikel sind eingetroffen und liegen bis {date} für Sie bereit."
    - "Ihr E-Rezept wurde erfolgreich übermittelt. Wir melden uns, sobald alles da ist."
    - "Ihre Apotheke: Ihre Bestellung {code} kann heute bis 18:30 abgeholt werden."
  delivery_food:
    - "Deine Bestellung bei {shop} wurde bestätigt. Lieferung ca. {time}."
    - "Dein Essen ist unterwegs! Der Fahrer ist in ca. 10 Minuten bei dir."
    - "Dein Fahrer ist da. Guten Appetit!"
    - "Leider verspätet sich deine Bestellung bei {shop} um ca. 15 Minuten."
    - "Bestellung {code} wurde storniert. Der Betrag von {amount} wird erstattet."
  ride_hailing:
    - "Ihr Fahrer ist unterwegs und in ca. 4 Minuten da."
    - "Ihr Fahrer ist angekommen. Kennzeichen: {code}"
    - "Ihr Bestätigungscode für die Fahrt: {digits:4}"
    - "Danke für Ihre Fahrt! Betrag: {amount}. Beleg in der App."
    - "Ihre Fahrt für {time} ist reserviert. Abholung: {place}"
  airline:
    - "Ihr Flug {code} am {date} ist zum Check-in bereit. Bordkarte in der App."
