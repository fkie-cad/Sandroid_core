    - "Ihr Flug {code} hat Verspätung. Neue Abflugzeit: {time}."
    - "Boarding für Flug {code} beginnt um {time}. Bitte begeben Sie sich zum Gate."
    - "Buchungsbestätigung {code}: {city}, {date}. Gute Reise!"
  rail:
    - "Ihre Fahrkarte für {date} nach {city}: Auftragsnummer {code}."
    - "Ihr Zug nach {city} hat heute ca. 15 Minuten Verspätung."
    - "Gleiswechsel: Ihr Zug nach {city} fährt heute von Gleis {digits:1}."
    - "Ihre Sitzplatzreservierung: Wagen {digits:2}, Platz {digits:2}. Gute Fahrt!"
    - "Zugausfall: Ihr Zug um {time} nach {city} fällt aus. Alternativen in der App."
  government:
