# Language pack: German (de). Schema v1, see ../PACK_SCHEMA.md.
# All texts authored (AI-written), see de.SOURCES.md.
# Conventions: friends/family/partner/neighbours use "du"; services use "Sie".
# `emoji: true` sits on the thread and means "at least one message in this thread
# contains emoji" (schema v1 has no per-message flag; messages are [speaker, text]).
pack: language
schema: 1.1
lang: de
name: Deutsch

threads:
  family:
    - msgs:
        - [p, "Kommst du Sonntag zum Essen?"]
        - [o, "Ja, gegen 12"]
        - [p, "Super, bring {partner_first} mit"]
    - msgs:
        - [p, "Hast du gut heimgefunden?"]
        - [o, "Ja alles gut, bin grad rein"]
        - [p, "Gut. Schlaf schön 😘"]
      emoji: true
    - msgs:
        - [p, "Papa hat am {day} Geburtstag, denkst du dran??"]
        - [o, "Ja Mama 🙄"]
        - [o, "Hab schon was besorgt"]
        - [p, "Was denn?"]
        - [o, "Verrat ich nicht 😄"]
      emoji: true
    - msgs:
        - [p, "Kannst du mal anrufen wenn du Zeit hast"]
        - [o, "Ist was passiert?"]
        - [p, "Nein nein alles gut. Geht nur um Weihnachten"]
        - [o, "Ok ruf heut abend an"]
    - msgs:
        - [p, "Der Drucker geht wieder nicht. Weißt du wie man den wieder mit dem WLAN verbindet"]
        - [o, "Hast du ihn mal aus und wieder an gemacht?"]
        - [p, "Ja zweimal"]
        - [o, "Ok ich schau es mir am Wochenende an"]
        - [p, "Danke Schatz"]
    - msgs:
        - [p, "Oma fragt ob du am {day} zum Kaffee kommst"]
        - [o, "Ja gerne, sag ihr so um 3. Grüß sie lieb"]
    - msgs:
        - [p, "Bin am {date} in {city}, hast du abends Zeit?"]
        - [o, "Klar! Wann kommt dein Zug an"]
        - [p, "So um {time}"]
        - [o, "Dann hol ich dich ab 👍"]
      emoji: true
    - msgs:
        - [p, "Was wünscht du dir eigentlich zum Geburtstag"]
        - [o, "Keine Ahnung ehrlich gesagt"]
        - [p, "Das sagst du jedes Jahr 😂"]
        - [o, "Vllt n Gutschein? 😅"]
      emoji: true
    - msgs:
        - [p, "Hab dir {amount} überwiesen für die Tickets"]
        - [o, "Danke! Wär nicht nötig gewesen"]
        - [p, "Doch doch"]
    - msgs:
        - [p, "Kuchen ist im Ofen. Wann seid ihr da?"]
        - [o, "Stehen im Stau, ca halbe Stunde später"]
        - [p, "Kein Problem fahrt vorsichtig"]
    - msgs:
        - [p, "Frohe Ostern ihr Lieben 🐣🌷"]
        - [o, "Danke dir auch! Liebe Grüße an alle"]
      emoji: true

  partner:
    - msgs:
        - [p, "Soll ich noch was mitbringen?"]
        - [o, "Milch und Brot bitte"]
        - [p, "Ok 👍"]
      emoji: true
    - msgs:
        - [p, "Bin in 10 min da"]
        - [o, "Ok"]
    - msgs:
        - [o, "Wird heute später, Meeting zieht sich"]
        - [p, "Schade 😕 wie spät ca?"]
        - [o, "So {time}"]
        - [p, "Ok dann ess ich schon mal. Lass dir was übrig"]
        - [o, "Danke ❤️"]
      emoji: true
    - msgs:
        - [p, "Hast du den Schlüssel?"]
        - [o, "Ne der liegt aufm Schrank"]
        - [p, "Na toll"]
        - [p, "Hab ihn, war in meiner Jackentasche 🙈"]
      emoji: true
    - msgs:
        - [p, "Denk an den Termin morgen um {time}"]
        - [o, "Welchen termin"]
        - [p, "Zahnarzt!!"]
        - [o, "Ach shit danke"]
    - msgs:
        - [o, "Lust heute aufs Kino?"]
        - [p, "Jaa welcher Film"]
        - [o, "Egal, such du aus"]
        - [p, "Ok schick dir gleich was"]
    - msgs:
        - [p, "Vermiss dich 💕"]
        - [o, "Ich dich auch. Noch 2 Tage"]
        - [p, "Zu lang"]
      emoji: true
    - msgs:
        - [p, "Kannst du das Paket von {courier} beim Nachbarn abholen? Ich schaff das heute nicht"]
        - [o, "Mach ich"]
    - msgs:
        - [o, "Gut angekommen?"]
        - [p, "Jap, Zug hatte nur 20 min Verspätung lol"]
        - [o, "Ist ja fast pünktlich 😄"]
      emoji: true
    - msgs:
        - [p, "Was essen wir heute"]
        - [o, "Pizza?"]
        - [p, "Schon wieder 😂"]
        - [o, "Ok ok dann Nudeln"]
      emoji: true
    - msgs:
        - [p, "Gute Nacht Schatz"]
        - [o, "Nacht 😘"]
      emoji: true

  friend:
    - msgs:
        - [p, "Hey wie gehts dir? Lange nichts gehört"]
        - [o, "Hey! Gut und dir? Viel los grad"]
        - [p, "Kenn ich. Lass mal wieder treffen"]
        - [o, "Unbedingt! Nächste Woche?"]
        - [p, "Do oder Fr würde gehen"]
        - [o, "Fr passt"]
    - msgs:
        - [p, "Bist du heute abend dabei?"]
        - [o, "Wo gehts hin"]
        - [p, "{place}, ab {time}"]
        - [o, "Bin dabei 🍻"]
      emoji: true
    - msgs:
        - [p, "Alles Gute zum Geburtstag!! 🎉🎂 Lass dich feiern"]
        - [o, "Dankeee 🥰"]
      emoji: true
    - msgs:
        - [p, "hdl"]
        - [o, "hdgdl ❤️"]
      emoji: true
    - msgs:
        - [p, "Kannst du mir die Fotos von Samstag schicken?"]
        - [o, "Klar mach ich heut abend"]
        - [p, "Danke dir"]
    - msgs:
        - [p, "Sorry bin spät dran, 15 min"]
        - [o, "Kein stress"]
        - [p, "Bestell mir schon mal n Kaffee"]
    - msgs:
        - [o, "Hast du noch mein Ladekabel?"]
        - [p, "Oh ja sorry 😅 bring ichs dir mit"]
      emoji: true
    - msgs:
        - [p, "Wer kommt alles am {day}?"]
        - [o, "Ich, Lena und vllt Tim"]
        - [p, "Ok ich bring Salat mit"]
        - [o, "Perfekt"]
    - msgs:
        - [p, "Hab das Spiel gestern gesehen... unfassbar"]
        - [o, "Ja ich war so sauer"]
        - [p, "Nächstes Mal schauen wir zusammen"]
    - msgs:
        - [p, "Kurze Frage: kennst du nen guten Zahnarzt in {city}?"]
        - [o, "Ich geh zu einer in der Innenstadt, schick dir die Nummer"]
        - [p, "Danke!!"]
    - msgs:
        - [o, "Laufen morgen früh?"]
        - [p, "Wann"]
        - [o, "7 am {place}"]
        - [p, "Puh ok aber nur 5km"]
    - msgs:
        - [p, "Bin gut zuhause angekommen, danke für den schönen Abend"]
        - [o, "Gerne war echt lustig 😄"]
      emoji: true

  colleague:
    - msgs:
        - [p, "Hi {owner_first}, bist du heute im Büro?"]
        - [o, "Hi, nein heute Homeoffice"]
        - [p, "Ok, dann schick ich dir die Unterlagen per Mail"]
        - [o, "Danke dir"]
    - msgs:
        - [p, "Das Meeting um {time} ist verschoben auf morgen"]
        - [o, "Ok danke für die Info"]
    - msgs:
        - [p, "Bin krank, kannst du mich bitte im Team entschuldigen?"]
        - [o, "Klar, gute Besserung!"]
        - [p, "Danke"]
    - msgs:
        - [p, "Mittagessen?"]
        - [o, "Gerne, 12:30 unten?"]
        - [p, "👍"]
      emoji: true
    - msgs:
        - [o, "Stehe im Stau, komme ca 15 Min später"]
        - [p, "Kein Problem, wir fangen schon mal an"]
    - msgs:
        - [p, "Kannst du mir kurz die Präsentation von gestern schicken?"]
        - [o, "Ist im gemeinsamen Ordner, Projekt > Präsentationen"]
        - [p, "Gefunden, danke!"]
    - msgs:
        - [p, "Denkst du an die Abgabe am {day}?"]
        - [o, "Ja, bin fast fertig"]
    - msgs:
        - [p, "Wir sammeln für Sabines Abschied, bist du dabei? 10 Euro"]
        - [o, "Klar, geb ich dir morgen"]
    - msgs:
        - [p, "Schönen Urlaub! Genieß es 🌴"]
        - [o, "Danke! Bis in 2 Wochen"]
      emoji: true
    - msgs:
        - [p, "Weißt du ob der Parkplatz morgen gesperrt ist?"]
        - [o, "Ja wegen Bauarbeiten, nimm lieber die Bahn"]
        - [p, "Ok danke"]

  neighbor:
    - msgs:
        - [p, "Hallo, hier ist {first} von nebenan. Ich habe ein Paket für Sie angenommen"]
        - [o, "Vielen Dank! Ich komme heute Abend vorbei"]
    - msgs:
        - [p, "Hi, könntest du am Wochenende unsere Blumen gießen? Wir sind weg"]
        - [o, "Klar, kein Problem. Schlüssel wie immer?"]
        - [p, "Ja, danke dir 🙏"]
      emoji: true
    - msgs:
        - [p, "Kleine Info: am {day} kommt der Schornsteinfeger zwischen 8 und 12"]
        - [o, "Danke für die Info!"]
    - msgs:
        - [p, "Euer Auto steht mit Licht an 😉"]
        - [o, "Oh danke!! Bin gleich unten"]
      emoji: true
    - msgs:
        - [p, "Wir feiern Samstag ein bisschen im Garten, kann etwas lauter werden. Ihr seid herzlich eingeladen"]
        - [o, "Danke, vielleicht schauen wir kurz vorbei"]
    - msgs:
        - [o, "Hallo, hat bei euch auch das Wasser keinen Druck?"]
        - [p, "Ja, bei uns auch. Hausverwaltung weiß Bescheid"]
        - [o, "Ok danke"]
    - msgs:
        - [p, "Hast du zufällig eine Bohrmaschine zum Ausleihen?"]
        - [o, "Ja, kannst du dir holen"]
        - [p, "Super, komm in 5 min rüber"]
    - msgs:
        - [p, "Die Mülltonnen müssen heute raus, Abholung ist morgen früh"]
        - [o, "Danke, mach ich gleich"]
    - msgs:
        - [p, "Guten Abend, Ihre Katze sitzt wieder bei uns auf dem Balkon 😄"]
        - [o, "Oh nein 🙈 ich komme sie holen"]
      emoji: true

service_sms:
  courier:
    - "Ihre Sendung {tracking} wird heute zwischen {time} zugestellt."
    - "{courier}: Ihr Paket {tracking} wurde bei Ihrem Nachbarn abgegeben."
    - "Ihr Paket {tracking} liegt in der Filiale zur Abholung bereit. Abholcode: {code}"
