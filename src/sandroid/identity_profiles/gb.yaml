# Built-in identity profile: United Kingdom (London).
# Read-only, shipped with Sandroid. New profiles start from it (Identity
# lens, P) or extend it (extends: builtin:gb); each one gets its
# own token, seed, GPS fix and world seed (world.seed: auto).
format: sandroid-identity
schema: 2
id: gb
name: United Kingdom (London)
preset: gb
owner: {first: Alex, last: Morgan, phone: '+44212555{digits:4}', email: 'alex.morgan.{token}@example.org'}
values:
  android_id: {derive: ssaid, scope: signer}
  gaid: {derive: uuid}
  app_set_id: {derive: uuid}
  device_name: {template: '{owner.first}s Pixel {token}'}
  phone_number: {template: '{owner.phone}'}
  gps: {value: '51.506007, -0.125489'}
  timezone: {value: Europe/London}
  locale: {value: en-GB}
  sim_operator: {template: 'Carrier {token}'}
  sim_mccmnc: {value: '23410'}
  build_model: {template: 'Pixel 8 {token}', enabled: false}
  imei: {template: '35847631{digits:6}{luhn}'}
  imsi: {template: '23410{digits:10}'}
  iccid: {template: '8949{digits:14}{luhn}'}
  serial: {template: 'RF8N{token}'}
  account: {template: '{owner.email}'}
  clipboard: {template: 'Notiz {token} merken'}
lists:
  contacts:
    - {name: 'Jordan Reed {token}', phone: '+1212555{digits:4}', email: 'jordan.{token}@example.org'}
    - {name: 'Casey Turner {token}', phone: '+1212555{digits:4}', email: 'casey.{token}@example.org'}
    - {name: 'Riley Brooks {token}', phone: '+1212555{digits:4}', email: 'riley.{token}@example.org'}
  sms:
    - {address: '+1212555{digits:4}', body: 'Your parcel {token}{digits:3} arrives today', box: inbox, date: -1d}
    - {address: '+1212555{digits:4}', body: 'Appointment confirmed, code {token}-{digits:4}', box: inbox, date: -2d}
  calls:
    - {number: '+1212555{digits:4}', name: 'Dr. Albers Office {token}', type: incoming, duration: 42, date: -2d}
    - {number: '+1212555{digits:4}', name: 'Courier {token}', type: missed, duration: 43, date: -3d}
world:
  seed: auto
  size: medium
  country: gb
notes: ''
