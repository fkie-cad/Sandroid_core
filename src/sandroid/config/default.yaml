# Sandroid Default Configuration
# This file contains default settings for Sandroid analysis framework
# Copy this file to your config directory and customize as needed

# Core Settings
log_level: INFO
output_file: sandroid.json
environment: production
# whitelist_file: /path/to/whitelist.txt  # Optional: exclude paths from analysis

emulator:
  device_name: Pixel_6_Pro_API_31
  # android_emulator_path: ~/Android/Sdk/emulator/emulator  # Optional: auto-detected if not provided
  # sdk_path: ~/Android/Sdk  # Optional: auto-detected if not provided
  # adb_path: ~/Android/Sdk/platform-tools/adb  # Optional: auto-detected if not provided
  # avd_home: ~/.android/avd  # Optional: auto-detected if not provided
  # selected_avd: sandroid  # Optional: AVD name for Sandroid analysis
  avd_headless: false  # Start AVD with UI by default
  avd_auto_start: false  # Don't auto-start AVD by default

frida:
  server_auto_start: true
  server_port: 27042
  spawn_timeout: 30

network:
  # capture_interface: eth0  # Optional: auto-detected if not provided
  pcap_buffer_size: 65536
  connection_timeout: 30

paths:
  results_path: ./results/
  raw_results_path: ./results/raw/
  temp_path: ""  # Empty = use system temp dir (platform-agnostic)
  cache_path: ~/.cache/sandroid/

analysis:
  number_of_runs: 2
  avoid_strong_noise_filter: false
  capture_processes: true
  capture_sockets: false
  capture_network: false
  show_deleted_files: false
  hash_files: false
  list_apks: false
  degrade_network: false
  # screenshot_interval: 5  # Optional: take screenshots every N seconds

trigdroid:
  enabled: false
  # package_name: com.example.malware  # Required when enabled
  # config_mode: I  # I for interactive, D for default

ai:
  # Chat/agent LLM connection — all three must be set together to use the Chat tab.
  # Any OpenAI-compatible chat-completions endpoint works (OpenAI itself, Ollama,
  # vLLM, LM Studio, an internal gateway, ...).
  # base_url: https://api.openai.com/v1
  # api_key: your-api-key-here  # Better to use SANDROID_AI__API_KEY env var
  # model: gpt-4o

report:
  generate_pdf: false
  include_screenshots: true
  # template_path: /path/to/custom/template.html  # Optional: custom report template

# MCP (Model Context Protocol) client — lets Sandroid's Chat feature call tools
# hosted by external MCP servers. A bundled dummy server (proving the MCP
# pipeline works end-to-end) is enabled by default with no config needed here.
# mcp:
#   servers:
#     - name: my-external-server
#       transport: stdio
#       command: /usr/bin/some-mcp-server
#       args: ["--flag", "value"]
#       enabled: true

# Secure credentials (use environment variables for production)
credentials:
  custom_api_keys: {}

# Custom settings (add your own as needed)
custom: {}
