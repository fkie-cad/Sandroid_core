# Sandroid Default Configuration (YAML reference copy)
# This file contains default settings for Sandroid analysis framework.
# default.toml is the authoritative template; this copy mirrors it.
# Copy this file to your config directory and customize as needed

# Core Settings
log_level: INFO
output_file: sandroid.json
environment: production
# whitelist_file: /path/to/whitelist.txt  # Optional: exclude paths from analysis

emulator:
  device_name: Pixel_6_Pro_API_31
  # android_emulator_path: ~/Android/Sdk/emulator/emulator  # Optional: auto-detected if not provided
  # sdk_path: ~/Android/Sdk  # Optional: auto-detected if not provided
  # adb_path: ~/Android/Sdk/platform-tools/adb  # Optional: auto-detected if not provided
  # avd_home: ~/.android/avd  # Optional: auto-detected if not provided
  avd_headless: false  # First launch of an AVD with UI (Devices screen remembers per AVD)
  # Host-memory cap for the active emulator's qemu (GB; physical footprint on
  # macOS, resident memory elsewhere). The enforced cap is never below the AVD's
  # RAM + 4 GB (2 x RAM + 4 GB for resident memory). Above it on two readings
  # Sandroid stops the emulator ("kill") or only warns ("warn"). 0 disables it.
  max_host_memory_gb: 10
  memory_guard_action: kill
  # Set the device clock to host time at session start and after snapshot
  # loads when it is more than 1 s off (old name: sync_clock_after_snapshot)
  sync_device_clock: true

frida:
  server_auto_start: true
  server_port: 27042
  spawn_timeout: 30

network:
  # capture_interface: eth0  # Optional: auto-detected if not provided
  pcap_buffer_size: 65536
  connection_timeout: 30

paths:
  results_path: ./results/
  raw_results_path: ./results/raw/
  temp_path: ""  # Empty = use system temp dir (platform-agnostic)
  cache_path: ~/.cache/sandroid/

analysis:
  number_of_runs: 2
  avoid_strong_noise_filter: false
  # Hide well-known Android/GMS background files; they stay in the result
  # JSON under "Other Data" -> "Filtered Noise". false = show everything.
  system_noise_filter: true
  noise_patterns: []        # extra globs, e.g. "/data/*/com.example.sync/*"
  protected_packages: []    # never filtered (the spotlight app always is)
  capture_processes: true
  capture_sockets: false
  capture_network: false
  show_deleted_files: false
  # Keep capturing N seconds after each replay (and the dry run) so slow
  # network responses still land in the run. 0 = stop with the replay.
  replay_settle_seconds: 8
  # After every snapshot load (before each replay and the dry run) briefly cycle
  # the device network so connections restored from the snapshot fail fast and
  # the app reconnects. airplane | svc (svc wifi/data) | off.
  network_reset_after_snapshot: airplane
  hash_files: false
  list_apks: false
  degrade_network: false

ai:
  # EXPERIMENTAL AI Chat (Ctrl+Y) — OFF until base_url, api_key and model are
  # all set. Your prompts plus device and app data (tool results, live session
  # state, file contents) are sent to base_url. Use a LOCAL OpenAI-compatible
  # server:
  # base_url: http://localhost:11434/v1   # Ollama  (vLLM: http://localhost:8000/v1)
  # model: qwen2.5:14b
  # api_key: prefer the SANDROID_AI__API_KEY environment variable — a key written
  # here is stored in PLAINTEXT. Local servers that ignore keys accept any value.
  # api_key: ollama
  # Only loopback endpoints are used unless you explicitly opt in to sending
  # case data to a remote service (e.g. https://api.openai.com/v1):
  allow_remote: false
  mask_sensitive: false  # mask sensitive timeline lines in what the AI reads
  # row_classify:          # classify_rows (AI row highlights)
  #   concurrency: 2
  #   batch_rows: 40
  #   batch_tokens: 24000
  #   max_rows: 1000       # per call; the tool can raise it to 2000
  #   max_tokens: 16384  # reasoning included; cut-off replies retry with 2x

report:
  generate_pdf: false
  include_screenshots: true
  # template_path: /path/to/custom/template.html  # Optional: custom report template
  effects_window_s: 2.0
  shot_triggers: [before_tap, after_tap, screen_change, label, manual]
  formats: [pdf, md]

# The session timeline (<results>/<session>/<device>/timeline.jsonl).
timeline:
  sources: {files: true, monitor: true, net: true, input: true, screen: true, shot: true, ai: true}
  kinds_off: []
  count_only: [files.open, files.close]
  files_attrs: app_dirs  # app_dirs | lines | counts
  files_modify_coalesce_ms: 1000  # 0 = off
  count_window_s: 5.0
  queue_max: 10000
  clock_every_s: 60  # 0 = off
  mask_sensitive: false

# Tracking: the interaction transcript.
tracking:
  helper_mode: full  # full | invisible | off
  auto_on_record: true
  shot_before_tap: true
  shot_screen_change: true
  shot_after_tap: false
  shot_label: false
  mark_screenshots: true  # also store a marked copy of input shots
  settle_interval_ms: 300
  settle_max_ms: 2000
  capture_text: true
  text_idle_ms: 1500
  long_press_ms: 500
  swipe_slop_px: 24
  logcat_screen_backup: true

# Identity profile: distinctive fake values (Android ID, advertising ID, phone,
# GPS, contacts, ...) seeded on the emulator so privacy scans can find them.
# Profiles live in ~/.config/sandroid/profiles/<id>.yaml (comments kept).
identity:
  profile: ""  # id of the active profile
  mode: "off"  # off | profile
  restart: ask  # framework restart (SSAID/locale): ask | always | never

# MCP (Model Context Protocol) client — lets the (experimental) AI Chat call
# tools hosted by external MCP servers. No server is configured by default, and
# servers are only started when AI Chat is configured. MCP tools always ask for
# confirmation before running. For a pipeline test, Sandroid bundles a DEMO
# fixture that returns FAKE data only (never use its output as a finding):
# mcp:
#   servers:
#     - name: sandroid-demo-fake-data
#       command: python3
#       args: ["-m", "sandroid.ai.mcp_demo_server"]
#     - name: my-external-server
#       transport: stdio
#       command: /usr/bin/some-mcp-server
#       args: ["--flag", "value"]
#       enabled: true

# Secure credentials (use environment variables for production)
credentials:
  custom_api_keys: {}

# Custom settings (add your own as needed)
custom: {}
