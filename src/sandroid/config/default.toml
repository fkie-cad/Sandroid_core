# Sandroid Default Configuration
# This file contains default settings for Sandroid analysis framework
# Copy this file to ~/.config/sandroid/sandroid.toml and customize as needed

# Core Settings
log_level = "INFO"
output_file = "sandroid.json"
environment = "production"
# whitelist_file = "/path/to/whitelist.txt"  # Optional: exclude paths from analysis

[emulator]
device_name = "Pixel_6_Pro_API_31"
# android_emulator_path = "~/Android/Sdk/emulator/emulator"  # Optional: auto-detected if not provided
# sdk_path = "~/Android/Sdk"  # Optional: auto-detected if not provided
# adb_path = "~/Android/Sdk/platform-tools/adb"  # Optional: auto-detected if not provided
# Host-memory cap for the active emulator's qemu (GB; physical footprint on
# macOS, resident memory elsewhere). The enforced cap is never below the AVD's
# RAM + 4 GB (2 x RAM + 4 GB for resident memory). Above it on two readings
# Sandroid stops the emulator ("kill") or only warns ("warn"). 0 disables it.
max_host_memory_gb = 10
memory_guard_action = "kill"
# At session start and after every snapshot load, set the device clock to
# host time (root `date`) when it is more than 1 s off; the offset is recorded
# in the session timeline either way. (Old name, still read:
# sync_clock_after_snapshot.)
sync_device_clock = true

[frida]
server_auto_start = true
server_port = 27042
spawn_timeout = 30

[network]
# capture_interface = "eth0"  # Optional: auto-detected if not provided
pcap_buffer_size = 65536
connection_timeout = 30

[paths]
results_path = "./results/"
raw_results_path = "./results/raw/"
temp_path = ""  # Empty = use system temp dir (platform-agnostic)
cache_path = "~/.cache/sandroid/"

[analysis]
number_of_runs = 2
avoid_strong_noise_filter = false
# Hide well-known Android/GMS background files; they stay in the result
# JSON under "Other Data" -> "Filtered Noise". false = show everything.
system_noise_filter = true
noise_patterns = []        # extra globs, e.g. "/data/*/com.example.sync/*"
protected_packages = []    # never filtered (the spotlight app always is)
capture_processes = true
capture_sockets = false
capture_network = false
show_deleted_files = false
# Keep capturing N seconds after each replay (and the dry run) so slow
# network responses still land in the run. 0 = stop with the replay.
replay_settle_seconds = 8
# After every snapshot load (before each replay and the dry run) briefly cycle
# the device network so connections restored from the snapshot fail fast and
# the app reconnects. "airplane" | "svc" (svc wifi/data) | "off".
network_reset_after_snapshot = "airplane"
hash_files = false
list_apks = false
degrade_network = false

[trigdroid]
enabled = false
# package_name = "com.example.malware"  # Required when enabled
# config_mode = "I"  # I for interactive, D for default

[ai]
# EXPERIMENTAL AI Chat — OFF until base_url, api_key and model are all set.
# Your prompts plus device and app data (tool results, live session state,
# file contents) are sent to base_url. Use a LOCAL OpenAI-compatible server:
# base_url = "http://localhost:11434/v1"   # Ollama  (vLLM: http://localhost:8000/v1)
# model = "qwen2.5:14b"
# api_key: prefer the SANDROID_AI__API_KEY environment variable — a key written
# here is stored in PLAINTEXT. Local servers that ignore keys accept any value.
# api_key = "ollama"
# Only loopback endpoints are used unless you explicitly opt in to sending
# case data to a remote service (e.g. https://api.openai.com/v1):
allow_remote = false
# Mask the content of sensitive session-timeline lines (typed text, TLS keys)
# in what the AI reads.
mask_sensitive = false

[report]
generate_pdf = false
include_screenshots = true
# template_path = "/path/to/custom/template.html"  # Optional: custom report template
# Seconds after an input in which file/network lines count as its effects.
effects_window_s = 2.0
# Screenshot triggers shown in the report.
shot_triggers = ["before_tap", "after_tap", "screen_change", "label", "manual"]
# Formats written besides report.json.
formats = ["pdf", "md"]

[timeline]
# The session timeline: <results>/<session>/<device>/timeline.jsonl, one
# hash-chained JSON line per event (labels, file monitor, device clock,
# snapshots, record/play phases, ...). label, sandroid, clock, snapshot,
# device and run lines are always written.
sources = { files = true, monitor = true, net = true, input = true, screen = true, shot = true }
kinds_off = []                          # "src.kind" or "src.*": not written
count_only = ["files.open", "files.close"]  # only counted (<src>/count lines)
files_attrs = "app_dirs"                # app_dirs | lines | counts
files_modify_coalesce_ms = 1000         # merge files.modify per (path, pid); 0 = off
count_window_s = 5.0
queue_max = 10000                       # bulk lines queued per device before drops
clock_every_s = 60                      # periodic device-clock sample; 0 = off
mask_sensitive = false                  # mask typed text etc. in lens/exports/report

[tracking]
# Tracking: the interaction transcript (taps, typed text, screens, shots).
helper_mode = "full"                    # full | invisible | off
auto_on_record = true
shot_before_tap = true
shot_screen_change = true
shot_after_tap = false
shot_label = false
settle_interval_ms = 300
settle_max_ms = 2000
capture_text = true
text_idle_ms = 1500
long_press_ms = 500
swipe_slop_px = 24
logcat_screen_backup = true

[identity]
# Identity profile: distinctive fake values (Android ID, advertising ID, phone,
# GPS, contacts, ...) seeded on the emulator so privacy scans can find them.
# Profiles live in ~/.config/sandroid/profiles/<id>.toml.
profile = ""                            # id of the active profile
mode = "off"                            # off | profile
restart = "ask"                         # framework restart (SSAID/locale): ask | always | never

# MCP (Model Context Protocol) client — lets the (experimental) AI Chat call
# tools hosted by external MCP servers. No server is configured by default, and
# servers are only started when AI Chat is configured. MCP tools always ask for
# confirmation before running. For a pipeline test, Sandroid bundles a DEMO
# fixture that returns FAKE data only (never use its output as a finding):
# [[mcp.servers]]
# name = "sandroid-demo-fake-data"
# command = "python3"
# args = ["-m", "sandroid.ai.mcp_demo_server"]
#
# [[mcp.servers]]
# name = "my-external-server"
# transport = "stdio"
# command = "/usr/bin/some-mcp-server"
# args = ["--flag", "value"]
# enabled = true

[theme]
# Theme preset for terminal colors
# Available presets: default, dark, light, high_contrast
preset = "default"

[tui]
# TUI (Terminal User Interface) settings
# Theme for TUI mode
# Available themes: default, dark, light, paper, daylight, high_contrast, cyberpunk, nord,
#   dracula, solarized, graphite, deep_sea, evergreen
theme = "default"
# Show theme name in status bar (disabled by default)
show_theme_indicator = false
# Custom CSS file for TUI styling (optional)
# If set, this file will be used instead of the default styles.tcss
# You can copy the default styles.tcss as a starting point and customize it
# custom_css_path = "~/.config/sandroid/custom-styles.tcss"

# Logo color customization (optional)
# These override the theme's default logo colors
# Use hex colors like "#00ff00" or "ff00ff" (with or without #)
# logo_color = "#00ff00"        # Main ASCII art color (bright green by default)
# logo_text_color = "#ffffff"   # "Sandroid" text highlight color (white by default)

# Monitor output buffer interval (seconds). Lower = faster, higher CPU. 0 = near-realtime.
# monitor_buffer_interval = 0.15
# Maximum lines kept in Monitor observer (50-10000). Higher = more scrollback, more memory.
# monitor_max_lines = 500
# Filesystem monitor backend: "kprobe" (kernel tracefs kprobes, auto-falls-back
# to fsmon when unsupported) or "fsmon" (the fsmon binary).
# monitor_backend = "kprobe"
# Files lens: pull a watched (★) file automatically when the file monitor sees
# a write to it (debounced ~1.5 s; db + -wal + -journal are one group).
# auto_pull_on_change = true
# File monitor, App mode: follow the app (every process, restarts and new
# processes; kprobe) instead of one PID. Default for the monitor dialog.
# monitor_follow_app = true
# Files lens path rules (edited live in the Files lens with R): "hide" drops
# matching rows (N shows everything), "group" collapses them into one row per
# folder. kind = prefix | segment | suffix | glob. Default: hide OS paths
# (/proc/ /sys/ /dev/ /system/ /apex/ /vendor/ /product/ /data/dalvik-cache/
# /data/misc/ /data/system/ /data/app/), group cache/ and code_cache/.
# files_noise_rules = [
#   { action = "hide", kind = "prefix", pattern = "/proc/", enabled = true },
#   { action = "group", kind = "segment", pattern = "cache", enabled = true },
# ]

# Device Paths - Android device filesystem paths
# Override these to match non-standard device setups
[device_paths]
# frida_install_dir = "/data/local/tmp/"
# fsmon_binary_base = "/data/local/tmp/fsmon-{arch}"
# default_monitor_path = "/data/"
# scan_directories = ["/data", "/storage", "/sdcard"]
# device_cert_path = "/data/local/tmp/cert-der.crt"
# system_ca_path = "/system/etc/security/cacerts"

# External URLs - Override for internal mirrors or alternative sources
[external_urls]
# frida_releases_url = "https://github.com/frida/frida/releases"
# frida_api_url = "https://api.github.com/repos/frida/frida/releases/"
# frida_download_url = "https://github.com/frida/frida/releases/download/"
# mvt_github_base = "https://raw.githubusercontent.com/mvt-project/mvt/main/"
# stalkerware_ioc_url = "https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/stalkerware.stix2"

# Display - Output formatting widths and limits
[display]
# section_width = 60
# line_length_cutoff = 150
# line_number_cutoff = 50
# box_width = 60
# spotlight_box_width = 70
# fridump_max_size = 20971520

# Custom settings (add your own as needed)
[custom]
# my_setting = "value"
