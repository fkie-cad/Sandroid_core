name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      # tools/test.sh builds its deps-only venv with uv (constraints from
      # tools/test-constraints.txt, pytest-xdist from the dev extra).
      UV_COMPILE_BYTECODE: '1'
      SANDROID_TEST_PYTHON: python${{ matrix.python-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          tools/test-constraints.txt

    - name: Run test suite (tools/test.sh full)
      # The same entry point as on developer machines: hermetic env, stub
      # adb/emulator/frida on PATH, tests/conftest.py's device guard, a
      # parallel pass without perf/quarantine tests and then the perf tests
      # serially. With CI=true, -n auto means one worker per CPU.
      # Exit 3 (a test failed, then passed when rerun alone) is reported as
      # a warning and in the job summary, not as a failed job.
      run: |
        rc=0
        tools/test.sh full -n auto || rc=$?
        if [ "$rc" -eq 3 ]; then
          echo "::warning title=Flaky tests::failed once and passed on the serial rerun (see the job summary)"
          exit 0
        fi
        exit "$rc"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .test-results/
          !.test-results/latest
        retention-days: 14
        if-no-files-found: ignore

  package:
    name: Build & check distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist & wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Install wheel into a clean venv and smoke-test the entry points
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/python -m pip install dist/*.whl
        /tmp/wheel-venv/bin/python -c "import sandroid, sandroid._version as v; print(v.__version__)"
        /tmp/wheel-venv/bin/sandroid --help > /dev/null
        /tmp/wheel-venv/bin/sandroid-config --help > /dev/null

  uihelper:
    name: UI helper builds from source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install what importing sandroid.core needs
      # Only the package __init__ chain (config schema/loader), not the full
      # dependency set: this job just reads uihelper.SOURCE_SHA256.
      run: python -m pip install pydantic platformdirs tomli-w pyyaml

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install android-35 platform and build-tools
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Build the helper and check SOURCE_SHA256
      # The jar hash itself is not compared here: d8 output is not byte-stable
      # across build-tools versions. tests/core/test_uihelper.py checks the
      # committed jar against JAR_SHA256 instead.
      run: |
        BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" tools/uihelper/build.sh | tee build.log
        built=$(sed -n 's/^SOURCE_SHA256=//p' build.log)
        expected=$(python -c "import sys; sys.path.insert(0,'src'); from sandroid.core import uihelper; print(uihelper.SOURCE_SHA256)")
        echo "built=$built expected=$expected"
        test -n "$built" && test "$built" = "$expected"
