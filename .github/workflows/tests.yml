name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install Sandroid with dev + full extras
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,full]"

    - name: Run test suite
      # tests/conftest.py blocks every adb/emulator/frida call, so no
      # Android SDK or device is needed (or touched) here.
      run: |
        python -m pytest -ra

  package:
    name: Build & check distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build sdist & wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Install wheel into a clean venv and smoke-test the entry points
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/python -m pip install dist/*.whl
        /tmp/wheel-venv/bin/python -c "import sandroid, sandroid._version as v; print(v.__version__)"
        /tmp/wheel-venv/bin/sandroid --help > /dev/null
        /tmp/wheel-venv/bin/sandroid-config --help > /dev/null
