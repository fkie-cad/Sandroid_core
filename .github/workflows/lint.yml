name: Lint Code with Ruff

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Keep the ruff pin in sync with pyproject.toml ([dev] extra)
        python -m pip install --upgrade "ruff==0.12.7" mypy
        # Minimal deps needed for type checking only
        python -m pip install pydantic typing-extensions

    - name: Run Ruff linter
      run: |
        ruff check . --output-format=github

    - name: Run Ruff formatter check
      run: |
        ruff format --check .

    - name: Run MyPy type checking
      run: |
        mypy src/sandroid --ignore-missing-imports --no-strict-optional --allow-redefinition || echo "MyPy completed with warnings"

    - name: Check import sorting
      run: |
        ruff check . --select I --output-format=github

  security-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install "bandit[toml]" safety "ruff==0.12.7"

    - name: Run Bandit security linter
      run: |
        bandit -r src/ -f json -o bandit-report.json -c pyproject.toml || true
        bandit -r src/ -ll -c pyproject.toml

    - name: Run Safety check
      # Informational only: `safety check` needs network access to the
      # vulnerability DB (and an API key on newer releases), and flags
      # transitive dependencies we do not pin.
      continue-on-error: true
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Run Ruff security rules
      run: |
        ruff check . --select S --ignore S101,S104,S108,S110,S112,S113,S310,S324,S602,S603,S605,S607,S608 --output-format=github

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit "ruff==0.12.7" mypy bandit

    - name: Run pre-commit hooks
      run: |
        # Run hooks individually to avoid dependency issues
        pre-commit run trailing-whitespace --all-files || echo "Trailing whitespace check completed"
        pre-commit run end-of-file-fixer --all-files || echo "End of file fixer completed"
        pre-commit run check-yaml --all-files || echo "YAML check completed"
        pre-commit run ruff --all-files || echo "Ruff check completed"
        pre-commit run ruff-format --all-files || echo "Ruff format completed"
